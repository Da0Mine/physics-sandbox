  d.wx=x;d.wy=y;d.vx=vx||0;d.vy=vy||0;d.cat=cat;
  if(freeL.indexOf(d)<0)freeL.push(d);
  d.el.classList.remove('dockin');
  placeLetter(d);
}
function pickFromDock(d){
  var r=panel.getBoundingClientRect();
  d.state='grab';d.body=null;
  d.wx=pointer.x;d.wy=pointer.y;d.vx=0;d.vy=0;
  placeLetter(d);
}
function attach(B,d){
  if(B.mem.indexOf(d)>=0)return;
  var mi=freeL.indexOf(d);if(mi>=0)freeL.splice(mi,1);
  var pv=null;
  if(B.massG&&B.massG.sx!=null)pv={sx:B.massG.sx,sy:B.massG.sy};
  d.state='mem';
  B.mem.push(d);
  d.body=B;d.inBody=true;
  B.pop=1;
  refresh(B);
  var hh=Math.max(20,B.hh||18);
  if(B.y+hh>groundY){B.y=groundY-hh;B.vy=-Math.abs(B.vy)*0.5;}
  if(pv)keepMass(B,pv);
  ringGo(B.x,B.y);
}
function keepMass(B,pv){
  var m=B.massG;if(!m)return;
  var th=B.th||0,c=Math.cos(th),s=Math.sin(th);
  var dx=pv.sx-m.sx,dy=pv.sy-m.sy;
  B.x+=dx*c-dy*s;
  B.y+=dx*s+dy*c;
}
function splitOne(B,d){
  var i=B.mem.indexOf(d);
  if(i<0){
    i=-1;
    for(var q=B.mem.length-1;q>=0;q--)if(B.mem[q].type==='v')i=q;
    if(i<0)i=B.mem.length-1;
    if(i<0)return;
    d=B.mem[i];
  }
  var out=[d];
  if(d.type==='v'&&B.vCount>=2&&(B.hasR||B.hasHalf)){
    for(var k=B.mem.length-1;k>=0;k--){
      var tk=B.mem[k].type;
      if((tk==='r'||tk===HALF)&&out.indexOf(B.mem[k])<0)out.push(B.mem[k]);
    }
  }
  var pv=null;
  if(B.massG&&B.massG.sx!=null)pv={sx:B.massG.sx,sy:B.massG.sy};
  var msvx=B.vx,msvy=B.vy;
  for(var j=0;j<out.length;j++){
    var g=out[j],mi2=B.mem.indexOf(g);
    if(mi2>=0)B.mem.splice(mi2,1);
    g.body=null;g.inBody=false;g.state='free';g.pop=0;
  }
  refresh(B);
  if(pv)keepMass(B,pv);
  var dir=Math.random()*6.2832, dx=Math.cos(dir), dy=Math.sin(dir), sep=75;
  B.vx=msvx+dx*sep; B.vy=msvy+dy*sep;
  for(var n=0;n<out.length;n++){
    var L=out[n], sp=slot(B,L);
    var fi=freeL.indexOf(L); if(fi>=0)freeL.splice(fi,1);
    freeLetter(L, sp.x, sp.y, msvx-dx*sep+(Math.random()*24-12), msvy-dy*sep+(Math.random()*24-12), false);
  }
}
function canMerge(B,d){
  if(!B||B.kind)return false; // field bodies (B/q/I) are not letter-merge targets
  if(B.bh)return false;       // a black hole devours letters — never merges with them
  var t=d.type;
  if(t==='t')return false;   // 't' only forms combos (gt→v, qt→I, vt→rod), never an inert formula letter
  if(isMass(t)){
    var hasM=false,hasm=false;
    if(B.massG){if(B.massG.type==='M')hasM=true;else if(B.massG.type==='m')hasm=true;}
    for(var mi=0;mi<B.mem.length;mi++){
      var mt=B.mem[mi].type;
      if(mt==='M')hasM=true;else if(mt==='m')hasm=true;
    }
    // two IDENTICAL masses can never merge (mm / MM): every formula needs at most one M
    // and one m. Different masses (M+m) are still allowed so the build order stays free.
    if(t==='M'&&hasM)return false;
    if(t==='m'&&hasm)return false;
    var nM=(hasM?1:0)+(hasm?1:0);
    if(B.hasGrav){
      if(B.cCount>=1)return false;   // on the 2GM/c² path (G M c …) the masses are settled
      if(nM>=2)return false;         // GMm already has its two masses (M and m)
      if(B.mem.length>=5)return false;
      return true;
    }
    // before G is attached: allow stacking M+m (so m→M→G and M→m→G both work)
    if(nM>=2)return false;
    return true;
  }
  if(t==='c'){
    var cc=0;
    for(var cci=0;cci<B.mem.length;cci++)if(B.mem[cci].type==='c')cc++;
    if(cc>=2)return false;
    if(B.hasV||B.hasR||B.hasHalf)return false;
    // into a gravity body (GMc -> GMc², on the way to 2GM/c²): allow up to 2 c's
    if(B.hasGrav)return B.mem.length<4;
    // into a mass-only body (mc²): keep it small
    if(B.mem.length>=2)return false;
    return true;
  }
  if(t==='G'){
    if(B.hasGrav)return false;
    if(B.family===2)return false;          // don't drop G into a v/r formula
    // into an empty / mass-only body, or a mass-with-c body (M+c -> GMc -> GMc² -> 2GM/c²)
    if(B.hasC){if(B.mem.length>=1)return false;return true;}
    if(B.mem.length>=2)return false;
    return true;
  }
  var fam=(t==='g'||t==='a'||t===MU||t==='c'||t==='G')?1:2;
  if(B.family&&B.family!==fam&&!B.hasGrav)return false;
  if(t==='r'||t===HALF){
    if(t==='r'){if(B.hasGrav){if(B.rCount>=2)return false;if(B.mem.length>=5)return false;return true;}for(var i=0;i<B.mem.length;i++)if(B.mem[i].type==='r')return false;}
    else{for(var i2=0;i2<B.mem.length;i2++)if(B.mem[i2].type===HALF)return false;}
    if(B.vCount<2)return false;
    if(B.mem.length>=3)return false;
    return true;
  }
  if(t==='v'){
    if(B.vCount>=2)return false;
    if(B.mem.length>=3)return false;
    return true;
  }
  for(var k=0;k<B.mem.length;k++)if(B.mem[k].type===t)return false;
  if(B.mem.length>=2)return false;
  return true;
}
function findMergeTarget(d){
  var best=null,bd=1e9;
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.massG===d||B.mem.indexOf(d)>=0)continue;
    if(!canMerge(B,d))continue;
    var s=B.massG?slot(B,B.massG):{x:B.x,y:B.y};
    var dist=Math.hypot(s.x-d.wx,s.y-d.wy);
    if(dist<bd){bd=dist;best=B;}
  }
  return bd<200?best:null;
}
// a loose mass letter on the canvas (left over from a shatter or a split) can be a merge
// target just like a body: drop another letter onto it and it is promoted to the base of a
// fresh body on the spot (instead of requiring the player to nudge it first).
function findFreeMassTarget(d){
  var best=null,bd=200;
  for(var i=0;i<freeL.length;i++){
    var F=freeL[i];
    if(F===d||F.dead||F.state!=='free')continue;
    if(!isMass(F))continue;
    var dist=Math.hypot(F.wx-d.wx,F.wy-d.wy);
    if(dist<bd){bd=dist;best=F;}
  }
  return best;
}
function findFreeLetterTarget(B){
  var best=null,bd=200;
  for(var i=0;i<freeL.length;i++){
    var L=freeL[i];
    if(!canMerge(B,L))continue;
    var dx=L.wx-B.x,dy=L.wy-B.y;
    var d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=L;}
  }
  return best;
}

    }
    var t2=GD(d.ch);
    t2.cat=1;t2.pop=0;

    t2.wx=cx;t2.wy=cy;

  if(d.state==='free'||d.state==='grab'){
    grab={kind:'letter',obj:d,gx:pointer.x-d.wx,gy:pointer.y-d.wy,lx:pointer.x,ly:pointer.y,t:performance.now(),start:pointer.x};

}

cv.addEventListener('pointerdown',function(e){
  var hit=null;
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    var dx=pointer.x-B.x,dy=pointer.y-B.y;
    var th=B.th||0,c=Math.cos(th),s=Math.sin(th);

    grab={kind:'body',obj:hit,gx:pointer.x-hit.x,gy:pointer.y-hit.y,lx:pointer.x,ly:pointer.y,t:performance.now(),svx:hit.vx,svy:hit.vy,start:pointer.x,x0:pointer.x,y0:pointer.y};

});
DD.addEventListener('pointermove',function(e){
  pointer.x=e.clientX;pointer.y=e.clientY;
  if(trashDrag.active){
    trash.style.left=(pointer.x-17)+'px';
    trash.style.top=(pointer.y-17)+'px';
    eraseUnderTrash();
    return;
  }
  var onT=(grab.kind==='letter'||grab.kind==='body')&&inTrash(pointer.x,pointer.y);
  trash.classList.toggle('on',onT);
  if(grab.kind==='body'){
    var B=grab.obj;
    B.x=pointer.x-grab.gx;B.y=pointer.y-grab.gy;
    var dt=(performance.now()-grab.t)/1000||0.016;
    if(dt>0){
      var spx=(pointer.x-grab.lx)/dt,spy=(pointer.y-grab.ly)/dt;
      grab.svx=spx;grab.svy=spy;
      B.vx=spx;B.vy=spy;
    }
    grab.lx=pointer.x;grab.ly=pointer.y;grab.t=performance.now();
    var ft=findFreeLetterTarget(B);
    cv.style.cursor=ft?'copy':'grabbing';
  }else if(grab.kind==='letter'){
    var L=grab.obj;
    L.wx=pointer.x-grab.gx;L.wy=pointer.y-grab.gy;
    placeLetter(L);
    var dtt=(performance.now()-grab.t)/1000||0.016;
    if(dtt>0){grab.svx=(pointer.x-grab.lx)/dtt;grab.svy=(pointer.y-grab.ly)/dtt;}
    grab.lx=pointer.x;grab.ly=pointer.y;grab.t=performance.now();
    var h=findMergeTarget(L);
    cv.style.cursor=h?'copy':'default';
  }else if(grab.kind==='rot'){
    var Rb=grab.obj,s=tAnchor(Rb);
    var a0=Math.atan2(grab.ly-s.y,grab.lx-s.x);
    var a1=Math.atan2(pointer.y-s.y,pointer.x-s.x);
    Rb.th=shortAng(Rb.th+(a1-a0));
    grab.lx=pointer.x;grab.ly=pointer.y;
  }
});
DD.addEventListener('pointerup',function(e){
  pointer.x=e.clientX;pointer.y=e.clientY;
  if(trashDrag.active){
    trash.style.left='';trash.style.top='';
    trash.style.right='24px';trash.style.bottom='24px';
    trash.classList.remove('on');
    trashDrag.active=false;
    grab.kind=null;grab.obj=null;
    return;
  }
  trash.classList.remove('on');
  if(grab.kind==='body'){
    var B=grab.obj;
    if(inTrash(pointer.x,pointer.y)){
      if(B.bh){explodeBlackHole(B);}   // a live black hole dropped in the trash DETONATES
      else{killBody(B);}
      grab.kind=null;grab.obj=null;
      return;
    }
    if(inPanel(pointer.x,pointer.y)&&!B.kind){
      // drop a formula body back onto the panel box -> its letters dock into the box
      for(var pi2=B.glyphs.length-1;pi2>=0;pi2--){if(B.glyphs[pi2].stk)killG(B.glyphs[pi2]);}
      var rl=[];if(B.massG)rl.push(B.massG);
      for(var mi3=0;mi3<B.mem.length;mi3++){if(B.mem[mi3]!==B.massG)rl.push(B.mem[mi3]);}
      for(var ri=0;ri<rl.length;ri++){
        var LG=rl[ri];
        if(LG.body===B){LG.body=null;LG.inBody=false;}
        LG.pop=0;
        dockLetter(LG);
      }
      killBody(B);
      grab.kind=null;grab.obj=null;
      return;
    }
    if(B.kind){
      // spawned field symbol (B/q/I) dragged back onto the panel box -> remove it
      if(inPanel(pointer.x,pointer.y)){
        killBody(B);
        grab.kind=null;grab.obj=null;
        return;
      }
      var sp2=Math.hypot(grab.svx,grab.svy);
      var sp2=Math.hypot(grab.svx,grab.svy);
      if(sp2>20){var f2=clamp(1-sp2/6000,0.5,1);B.vx=grab.svx*f2;B.vy=grab.svy*f2;}
      else{B.vx=0;B.vy=0;}
      grab.kind=null;grab.obj=null;
      return;
    }
    var ds=dblState;
    var didSplit=false;
    if(ds.body===B){
      var mvd=Math.hypot(pointer.x-ds.x,pointer.y-ds.y);
      var now=performance.now();
      if(mvd<14){
        if(ds.t>0&&now-ds.t<500){
          splitOne(B,ds.g);
          ds.t=0;ds.body=null;ds.g=null;
          didSplit=true;
        }else{
          ds.t=now;ds.x=pointer.x;ds.y=pointer.y;
        }
      }else{
        ds.t=0;ds.body=null;
      }
    }
    if(didSplit){
      grab.kind=null;grab.obj=null;
      return;
    }
    if(Math.abs(grab.svx)>20||Math.abs(grab.svy)>20){
      var f=clamp(1-Math.hypot(grab.svx,grab.svy)/6000,0.5,1);
      B.vx=grab.svx*f;B.vy=grab.svy*f;
    }else{
      B.vx=0;B.vy=0;
    }
    var fl=findFreeLetterTarget(B);
    if(fl){attach(B,fl);}
  }else if(grab.kind==='letter'){
    dblState.t=0;
    var L=grab.obj;
    if(inTrash(pointer.x,pointer.y)){
      killLetter(L);
      grab.kind=null;grab.obj=null;
      return;
    }
    if(inPanel(pointer.x,pointer.y)){
      // dropped back onto the panel box -> returns to box and disappears
      killLetter(L);
      grab.kind=null;grab.obj=null;
      return;
    }
    if(L.ch==='B'||L.ch==='q'||L.ch==='I'||L.ch==='E'){
      spawnField(L.ch,L.wx,L.wy,grab.svx||0,grab.svy||0);
      killLetter(L);
      grab.kind=null;grab.obj=null;
      return;
    }
    // 't' combos: qt -> I, gt -> v, vt -> rod (hijacks a simple body)
    var tc=findTComboTarget(L);
    if(tc){applyTCombo(L,tc);grab.kind=null;grab.obj=null;return;}
    var B2=findMergeTarget(L);
    if(B2){
      attach(B2,L);
    }else{
      // shatter/split leaves letters FREE on the canvas. A loose mass (m/M) must still work
      // as a base: promote it to a body right here, then merge the dragged letter into it.
      // (mc, mg, mv, mG, Mm … all assemble again without a manual nudge.)
      var FM=findFreeMassTarget(L);
      if(FM){
        var fi3=freeL.indexOf(FM);if(fi3>=0)freeL.splice(fi3,1);
        var nb3=BODY(FM.wx,FM.wy);
        FM.pop=0;FM.body=nb3;FM.inBody=true;
        nb3.massG=FM;nb3.glyphs=[FM];
        refresh(nb3);
        if(canMerge(nb3,L)){
          attach(nb3,L);
          ringGo(nb3.x,nb3.y);
        }else{
          // not a valid merge after all — undo the promotion and keep the old behaviour
          var ri3=bodies.indexOf(nb3);if(ri3>=0)bodies.splice(ri3,1);
          FM.body=null;FM.inBody=false;FM.pop=0;
          if(freeL.indexOf(FM)<0)freeL.push(FM);
          placeLetter(FM);
          if(isMass(L)||L.type==='G'){
            var nb=BODY(L.wx,L.wy);
            L.pop=0;L.body=nb;L.inBody=true;
            if(isMass(L)){ nb.massG=L; nb.glyphs=[L]; refresh(nb); }
            else { nb.glyphs=[L]; attach(nb,L); }
            ringGo(nb.x,nb.y);
          }else{
            L.state='free';
            var spd=Math.hypot(grab.svx,grab.svy);
            if(spd>40){L.vx=grab.svx*clamp(1-spd/8000,0.4,1);L.vy=grab.svy*clamp(1-spd/8000,0.4,1);}
            else{L.vx=0;L.vy=0;}
            if(freeL.indexOf(L)<0)freeL.push(L);
            placeLetter(L);
          }
        }
      }else if(isMass(L)||L.type==='G'){
      // no body nearby accepts it -> spawn a fresh body here.
      // Masses become the base (massG); G is routed through attach() so it lands in
      // mem (setF/layoutGrav read G from mem, not massG).
      var nb=BODY(L.wx,L.wy);
      L.pop=0;L.body=nb;L.inBody=true;
      if(isMass(L)){ nb.massG=L; nb.glyphs=[L]; refresh(nb); }
      else { nb.glyphs=[L]; attach(nb,L); }
      ringGo(nb.x,nb.y);
    }else{
      L.state='free';
      var spd=Math.hypot(grab.svx,grab.svy);
      if(spd>40){L.vx=grab.svx*clamp(1-spd/8000,0.4,1);L.vy=grab.svy*clamp(1-spd/8000,0.4,1);}
      else{L.vx=0;L.vy=0;}
      if(freeL.indexOf(L)<0)freeL.push(L);
      placeLetter(L);
    }
    }
    cv.style.cursor='default';
  }else if(grab.kind==='rot'){
  }
  grab.kind=null;grab.obj=null;
});

function stepPhysics(dt){
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.kind==='B'||B.kind==='E')continue;
    if(B.bh)continue;   // black holes (any stage) are handled by stepBlackHole, not normal physics
    if(grab.kind==='body'&&grab.obj===B)continue;
    if(B.shatterBlast){
      // mc² explosion blast: the whole body shatters into its own letters (already flung out
      // with a big outward kick whose speed decays fast via B.decay)
      B.shatterBlast=false;
      shatter(B,'split');   // letters inherit the outward kick; freeL damping decays it fast
      continue;
    }
    if(B.hasG)B.vy+=GRAV*dt;
    if(B.hasA){
      var th=B.th||0;
      B.vx+=-AACC*Math.cos(th)*dt;
      B.vy+=-AACC*Math.sin(th)*dt;
    }

function stepFormulas(dt){

    var F=formulas[i];
    F.age+=dt;

      F.stoppedAt=null;
    }
    var damp=Math.pow(0.22,dt);
    F.vx*=damp;F.vy*=damp;
    F.x+=F.vx*dt;F.y+=F.vy*dt;
    var margin=22,e=0.9;
    if(F.x<margin){F.x=margin;if(F.vx<0)F.vx=-F.vx*e;}
    if(F.x>W-margin){F.x=W-margin;if(F.vx>0)F.vx=-F.vx*e;}
    if(F.y<margin){F.y=margin;if(F.vy<0)F.vy=-F.vy*e;}
    if(F.y>groundY-margin){F.y=groundY-margin;if(F.vy>0)F.vy=-F.vy*e;}
    var sp=Math.hypot(F.vx,F.vy);
    if(sp<26){ if(F.stoppedAt==null)F.stoppedAt=F.age; } else { F.stoppedAt=null; }

      var idle=F.age-F.stoppedAt-3.0;
      if(idle>0){
        var blink=0.35+0.65*Math.abs(Math.sin(F.age*6));
        var fade=clamp(1-idle/2.0,0,1);
        a=blink*fade;
        if(idle>=2.0){ killFormula(F); formulas.splice(i,1); continue; }
      }
    }
    F.alpha=a;
    var sc=F.sc||1;
    for(var j=0;j<F.glyphs.length;j++){
      var g=F.glyphs[j];
      g.el.style.left=(F.x+g.sx*sc)+'px';
      g.el.style.top=(F.y+g.sy*sc)+'px';
      g.el.style.transform='translate(-50%,-50%) scale('+sc+')';
      g.el.style.opacity=a;

function killFormula(F){

// BLAST WAVE (mc² explosion / black-hole detonation):
//  - whole bodies in range  -> shatter into their OWN letters, flung outward (letters
//    inherit the big kick and their speed decays fast — freeLetter damping)
//  - free letters in range  -> vaporized outright
//  - rendered formula shards -> blown away with an outward kick
function blastAt(cx,cy,R){

    var O=bodies[j];
    if(O.kind||O.bh)continue;
    if(grab.kind==='body'&&grab.obj===O)continue;
    var dx=O.x-cx,dy=O.y-cy;
    var d=Math.hypot(dx,dy);

    }

function stepExplode(dt){

      // can survive the drag: everything spirals in and gets swallowed.

function stepBlackHolePanel(B,bh,dt){

function maybeStartFinale(){
  if(BH_FINALE)return;
  if(grab.kind||trashDrag.active)return;
  var hole=null;
  for(var i=0;i<bodies.length;i++){
    var Bx=bodies[i];
    if(Bx.bh&&Bx.bh.stage===1){hole=Bx;break;}
  }
  if(!hole)return;
  var docked=false;
  var chars=panel.querySelectorAll('.char');
  for(var j=0;j<chars.length;j++){
    var ref=chars[j]._letterRef;
    if(ref&&ref.state==='dock'){docked=true;break;}
  }
  if(docked)return;                 // tray letters still remain to be eaten
  if(bodies.length>1)return;        // other bodies still being devoured
  if(freeL.length||formulas.length)return;   // debris still in flight
  // everything is consumed — begin the finale
  var bin=trash.getBoundingClientRect();
  hole.bh.finalizing=true;
  BH_FINALE={ph:'pull',t:0,hole:hole,
    hx:hole.x,hy:hole.y,
    bl:bin.left,bt:bin.top,bw:bin.width,bhh:bin.height,
    pullD:1.05,suckD:0.55,shakeD:0.85,letters:[],removed:false};
}
function suckPuff(x,y,tx,ty){
  for(var n=0;n<3;n++){
    var a=Math.random()*6.2832;
    particles.push({x:x+(Math.random()*10-5),y:y+(Math.random()*10-5),
      vx:Math.cos(a)*60+(tx-x)*1.6,vy:Math.sin(a)*60+(ty-y)*1.6,
      age:0,life:0.28+Math.random()*0.22,r:1+Math.random()*1.4,alpha:1});
  }
}
function finaleBurst(){
  var F=BH_FINALE;
  var pr=panel.getBoundingClientRect();
  var names=['mO','M2O','gO','aO','vO','rO','halfO','muO','cO','GO','tO','BO','EO','qO','IO'];
  var refs=[mO,M2O,gO,aO,vO,rO,halfO,muO,cO,GO,tO,BO,EO,qO,IO];
  for(var i=0;i<BH_CHARS.length;i++){
    var old=refs[i];
    if(old&&old.el&&old.el.parentNode)old.el.parentNode.removeChild(old.el);
    var nd=GD(BH_CHARS[i]);
    nd.cat=1;nd.pop=0;
    switch(names[i]){
      case 'mO':mO=nd;break;case 'M2O':M2O=nd;break;case 'gO':gO=nd;break;case 'aO':aO=nd;break;
      case 'vO':vO=nd;break;case 'rO':rO=nd;break;case 'halfO':halfO=nd;break;case 'muO':muO=nd;break;
      case 'cO':cO=nd;break;case 'GO':GO=nd;break;case 'tO':tO=nd;break;case 'BO':BO=nd;break;
      case 'EO':EO=nd;break;case 'qO':qO=nd;break;case 'IO':IO=nd;break;
    }

    var tgt=finaleSlot(i,pr);
    F.letters.push({d:nd,el:nd.el,x:F.bx||F.hx,y:F.by||F.hy,
                    vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,tx:tgt.x,ty:tgt.y,arr:false});
    place(nd,F.hx,F.hy,0,1,true);
  }

  ringGo(F.hx,F.hy);

function stepFinale(dt){
  if(!BH_FINALE){maybeStartFinale();return;}
  var F=BH_FINALE;
  F.t+=dt;
  if(F.ph==='pull'){
    // the hole drags the bin across the screen toward itself (accelerating)
    var e=Math.min(1,F.t/F.pullD);e=e*e;
    var bc=trashCenter();
    var sx=F.bl+F.bw/2,sy=F.bt+F.bhh/2;
    var cx=sx+(F.hx-sx)*e,cy=sy+(F.hy-sy)*e;
    trashTo(cx-F.bw/2,cy-F.bhh/2);
    if(F.t>=F.pullD){
      F.ph='suck';F.t=0;
    }
  }else if(F.ph==='suck'){
    // the hole shrinks and streams into the bin, then vanishes inside it
    var e2=Math.min(1,F.t/F.suckD);
    var h=F.hole;
    if(h.bh)h.bh.r=Math.max(1.5,BH_MAXR*(1-e2));
    if(Math.random()<0.8)suckPuff(h.x,h.y,F.hx,F.hy);
    if(F.t>=F.suckD){
      var hx=h.x,hy=h.y;
      var bi=bodies.indexOf(h);if(bi>=0)bodies.splice(bi,1);
      if(h.bh){h.bh.dead=true;}
      F.removed=true;
      burstParticles(hx,hy,20,1.2);
      shake(10,0.35);
      F.ph='shake';F.t=0;
    }
  }else if(F.ph==='shake'){
    // two diminishing bounces — something inside is trying to break out
    var p=Math.min(1,F.t/F.shakeD);
    var cyc=p*2.2,n2=Math.floor(cyc),f2=cyc-n2;
    var amp=(1-p)*11;
    var ox=(n2%2===0?1:-1)*Math.sin(f2*Math.PI)*amp;
    var oy=Math.sin(f2*Math.PI*1.7)*2.4*(1-p);
    trash.style.transform='translate('+ox.toFixed(1)+'px,'+oy.toFixed(1)+'px)';
    if(F.t>=F.shakeD){
      F.ph='fly';F.t=0;
      finaleBurst();
    }
  }else if(F.ph==='fly'){
    // letters burst out of the bin and glide back into their tray slots
    var any=false;
    for(var i=0;i<F.letters.length;i++){
      var L=F.letters[i];
      if(L.arr)continue;
      any=true;
      L.vx+=(L.tx-L.x)*24*dt;L.vy+=(L.ty-L.y)*24*dt;
      L.vx*=Math.pow(0.86,dt*60);L.vy*=Math.pow(0.86,dt*60);
      var sp2=Math.hypot(L.vx,L.vy);
      if(sp2>1500){L.vx*=1500/sp2;L.vy*=1500/sp2;}
      L.x+=L.vx*dt;L.y+=L.vy*dt;
      L.el.style.left=(L.x-L.el.offsetWidth/2)+'px';
      L.el.style.top=(L.y-L.el.offsetHeight/2)+'px';
      var d2=Math.hypot(L.tx-L.x,L.ty-L.y);
      if(d2<4&&sp2<140){
        L.arr=true;L.el.style.pointerEvents='';
        dockLetter(L.d);
      }
    }
    // the bin flies home while the letters do
    var e4=Math.min(1,F.t/1.1);
    var sc=trashCenter();
    var hx0=F.hx,hy0=F.hy;
    var hcx=F.bl+F.bw/2,hcy=F.bt+F.bhh/2;
    var cx2=hx0+(hcx-hx0)*e4,cy2=hy0+(hcy-hy0)*e4;
    trashTo(cx2-F.bw/2,cy2-F.bhh/2);
    var arrN=0;for(var k=0;k<F.letters.length;k++)if(F.letters[k].arr)arrN++;
    if(!any&&arrN===F.letters.length||F.t>4.5){
      for(var m2=0;m2<F.letters.length;m2++){
        var L2=F.letters[m2];
        if(!L2.arr){L2.arr=true;L2.el.style.pointerEvents='';dockLetter(L2.d);}
      }
      resetTrashPos();
      BH_FINALE=null;
      return;
    }
  }
}
function annihBody(O,idx){
  // the body is swallowed: it particleizes (letters burst) and merges into the hole
  var cx=O.x,cy=O.y;
  burstParticles(cx,cy,22,1.2);
  ringGo(cx,cy);
  var i=bodies.indexOf(O);if(i>=0)bodies.splice(i,1);
  if(O.go){var gD=O.go;if(gD.bin){var P2=gD.by;if(P2&&bodies.indexOf(P2)>=0){P2.vx=-Math.sin(gD.ang)*gD.w*gD.rad*gD.rP;P2.vy=Math.cos(gD.ang)*gD.w*gD.rad*gD.rP;P2.goB=null;}}O.go=null;}
  if(O.goB&&bodies.indexOf(O.goB)>=0){var H2=O.goB,gH2=H2.go;if(gH2){H2.vx=-Math.sin(gH2.ang)*gH2.w*gH2.rad*gH2.rB;H2.vy=Math.cos(gH2.ang)*gH2.w*gH2.rad*gH2.rB;H2.go=null;}O.goB.goB=null;}
  O.diss=true;
  for(var j=0;j<O.glyphs.length;j++){
    var g=O.glyphs[j];
    if(g.body===O){g.body=null;g.inBody=false;killLetter(g);}
  }
  O.glyphs=[];O.mem=[];
}
function burstParticles(cx,cy,n,sp){

    var v=140+Math.random()*320*sp;
    particles.push({x:cx+(Math.random()*16-8),y:cy+(Math.random()*16-8),vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,age:0,life:0.7+Math.random()*0.8,r:1.2+Math.random()*2.2,alpha:1});
  }

// a field source (B / E) or a charge/current (q / I) swallowed by the hole: its field dies

function explodeBlackHole(B){

  }

function drawParticles(){

    cvx.fillStyle=p.hot?('rgba(255,224,150,'+p.alpha+')'):('rgba(38,34,28,'+p.alpha+')');
    cvx.beginPath();cvx.arc(p.x,p.y,p.r,0,6.2832);cvx.fill();
  }
}
function drawFieldDots(cx,cy,R){
  cvx.fillStyle='rgba(38,34,28,0.16)';
  var sp=26;
  for(var gx=-R;gx<=R;gx+=sp){
    for(var gy=-R;gy<=R;gy+=sp){
      if(gx*gx+gy*gy<=R*R){
        cvx.beginPath();
        cvx.arc(cx+gx,cy+gy,1.7,0,6.2832);
        cvx.fill();
      }
    }
  }
  cvx.strokeStyle='rgba(38,34,28,0.10)';
  cvx.lineWidth=1;
  cvx.beginPath();
  cvx.arc(cx,cy,R,0,6.2832);
  cvx.stroke();
}
function drawFieldE(cx,cy,R,th){
  // E field: a SQUARE range (half-side hs) crossed by 9 LONG parallel arrows whose arrowheads
  // TOUCH the dashed border. Colour and alpha match the B field (38,34,28 @ ~0.18) so the
  // electric field is just as understated as the magnetic field rather than shouting for
  // attention.
  var hs=R/2;
  var dx=Math.cos(th),dy=Math.sin(th);        // field direction
  var px=-dy,py=dx;                           // perpendicular (spacing direction)
  var n=9,margin=3,al=11;                     // 9 long arrows; small margin so arrowhead reaches the border
  var ah=Math.atan2(dy,dx);
  cvx.strokeStyle='rgba(38,34,28,0.18)';      // matches B dots' ink
  cvx.fillStyle='rgba(38,34,28,0.18)';
  cvx.lineWidth=1.4;cvx.lineCap='round';
  for(var i=0;i<n;i++){
    var off=(i-(n-1)/2)*(2*hs/n);
    var ox=cx+px*off,oy=cy+py*off;            // anchor of this field line
    // clip the infinite line (ox,oy)+t*(dx,dy) to the square (slab method) so every arrow
    // spans exactly the part of the square it crosses — same length apart from the corners.
    var t0=-1e9,t1=1e9,okk=true;
    if(Math.abs(dx)>1e-6){
      var a1=(-hs-(ox-cx))/dx,a2=(hs-(ox-cx))/dx;
      t0=Math.max(t0,Math.min(a1,a2));t1=Math.min(t1,Math.max(a1,a2));
    }else if(Math.abs(ox-cx)>hs)okk=false;
    if(okk){
      if(Math.abs(dy)>1e-6){
        var b1=(-hs-(oy-cy))/dy,b2=(hs-(oy-cy))/dy;
        t0=Math.max(t0,Math.min(b1,b2));t1=Math.min(t1,Math.max(b1,b2));
      }else if(Math.abs(oy-cy)>hs)okk=false;
    }
    if(!okk||t1-t0<26)continue;
    var ax=ox+dx*(t0+margin),ay=oy+dy*(t0+margin);
    var bx=ox+dx*(t1-margin),by=oy+dy*(t1-margin);
    cvx.beginPath();cvx.moveTo(ax,ay);cvx.lineTo(bx,by);cvx.stroke();
    cvx.beginPath();
    cvx.moveTo(bx,by);
    cvx.lineTo(bx-al*Math.cos(ah-0.42),by-al*Math.sin(ah-0.42));
    cvx.lineTo(bx-al*Math.cos(ah+0.42),by-al*Math.sin(ah+0.42));
    cvx.closePath();cvx.fill();
  }
  cvx.strokeStyle='rgba(38,34,28,0.12)';      // matches the B circle border (0.10–0.12)
  cvx.lineWidth=1.2;
  cvx.setLineDash([7,6]);
  cvx.strokeRect(cx-hs,cy-hs,hs*2,hs*2);
  cvx.setLineDash([]);
}
function stepShake(dt){
  if(!shakeOn)return;
  shakeT+=dt;
  var k=clamp(1-shakeT/shakeDur,0,1);
  var a=shakeAmp*k;
  var dx=(Math.random()*2-1)*a;
  var dy=(Math.random()*2-1)*a;
  document.body.style.transform='translate('+dx+'px,'+dy+'px)';
  if(shakeT>=shakeDur){document.body.style.transform='';shakeOn=false;shakeAmp=0;shakeDur=0;}
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  groundY=Math.round(H*0.8);
  // full-screen reach: every point inside the canvas is influenced; pull tapers to 0 at the
  // diagonal so the boundary force is exactly zero and the influence feels total elsewhere
  BH_REACH=Math.hypot(W,groundY)+240;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cvx.setTransform(dpr,0,0,dpr,0,0);
}
function eOut(x){
  x=clamp(x,0,1);
  var c1=1.70158,c3=c1+1;
  return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);
}
function cubE(x){
  x=clamp(x,0,1);
  return 1-Math.pow(1-x,3);
}
function popScale(p){
  var x=1-clamp(p,0,1);
  var c1=1.70158,c3=c1+1;
  var v=1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);
  return 0.25+0.75*v;
}
function arrow(B,gx,gy,Cx,Cy,ddn){
  var dx=Cx-gx,dy=Cy-gy;
  var L=Math.hypot(dx,dy);
  if(L<26)return;
  var ux=dx/L,uy=dy/L;
  var al=0.3+0.45*ddn;
  var hl=11;
  var sl=Math.min(Math.max((B.hw||60)+4,10),L-hl-2);
  var a0=gx+ux*sl,b0=gy+uy*sl;
  var bx=Cx-ux*hl,by=Cy-uy*hl;
  cvx.strokeStyle='rgba(38,34,28,'+al+')';
  cvx.lineWidth=2;
  cvx.lineCap='round';
  cvx.beginPath();
  cvx.moveTo(a0,b0);
  cvx.lineTo(bx,by);
  cvx.stroke();
  cvx.fillStyle='rgba(38,34,28,'+al+')';
  cvx.beginPath();
  cvx.moveTo(Cx,Cy);
  cvx.lineTo(bx-uy*5.5,by+ux*5.5);
  cvx.lineTo(bx+uy*5.5,by-ux*5.5);
  cvx.closePath();
  cvx.fill();
}
function orbGeom(B){
  var o=B.orb;
  if(!o||o.k<0.02)return;
  var R=o.R||120;
  var Cx=B.x, Cy=B.y-R;
  var Rk=R*Math.max(o.k,0.001);
  var n=72,i;
  var pts=[];
  for(i=0;i<n;i++){
    var b=i/n*6.2832;
    pts.push([Cx+Rk*Math.cos(b),Cy+Rk*Math.sin(b)]);
  }
  cvx.strokeStyle='rgba(38,34,28,'+(0.45*Math.max(o.e,0.001))+')';
  cvx.lineWidth=1.6;
  cvx.setLineDash([7,6]);
  cvx.beginPath();
  for(i=0;i<n;i++){
    if(i)cvx.lineTo(pts[i][0],pts[i][1]);else cvx.moveTo(pts[i][0],pts[i][1]);
  }
  cvx.closePath();
  cvx.stroke();
  cvx.setLineDash([]);
  arrow(B,o.gx!=null?o.gx:B.x,o.gy!=null?o.gy:B.y,Cx,Cy,1);
}
function tickOrbs(dt){
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.pop&&B.pop>0)B.pop=Math.max(0,B.pop-dt*3.2);
    var o=B.orb;
    if(!o)continue;
    o.age+=dt;
    o.k=eOut(Math.min(o.age/0.55,1));
    o.e=cubE((o.age-0.18)/0.55);
    var R=o.R||120;
    var Rk=R*Math.max(o.k,0.001);
    if(!(grab.kind==='body'&&grab.obj===B))o.spin+=dt*0.8;
    o.gx=B.x+Rk*Math.cos(o.spin);
    o.gy=B.y-R+Rk*Math.sin(o.spin);
  }
}
function render(){
  cvx.clearRect(0,0,W,H);
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.frac&&B.st.bar&&!B.st.bar.dead){
      var ob=B.orb,oxB=(ob&&ob.k>=0.02&&ob.gx!=null)?(ob.gx-B.x):0,oyB=(ob&&ob.k>=0.02&&ob.gy!=null)?(ob.gy-B.y):0;
      var b=B.st.bar,th=B.th||0,sc=B.sc||1,ct=Math.cos(th),st=Math.sin(th);
      var s=slot(B,b);

      cvx.strokeStyle='rgba(38,34,28,0.85)';
      cvx.lineWidth=1.6;cvx.lineCap='round';
      cvx.beginPath();
      cvx.moveTo(s.x+oxB-Math.cos(th)*hw,s.y+oyB-Math.sin(th)*hw);
      cvx.lineTo(s.x+oxB+Math.cos(th)*hw,s.y+oyB+Math.sin(th)*hw);
      cvx.stroke();
      if(B.subBar){
        var sb=B.subBar,shw=(sb.w/2)*sc;
        var spx=B.x+oxB+(-sb.y*st)*sc,spy=B.y+oyB+(sb.y*ct)*sc;
        cvx.beginPath();
        cvx.moveTo(spx-Math.cos(th)*shw,spy-Math.sin(th)*shw);

        cvx.stroke();

    }
  }

    var B2=bodies[q];
    if(B2.orb)orbGeom(B2);
  }

  for(var gv=0;gv<bodies.length;gv++){
    var GV=bodies[gv];

    cvx.strokeStyle='rgba(120,80,30,0.38)';
    cvx.lineWidth=1.5;

    var tht=TB.th||0,cth=Math.cos(tht),sth=Math.sin(tht),hl=TB.len/2;
    var x1=TB.x-cth*hl,y1=TB.y-sth*hl,x2=TB.x+cth*hl,y2=TB.y+sth*hl;
    cvx.strokeStyle='rgba(38,34,28,0.85)';

    cvx.beginPath();cvx.moveTo(x1,y1);cvx.lineTo(x2,y2);cvx.stroke();
  }

  for(var fb=0;fb<bodies.length;fb++){
    var FB=bodies[fb];
    if(FB.kind==='B')drawFieldDots(FB.x,FB.y,FB.fieldR);
    else if(FB.kind==='E')drawFieldE(FB.x,FB.y,FB.fieldR,FB.th||0);
  }
  for(var qo=0;qo<bodies.length;qo++){
    var OB=bodies[qo];
    if(OB.kind==='q'&&OB.fieldState){

    }else if(OB.kind==='I'){
      var s2=null,bd2=1e9;
      for(var ss=0;ss<bodies.length;ss++){
        var S3=bodies[ss];
        if(S3.kind!=='B')continue;
        var d2=Math.hypot(OB.x-S3.x,OB.y-S3.y);
        if(d2<=S3.fieldR&&d2<bd2){bd2=d2;s2=S3;}
      }
      if(s2){
        var dir2=s2.Bz>0?1:-1;
        var fy2=Math.sign(A_FORCE*OB.Isign*dir2);
        arrow(OB,OB.x,OB.y,OB.x,OB.y+fy2*36,0.6);
      }
    }
  }
  for(var fi=0;fi<formulas.length;fi++){
    var F=formulas[fi];
    if(!F.bar)continue;
    var fsc=F.sc||1;
    cvx.strokeStyle='rgba(38,34,28,'+(0.85*F.alpha)+')';
    cvx.lineWidth=1.8;
    cvx.lineCap='round';
    cvx.beginPath();
    cvx.moveTo(F.x+F.bar.x1*fsc,F.y+F.bar.y*fsc);
    cvx.lineTo(F.x+F.bar.x2*fsc,F.y+F.bar.y*fsc);
    cvx.stroke();
  }
  // black holes: gravitational-lens rings (warped space) + dark hole + accretion ring
  for(var bhv=0;bhv<bodies.length;bhv++){
    var HB=bodies[bhv];
    if(HB.bh){
      drawBlackHole(HB);
    }
  }
  drawParticles();
}
function drawBlackHole(B){
  var bh=B.bh,cx=B.x,cy=B.y;
  var r=Math.max(4,bh.r);
  // ---- 1) gravitational lens: concentric distorted rings around the hole ----
  var rings=5;
  for(var li=0;li<rings;li++){
    var lr=r*1.15+li*13+Math.sin(bh.spin*1.4+li*1.9)*3;
    var wob=1+0.10*Math.sin(bh.spin*2.1+li*2.4);
    cvx.strokeStyle='rgba(38,34,28,'+(0.30-li*0.045)+')';
    cvx.lineWidth=1.6-li*0.18;
    cvx.beginPath();
    // a ring drawn as a wobbly ellipse: space is "stretched" tangentially
    var N=26;
    for(var n=0;n<=N;n++){
      var a=n/N*6.2832;
      var rr=lr*(wob+(0.05*Math.sin(3*a+bh.spin*1.7))*li*0.4);
      var xx=cx+Math.cos(a)*rr;
      var yy=cy+Math.sin(a)*rr*(0.92+0.06*Math.sin(2*a+bh.spin));
      if(n===0)cvx.moveTo(xx,yy);else cvx.lineTo(xx,yy);
    }
    cvx.stroke();
  }
  // lens streaks: short arcs tangentially smeared (space warping streaks)
  cvx.strokeStyle='rgba(38,34,28,0.22)';
  cvx.lineWidth=1.2;
  for(var s2=0;s2<8;s2++){
    var sa=bh.spin*0.9+s2*0.7854;
    var sr=r*1.3+(s2%3)*10;
    cvx.beginPath();
    cvx.arc(cx,cy,sr,sa,sa+0.9);
    cvx.stroke();
  }
  // ---- 2) accretion disk: a MONOCHROME swirl of dark streaks just outside the horizon.
  // Everything on this canvas is ink-black line art — no colour anywhere.
  for(var ai=0;ai<3;ai++){
    var ar=r+4+ai*4;
    cvx.strokeStyle='rgba(38,34,28,'+(0.55-ai*0.13)+')';
    cvx.lineWidth=3.4-ai*0.9;
    cvx.beginPath();
    cvx.arc(cx,cy,ar,bh.spin*2+ai*0.5,bh.spin*2+ai*0.5+4.6-ai*1.1);
    cvx.stroke();
  }
  // ---- 3) the hole itself: pure black core with a soft dark falloff ----
  var grd=cvx.createRadialGradient(cx,cy,r*0.2,cx,cy,r*1.05);
  grd.addColorStop(0,'rgba(0,0,0,1)');
  grd.addColorStop(0.78,'rgba(12,10,14,0.96)');
  grd.addColorStop(1,'rgba(20,18,22,0)');
  cvx.fillStyle=grd;
  cvx.beginPath();
  cvx.arc(cx,cy,r*1.05,0,6.2832);
  cvx.fill();
  // thin photon-ring edge (ink, not colour)
  cvx.strokeStyle='rgba(38,34,28,0.75)';
  cvx.lineWidth=1.4;
  cvx.beginPath();
  cvx.arc(cx,cy,r+1,0,6.2832);
  cvx.stroke();
}
function syncGlyphs(){
  var i,j,k;
  for(i=0;i<bodies.length;i++){
    var B=bodies[i];
    var bar=B.st.bar;
    if(bar&&!bar.dead)bar.el.style.display='none';
      var extra=(B.pop&&B.pop>0)?popScale(B.pop):1;
      var sc2=extra*(B.sc||1)*(B.infl||1);
      var th2=(B.th||0)+(B.wob||0);
      var ox=0,oy=0;
      if(B.orb&&B.orb.k>=0.02&&B.orb.gx!=null){ox=B.orb.gx-B.x;oy=B.orb.gy-B.y;}
      for(j=0;j<B.glyphs.length;j++){
        var g2=B.glyphs[j];
        if(g2.dead||g2.type===BAR)continue;
        var s2=slot(B,g2);
        place(g2,s2.x+ox,s2.y+oy,th2,sc2,true);
        g2.el.style.opacity=(B.bh&&B.bh.fade!=null)?B.bh.fade:(B.bhFade!=null?B.bhFade:'');
      }
  }
  for(k=0;k<freeL.length;k++){
    var d=freeL[k];
    if(d.dead){freeL.splice(k,1);k--;continue;}
    if(d.state==='free')placeLetter(d);
  }
}
function cursorTick(){
  if(grab.kind==='body'){cv.style.cursor='grabbing';return;}
  if(grab.kind==='letter'){cv.style.cursor=findMergeTarget(grab.obj)?'copy':'grabbing';return;}
  if(grab.kind==='rot'){cv.style.cursor='grabbing';return;}
  cv.style.cursor='default';
}
var G_RANGE=360, G_PULL=52000;
function stepGravity(dt){
  var gravs=[];
  for(var g=0;g<bodies.length;g++){var Gb=bodies[g];if(Gb.isWell)gravs.push(Gb);}
  // NOTE: no early return even without wells — binary-star pairs (two mv²/r wholes)
  // must be able to form on their own.
  function releaseGo(Bb){
    var go=Bb.go;if(!go)return;
    if(go.bin&&go.by&&bodies.indexOf(go.by)>=0){go.by.goB=null;}
    var tx=-Math.sin(go.ang),ty=Math.cos(go.ang);
    Bb.vx=tx*go.w*go.rad;Bb.vy=ty*go.w*go.rad;
    Bb.go=null;
  }
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.kind)continue;
    if(B.bh)continue;   // black holes do not orbit anything
    if(B.isWell)continue;
    if(grab.kind==='body'&&grab.obj===B)continue;
    if(B.goB){
      // partner of a binary pair — the holder integrates it; clear stale links only
      if(bodies.indexOf(B.goB)<0)B.goB=null;
      continue;
    }
    var best=null,bd=1e9,bcx=0,bcy=0;
    for(var k=0;k<gravs.length;k++){
      var Gb2=gravs[k];
      var dx=B.x-Gb2.x,dy=B.y-Gb2.y;
      var d=Math.hypot(dx,dy);
      if(d<bd){bd=d;best=Gb2;bcx=Gb2.x;bcy=Gb2.y;}
    }
    var isRot=(B.hasV&&B.hasR&&B.vCount>=2);
    // A COMPLETE gravity well (GMm/r²) DOMINATES anything inside its range: the mv²/r
    // whole is SIMPLY ATTRACTED to it like every other body — no fixed circular orbit
    // rail and no binary hijack while it sits inside the well's reach (that "stuck on a
    // circle" path the well used to force is gone). The binary-star pairing between two
    // mv²/r wholes is still available as long as no well is pulling on them.
    var wellHolds=!!(best&&bd<=G_RANGE&&!(grab.kind==='body'&&grab.obj===best));
    if(isRot&&!wellHolds){
      // BINARY-STAR pairing: two full mv²/r wholes within range orbit their COMMON
      // center of mass. m1·r1 = m2·r2 (the lighter one sweeps the wider circle) and
      // ω ∝ √(m_total / separation) — different M/m mixes visibly change the motion.
      // keep an existing binary link (don't let the partner-exclusion chatter the pair apart)
      var P=null,pp=1e9;
      if(B.go&&B.go.bin){
        var oldP=B.go.by;
        if(bodies.indexOf(oldP)>=0){P=oldP;pp=Math.hypot(P.x-B.x,P.y-B.y);}
        else B.go=null;
      }
      if(!P){
        for(var pk=0;pk<bodies.length;pk++){
          var C=bodies[pk];
          if(C===B)continue;
          if(!(C.hasV&&C.hasR&&C.vCount>=2))continue;
          if(C.go&&C.go.bin)continue;          // already holding its own pair
          if(C.goB&&C.goB!==B)continue;        // partner of ANOTHER holder
          if(grab.kind==='body'&&grab.obj===C)continue;
          var dp=Math.hypot(C.x-B.x,C.y-B.y);
          if(dp<pp){pp=dp;P=C;}
        }
      }
      if(P&&pp<=G_RANGE){
        var m1=B.mass||1,m2=P.mass||1,ms=m1+m2;
        if(!B.go||B.go.by!==P){
          var cmx=(m1*B.x+m2*P.x)/ms,cmy=(m1*B.y+m2*P.y)/ms;
          B.go={by:P,cmx:cmx,cmy:cmy,ang:Math.atan2(B.y-cmy,B.x-cmx),
                rad:Math.max(pp,10),target:clamp(pp,80,300),
                rB:m2/ms,rP:m1/ms,
                w:1.1*Math.sqrt(ms/Math.max(pp,40)),bin:1};
          P.goB=B;
        }
        if(grab.kind==='body'&&grab.obj===P){
          // partner grabbed -> dissolve the pair, release B tangentially
          var gX=B.go,txd=-Math.sin(gX.ang),tyd=Math.cos(gX.ang);
          B.vx=txd*gX.w*(gX.rad*gX.rB);B.vy=tyd*gX.w*(gX.rad*gX.rB);
          P.goB=null;B.go=null;
        }else{
          var go=B.go;
          go.rad+=(go.target-go.rad)*Math.min(1,dt*0.9);
          go.ang+=dt*go.w;
          var cA=Math.cos(go.ang),sA=Math.sin(go.ang);
          var rB=go.rad*go.rB,rP=go.rad*go.rP;
          var bx=go.cmx+rB*cA,by=go.cmy+rB*sA;
          var px=go.cmx-rP*cA,py=go.cmy-rP*sA;
          // keep the WHOLE pair inside the screen: shift the pair (separation preserved),
          // never stretch it — nothing may fly off the boundary.
          var shx=0,shy=0;
          if(bx>W-B.hw)shx=W-bx-B.hw;else if(bx<B.hw)shx=B.hw-bx;
          if(by>groundY-B.hh)shy=groundY-by-B.hh;else if(by<B.hh)shy=B.hh-by;
          if(px>W-P.hw)shx=W-px-P.hw;else if(px<P.hw)shx=P.hw-px;
          if(py>groundY-P.hh)shy=groundY-py-P.hh;else if(py<P.hh)shy=P.hh-py;
          if(shx||shy){go.cmx+=shx;go.cmy+=shy;bx+=shx;by+=shy;px+=shx;py+=shy;}
          B.x=bx;B.y=by;B.vx=0;B.vy=0;
          P.x=px;P.y=py;
          P.vx=-go.w*rP*sA;P.vy=go.w*rP*cA;
          continue;
        }
      }
      // no pair formed / partner left range / pair dissolved -> drop any stale capture
      if(B.go)releaseGo(B);
    }else{
      // a gravity well dominates (or the body is an ordinary one): drop any leftover go
      // so every body falls under the SAME simple attraction below
      if(B.go)releaseGo(B);
    }
    if(!best||bd>G_RANGE)continue;
    // ---- SIMPLE ATTRACTION (identical for plain m, mv², mv²/r, …) ----
    var inv=1/Math.max(bd,24);
    var ax=(bcx-B.x)*inv, ay=(bcy-B.y)*inv;
    var a=G_PULL/(bd+80);
    B.vx+=ax*a*dt; B.vy+=ay*a*dt;
  }
}
function stepField(dt){
  var bsrcs=[],esrcs=[];
  for(var i=0;i<bodies.length;i++){var S=bodies[i];if(S.kind==='B')bsrcs.push(S);else if(S.kind==='E')esrcs.push(S);}
  if(!bsrcs.length&&!esrcs.length){
    // no field source: no forces, but keep I/q clamped to the screen bounds (everything stays on screen)
    for(var kb=0;kb<bodies.length;kb++){
      var Kb=bodies[kb];
      if(Kb.kind==='B'||Kb.kind==='E'||Kb.kind==='T')continue;
      if(grab.kind==='body'&&grab.obj===Kb)continue;
      if(Kb.kind==='q'||Kb.kind==='I'){
        if(Kb.x<24){Kb.x=24;Kb.vx=Math.abs(Kb.vx)*0.5;}
        if(Kb.x>W-24){Kb.x=W-24;Kb.vx=-Math.abs(Kb.vx)*0.5;}
        if(Kb.y<24){Kb.y=24;Kb.vy=Math.abs(Kb.vy)*0.5;}
        if(Kb.y>groundY-24){Kb.y=groundY-24;Kb.vy=-Math.abs(Kb.vy)*0.5;}
      }
    }
    return;
  }
  for(var j=0;j<bodies.length;j++){
    var O=bodies[j];
    if(O.kind==='B'||O.kind==='E')continue;   // field sources don't feel their own field
    if(O.bh)continue;                          // black holes don't feel fields
    if(grab.kind==='body'&&grab.obj===O)continue;
    var src=null,bd=1e9;
    for(var s=0;s<bsrcs.length;s++){
      var S2=bsrcs[s];
      var d=Math.hypot(O.x-S2.x,O.y-S2.y);
      if(d<=S2.fieldR&&d<bd){bd=d;src=S2;}
    }
    var esrc=null,ed=1e9;
    for(var se=0;se<esrcs.length;se++){
      var SE=esrcs[se],hsE=SE.fieldR/2;
      // E field range is a SQUARE (half-side hsE), not a circle
      if(Math.abs(O.x-SE.x)<=hsE&&Math.abs(O.y-SE.y)<=hsE){
        var de=Math.abs(O.x-SE.x)+Math.abs(O.y-SE.y);
        if(de<ed){ed=de;esrc=SE;}
      }
    }
    var dir=src?(src.Bz>0?1:-1):1;
    if(O.kind==='q'){
      // magnetic Lorentz force (B field): F = q(v×B), always perpendicular -> constant speed, curves.
      if(src){
        var qc=O.qsign*dir;
        var th=-qc*Q_FORCE*dt;
        var cs=Math.cos(th),sn=Math.sin(th);
        var nvx=cs*O.vx-sn*O.vy;
        var nvy=sn*O.vx+cs*O.vy;
        O.vx=nvx;O.vy=nvy;
      }
      // electric force (E field): F = qE along the field direction (SE.th) — accelerates the q.
      if(esrc){
        var eth=esrc.th||0, ea=E_FIELD_ACC*O.qsign*dt;
        O.vx+=Math.cos(eth)*ea;
        O.vy+=Math.sin(eth)*ea;
      }
      O.fieldState=src?{active:true}:null;
    }else if(O.kind==='I'){
      if(src){
        var fy=A_FORCE*O.Isign*dir;
        O.vy+=fy*dt;
        var dmp=Math.pow(0.94,dt*60);
        O.vx*=dmp;O.vy*=dmp;
      }
    }
  }
  for(var k=0;k<bodies.length;k++){
    var K=bodies[k];
    if(K.kind==='B'||K.kind==='E'||K.kind==='T')continue;
    if(K.bh)continue;
    if(K.x<24){K.x=24;K.vx=Math.abs(K.vx)*0.5;}
    if(K.x>W-24){K.x=W-24;K.vx=-Math.abs(K.vx)*0.5;}
    if(K.y<24){K.y=24;K.vy=Math.abs(K.vy)*0.5;}
    if(K.y>groundY-24){K.y=groundY-24;K.vy=-Math.abs(K.vy)*0.5;}
  }
}
var lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT)lastT=now;
  var dt=Math.min(0.033,Math.max(0.008,(now-lastT)/1000));
  lastT=now;
  stepPhysics(dt);
  collideBodies();
  stepGravity(dt);
  stepField(dt);
  tickOrbs(dt);
  stepExplode(dt);
  stepBlackHole(dt);
  stepFinale(dt);
  stepFormulas(dt);
  stepParticles(dt);
  stepShake(dt);
  refreshHover();
  render();
  syncGlyphs();
  cursorTick();
}
function init(){
  resize();
  window.addEventListener('resize',resize);
  [mO,M2O,gO,aO,vO,rO,halfO,muO,cO,GO,tO,BO,qO,IO,EO].forEach(function(d){d.cat=1;});
  dockLetter(mO);dockLetter(M2O);dockLetter(gO);dockLetter(aO);dockLetter(vO);dockLetter(rO);dockLetter(halfO);dockLetter(muO);dockLetter(cO);dockLetter(GO);dockLetter(tO);
  dockLetter(BO);dockLetter(EO);dockLetter(qO);dockLetter(IO);
  requestAnimationFrame(frame);
}
init();
</script>
