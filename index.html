         形态从「一条线 + 两端竖帽」`|———|` 改成「一条线 + **两端小圆**」`o———o`，
         即 `M7.6 12h8.8` 加两个 `<circle cx=4.6/19.4 cy=12 r=3>`。
         ★R103-4（用户）：两端圆圈换成**更小的实心圆**（r 3→2.2，`fill="currentColor" stroke="none"`

         为什么这样更好（§33.2「像某种东西」翻译成几何语法）：
           · 竖帽在 16px 下与一条竖着的「弹簧全反射」/「I 形」同形，读者要停顿一下才认；
             小圆是端点的**通用符号**，与画布上杆两端真冒出来的那两个**圆手柄**字面同形 ——
             「图标所见 = 拖到画布后拿到的把手」，语义直接闭环（这才是 R98-3 端帽想干的事）。
           · 线只画在两圆**内切**之间（7.6→16.4，圆半径 3）⇒ 不穿过圆内部，读作「环-杆-环」。
           · 与传送带 chip（两圆 + 两条平行线 + 一个方块）不撞：这里只有一个圆对、一条线。
         ★为什么是这个形状（§33.2「像某种东西」翻译成几何语法）：
           · 与**弹簧**（锯齿折线）、**圆弧**（一条曲线）、**矩形**（闭合框）在拓扑上都不撞 ——
             它是「一条直线段 + 两端各一根短竖线」，全场唯一的「直 + 两端帽」组合。
           · 端帽不只是装饰：它**预告了 R98-3 的两端长度手柄**（就是拖杆两端那两个点），
             用户看到 chip 上的端帽，再看到杆两端冒出的手柄，语义是连得上的。

    <button class="tbtn" data-device="rod" title="轻质杆 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 12h8.8"/><circle cx="4.6" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="19.4" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <!-- R99 传送带 chip：图标 = **两个滚轮 + 上下两条带面**（正投影的传送带侧视图）。
         ★R101⑥（用户：「传送带的图标你改成现在的基础上，上面放一个正方形」）：在现基础上，
         上带面（y=9.5）**放一个正方形** `<rect x=9 y=4 width=6 height=5.5>` ——
         底边恰好压在 y=9.5 上（4+5.5=9.5），读出来就是「带子上驮着个箱子」。
         为什么是方形而不是别的（§33.2）：方形是**被搬运物**的最通用符号，且与「带」
         （两条平行线）在拓扑上正交 —— 加了它，「这是一台在动的机器」才变成
         「这是一台在**搬东西**的机器」，正是这个器件的用途本身。
         16px 下：方块 4×3.67px、与上带面共边（有意重合，就是「压着」），线宽 1.47px ⇒ 分得开。
         几何语法（§33.2：「像某种东西」要翻译成几何）：
           · 滚轮 = 两个**等大**的圆（r=2.5，圆心 (6,12)/(18,12)）—— 与「圆」器件同族，
             但这里是**两个**、被一根横带串起来，读出来就是「滚筒」而不是「轮子」；
           · 带面 = 上下两条**水平切线**（y=9.5 / 14.5，正好是两圆的外公切线）⇒ 一条绷紧的环带；
           · 与杆（`|———|`：一条线+两端竖帽）拓扑上不撞：这里是**两条**平行线 + 圆头。
         16px 下：两圆外径 5 单位=3.3px、中心距 12 单位=8px、线宽 1.47px ⇒ 分得开。
         外观（糊不糊）交给 1× 截图 + NEAREST 放大看，不伪造机器判据（§30.2）。 -->
    <button class="tbtn" data-device="belt" title="传送带 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5h12M6 14.5h12"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><rect x="9" y="4" width="6" height="5.5"/></svg>
    </button>
    <!-- ★R104-1（用户：「首先是那个铰链的图标你怎么还没改？」）：旧图 = 圆环 + 一横一纵两条正交臂。
         用户否掉它的理由很直接：正交双臂读起来像「十字 / 准星」，不像合页，也和「销钉穿两块耳板」
         的实物对不上。**改为合页（门铰链）的通用零件符号**：两片耳板 + 一根穿心的销轴 + 销轴
         中段的一个小箍（= 合页的轴节 / knuckle）。这是「两个构件绕一根轴相对转动」最短的实物形，
         也是机械制图里 door-hinge 的通行画法。
         为什么三件套还画得下 16px（viewBox 24，缩放 0.667，线宽 1.8 → 1.2px）：
         两片板各宽 6.4（→4.3px），板沿与销轴之间各留 3.0（→2.0px）的空隙，销轴是**一条线**不是粗块，
         小箍 r=2.4（→直径 3.2px）落在销轴中段 —— 三者在 16px 下仍分得开，不会糊成一团。
         与同排邻居逐个对过（§33.3「要在邻居上下文里挑」）：弹簧 = 竖直锯齿折线，杆 = 横线 + 两端小圆，
         传送带 = 两条平行线 + 两个大圆 + 上方方块，轻绳 = 竖直波浪单线；
         本图是唯一的**两个竖长矩形 + 一条贯穿竖线 + 中段小圆**，与四者都不撞。
         外观（16px 下糊不糊）交给 1× 截图 + NEAREST 放大 + 人眼，不伪造机器判据（§30.2）。 -->
    <button class="tbtn" data-device="hinge" title="光滑铰链 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v17.6"/><path d="M2.8 6.2h6.4v11.6H2.8z"/><path d="M14.8 6.2h6.4v11.6h-6.4z"/><circle cx="12" cy="12" r="2.4"/></svg>
    </button>
    <!-- R101⑦ 轻绳 chip。几何语法：绳 = **下垂的曲线**。
         与同排邻居对过：弹簧 = 等周期锯齿（直上直下），杆 = 直线 + 两端实心圆，
         传送带 = 两条平行线 + 圆 + 方块，铰链 = 圆环 + 正交双臂。
         本图是全场唯一的**弯曲单线**，且下垂（tension 松弛）本身就是绳的语义内核。
         R103-1（用户）：R102 的盘绳类候选全部否决 —— 改成**从上到下波浪形的弯曲**（竖直方向
         的波浪单线，顶部到底部）。画法：`M12 3` 起、四个半波各下移 4.5 单位到 y=21，
         用 `q-3 2.25 0 4.5` + 三次 `t`（控制点自动镜像）得到左右交替的平滑正弦波，
         摆幅 ±3 单位；与弹簧「直上直下的锯齿」、铰链「环+正交臂」都拉开差异。 -->
    <button class="tbtn" data-device="rope" title="轻绳 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3q-3 2.25 0 4.5t0 4.5t0 4.5t0 4.5"/></svg>
    </button>
    <!-- R108 地面/墙面 chip。几何语法：**上边一条横线 + 下方一排短斜杠**（工程制图的「地面」符号）。
         与同排邻居逐个对过（§33.3）：弹簧 = 竖直锯齿折线，杉 = 横线 + 两端小圆，
         传送带 = 两条平行线 + 两个大圆 + 上方方块，铰链 = 圆环 + 正交双臂，轻绳 = 竖直波浪单线；
         本图是全场唯一的**「一条边线 + 下方一排同向斜线」**，与五者都不撞。
         ★与画布里的外观同构（画布也是「上边实线 + 下方斜杠」）⇒ chip 与落体语义连得上。
         R130c（用户：「底下的斜线太长了，短点，可以多搞几条密集一些」）：斜杠从 3 根长斜线
         （dy=10、dx=5、间距 6）改成 6 根短斜杠（dy=5、dx=2.5、间距 3.4）——经典地面符号的
         「密排短刻度」画法，斜杠只挂在横线正下方。 -->
    <button class="tbtn" data-device="ground" title="地面/墙面 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5h20"/><path d="M3 9.5l2.5 5"/><path d="M6.4 9.5l2.5 5"/><path d="M9.8 9.5l2.5 5"/><path d="M13.2 9.5l2.5 5"/><path d="M16.6 9.5l2.5 5"/><path d="M20 9.5l2.5 5"/></svg>
    </button>

<!-- R74-D：设置面板（左上角工具下拉 → 设置）。高中/大学物理模式切换，默认大学 = 现状。 -->

  <div class="fmhead"><span class="fmtitle">设置</span><button class="fmclose" id="sclose">✕</button></div>
  <div class="srow">
    <div class="srow"><span class="slab">物理模式</span>
      <div class="sseg">
        <button class="sbtn" data-mode="uni">大学</button>
        <button class="sbtn" data-mode="high">高中</button>
      </div>
      <!-- ★★R132-8（用户 2026-10-01：「在物理模式那个控制的右边加一个问号的按钮，
           鼠标悬浮显示那些解释性文字，手机版是点击显示」）：
           原来两段小字（高中说明 + Bug 记录说明）钉在面板里，占掉半屏、手机上尤其挤。
           改成**问号按钮 + 气泡**：桌面 hover 显示、触屏 click 显示（`uiTouch()` 分流）。
           ★文案**一字不改**地搬进 `#qpop`，只是换个载体 —— 用户要删的是「一直占着面板
           的小字」，不是解释本身（他要的是「悬浮才出现」）。 -->
      <button class="qbtn" id="qphys" title="高中模式说明">?</button>
    </div>
    <div class="srow"><span class="slab">交互模式</span>
      <div class="sseg">
        <button class="ubtn" data-ui="auto">自动</button>

        <button class="ubtn" data-ui="touch">触屏版</button>
      </div>
      <button class="qbtn" id="quitipbtn" title="交互模式说明">?</button>
    </div>
    <div class="fmrow" style="display:none">
    </div>
  </div>
  <div class="srow">
    <span class="slab">Bug 记录</span>
    <button class="rbtn" id="recbtn">开始记录</button>
  </div>
  <!-- ★★R132-8：Bug 记录下面那段小字已删（用户：「把设置里面的bug记录下面的小字都给删了」）。
       但 `#recnote` **元素保留** —— 它是「记录中……/已导出 xxx 帧」的**状态回显**载体
       （recUI/recStart/recDump 都在写它），删掉元素会让记录模式失去进度反馈。
       平时为空 ⇒ 由 CSS `:empty{display:none}` 收成 0 高度，视觉上等于不存在。 -->
  <div class="snote" id="recnote"></div>
</div>
<!-- ★★R132-8：问号气泡**必须挂在 `<body>` 上，不能放进 `#smenu`**。
     实测（_tmp_r311 首轮）：`#smenu` 带 `transform:translate(-50%,-50%) scale(1)`，
     而 CSS 规范规定**带 transform 的祖先会成为 `position:fixed` 后代的包含块**
     ⇒ 气泡的 `left/top` 变成相对**面板**而不是视口，按 rect 算出来的坐标全部错位
     （实测气泡跑到屏幕外，判据「气泡不出屏」红）。
     挂到 body 上 = 包含块回到视口，定位语义才与 `getBoundingClientRect()` 一致。 -->
<div class="qpop" id="qpop"></div>
<div class="recbadge" id="recbadge">● 记录中</div>

<div class="bmask" id="bugmask"></div>
