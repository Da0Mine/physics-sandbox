<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock" content="true">
<title>m g a v r</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="ground"></div>
<canvas class="cv" id="cv"></canvas>
<div class="shadow" id="shadow"></div>
<div class="panel" id="panel"></div>
<button id="panelToggle" title="符号面板"><svg width="21" height="21" viewBox="0 0 24 24"
  fill="none" stroke="#26221C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 9l7 7 7-7"/></svg></button>
<div class="handle" id="handle"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 4 22 10 16 10"></polyline><path d="M19.5 15a8.5 8.5 0 1 1-2-8.9L22 10"></path></svg></div>
<!-- 圆弧两端的角度手柄：悬浮在弧上时出现，拖动改变扫过角 -->
<div class="arknob" id="ark0"></div>
<div class="arknob" id="ark1"></div>
<!-- 轻质杆两端的长度手柄：悬浮在杆上时出现，拖一端改长度、另一端不动；青绿描边以区别于圆弧的角度手柄 -->
<div class="rodlen" id="rodh0"></div>
<div class="rodlen" id="rodh1"></div>
<div class="menu" id="menu"><div class="menu-item" data-act="fix"><span class="fix-lab">固定</span></div><div class="menu-item hide" data-act="dirlock"><span class="dl-lab">固定方向</span></div><div class="menu-item hide" data-act="rodlock"><span class="rl-lab">固定角度</span></div><div class="menu-item" data-act="copy">复制</div><div class="menu-item" data-act="param">参数</div></div>
<div class="params" id="pbox"><div class="phead"><span class="ptitle"></span><button class="pclose" id="pclose">✕</button></div><div class="pval"></div><div class="rows" id="prows"></div><div class="pcontacts" id="pcontacts"></div></div>
<div class="trash" id="trash"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1.2 13.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M10 11v6M14 11v6"/></svg></div>
<div class="ring" id="ring"></div>
<div class="fresize" id="fresize"><span>⇔</span></div>
<div class="tools" id="tools">
  <button class="ttoggle" id="ttoggle" title="工具">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 9l7 7 7-7"/>
    </svg>
  </button>
  <div class="trow" id="trow">
    <button class="tbtn" data-tool="formula" title="公式示例">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.6 12.9h3.2l3.5 6.2L14.3 4.6h7.1"/>
      </svg>
    </button>
    <button class="tbtn" data-tool="brush" title="画笔">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20.2l4.1-1.1L19.2 8a2.45 2.45 0 0 0-3.4-3.4L4.7 15.7 4 20.2z"/><path d="M14.6 6.4l3 3"/>
      </svg>
    </button>
    <button class="tbtn" data-tool="shape" title="预设物体">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="3.4" width="9.4" height="9.4" rx="1.6"/><circle cx="16" cy="16" r="4.9"/>
      </svg>
    </button>
    <!-- 「器件」类别按钮（箱子图标）：点开后在下方展开器件行 #dsub -->
    <button class="tbtn" data-tool="device" title="器件">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="1.6"/><path d="M3.6 9h16.8"/><rect x="9.3" y="6.8" width="5.4" height="4.4" rx="0.8" stroke-width="1.7"/>
      </svg>
    </button>
    <button class="tbtn" data-tool="settings" title="设置">
      <!-- 设置（Feather / Lucide 的 settings 图标） -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <!-- 全屏切换：进入全屏后图标换成四角内收、标题改为「退出全屏」 -->
    <button class="tbtn" data-tool="fullscreen" id="fsbtn" title="全屏">
      <svg id="fsicon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/>
      </svg>
    </button>
  </div>
  <div class="tsub" id="tsub">
    <button class="tbtn" data-shape="rect" title="矩形">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
    </button>
    <button class="tbtn" data-shape="circle" title="圆形">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/></svg>
    </button>
    <!-- 圆轨：空心圆，里面可放东西、球可沿内壁滚；画出即默认固定。显示名叫「圆轨」，内部键仍是 ring（多处分派依赖它，不要改） -->
    <button class="tbtn" data-shape="ring" title="圆轨（空心圆轨道，里面能放东西、球可沿内壁滚；默认固定）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="5"/></svg>
    </button>
    <button class="tbtn" data-shape="tri" title="直角三角形">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5 4 5.5 19.5 19.5 Z"/></svg>
    </button>
    <button class="tbtn" data-shape="trough" title="半凹槽">
      <!-- 半凹槽：图标按真实几何画（矩形右上角挖去四分之一圆弧，即滑梯形），与左右对称的全凹槽区分 -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5 V4.5 H10 A 10 10 0 0 0 20 14.5 V19.5 Z"/></svg>
    </button>
    <button class="tbtn" data-shape="tub" title="全凹槽">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5 H7 A 5 5 0 0 0 17 5.5 H20.5 V20 H3.5 Z"/></svg>
    </button>
    <button class="tbtn" data-shape="arc" title="圆弧">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17 A 8.4 8.4 0 0 1 20 17"/></svg>
    </button>
  </div>
  <!-- 器件行 #dsub（与形状行同构，复用 .tsub）。从这里拖到画布即放下一个；只点不拖则进入器件模式，之后每点一次画布放一个（由 toolTap 统一处理）。新增器件只需在 DEVICES 表里加一行。 -->
  <div class="tsub dsub" id="dsub">
    <!-- 器件 chip 只放图标，名称走 title 悬浮提示。弹簧图标用等周期锯齿、不留平段（有平段会读成心电图）。 -->
    <button class="tbtn" data-device="spring" title="弹簧 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2.25-5 2.25 10 2.25-10 2.25 10 2.25-10 2.25 10 2.25-10 2.25 5"/></svg>
    </button>
    <!-- 轻质杆：线段 + 两端实心小圆（对应杆两端的长度手柄）；实心部分用 currentColor，选中态才能正确反白 -->
    <button class="tbtn" data-device="rod" title="轻质杆 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 12h8.8"/><circle cx="4.6" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="19.4" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <!-- 传送带：两个滚轮 + 上下带面 + 带上驮着的方块 -->
    <button class="tbtn" data-device="belt" title="传送带 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5h12M6 14.5h12"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><rect x="9" y="4" width="6" height="5.5"/></svg>
    </button>
    <!-- 光滑铰链：合页符号（两片耳板 + 穿心销轴 + 轴节小圆） -->
    <button class="tbtn" data-device="hinge" title="光滑铰链 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v17.6"/><path d="M2.8 6.2h6.4v11.6H2.8z"/><path d="M14.8 6.2h6.4v11.6h-6.4z"/><circle cx="12" cy="12" r="2.4"/></svg>
    </button>
    <!-- 轻绳：竖直方向的波浪单线 -->
    <button class="tbtn" data-device="rope" title="轻绳 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3q-3 2.25 0 4.5t0 4.5t0 4.5t0 4.5"/></svg>
    </button>
    <!-- 地面/墙面：横线 + 下方一排短斜杠，与画布中的外观一致 -->
    <button class="tbtn" data-device="ground" title="地面/墙面 —— 拖到画布上放下（也可以先点它，再点画布）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5h20"/><path d="M3 9.5l2.5 5"/><path d="M6.4 9.5l2.5 5"/><path d="M9.8 9.5l2.5 5"/><path d="M13.2 9.5l2.5 5"/><path d="M16.6 9.5l2.5 5"/><path d="M20 9.5l2.5 5"/></svg>
    </button>
  </div>
</div>
<div class="fmask" id="fmask"></div>
<div class="fmenu" id="fmenu">
  <div class="fmhead"><span class="fmtitle">公式示例</span><button class="fmclose" id="fmclose">✕</button></div>
  <div class="fmgrid" id="fmgrid"></div>
</div>
<!-- 设置面板：物理模式（大学 / 高中，默认大学）、交互模式、Bug 记录 -->
<div class="fmask" id="smask"></div>
<div class="smenu" id="smenu">
  <div class="fmhead"><span class="fmtitle">设置</span><button class="fmclose" id="sclose">✕</button></div>
  <div class="srow">
    <div class="srow"><span class="slab">物理模式</span>
      <div class="sseg">
        <button class="sbtn" data-mode="uni">大学</button>
        <button class="sbtn" data-mode="high">高中</button>
      </div>
      <!-- 说明文字放在问号气泡 #qpop 里：桌面悬浮显示，触屏点击显示（由 uiTouch() 分流） -->
      <button class="qbtn" id="qphys" title="高中模式说明">?</button>
    </div>
    <div class="srow"><span class="slab">交互模式</span>
      <div class="sseg">
        <button class="ubtn" data-ui="auto">自动</button>
        <button class="ubtn" data-ui="desktop">电脑版</button>
        <button class="ubtn" data-ui="touch">触屏版</button>
      </div>
      <button class="qbtn" id="quitipbtn" title="交互模式说明">?</button>
    </div>
    <div class="fmrow" style="display:none">
    </div>
  </div>
  <div class="srow">
    <span class="slab">Bug 记录</span>
    <button class="rbtn" id="recbtn">开始记录</button>
  </div>
  <!-- #recnote 是记录状态的回显载体（recUI / recStart / recDump 都会写它），必须保留；为空时由 CSS :empty 隐藏 -->
  <div class="snote" id="recnote"></div>
</div>
<!-- 问号气泡必须挂在 body 下，不能放进 #smenu：#smenu 带 transform，会成为 position:fixed 后代的包含块，按 getBoundingClientRect() 算出的坐标就会错位 -->
<div class="qpop" id="qpop"></div>
<div class="recbadge" id="recbadge">● 记录中</div>
<!-- Bug 提交框（点「停止记录」后弹出）。挂在 body 下、与 #smenu 同级，不复用 #smenu，避免与设置面板的开关逻辑纠缠 -->
<div class="bmask" id="bugmask"></div>
<div class="bbox" id="bugbox">
  <div class="fmhead"><span class="fmtitle">提交 Bug 记录</span><button class="fmclose" id="bugclose">✕</button></div>
  <textarea class="bta" id="bugdesc" placeholder="描述一下你刚才是怎么操作的、期望看到什么、实际发生了什么……"></textarea>
  <div class="binfo" id="buginfo"></div>
  <div class="bbtns">
    <button class="rbtn" id="bugsubmit">提交</button>
    <button class="rbtn" id="bugdl">仅下载文件</button>
  </div>
  <div class="snote" id="bugstatus"></div>
</div>
<div id="fhashint" class="fhint"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
