   **真根因 = `touch-action`**。用 CDP 真实触摸事件量测（_tmp_r314）：
   每次触摸都是 `pointerdown=1、pointermove=1、pointercancel=1` ——

   判成手势后**发 pointercancel 掐断整条 pointer 流**，后续 pointermove/pointerup 一个都收不到。

/* ★R132-9x（用户 2026-10-03：「现在的动画怎么是先上浮，再停顿，然后再上浮消失？
 *   就改成**匀速**的就可以了，不需要那一下的卡顿」）。
 *   旧关键帧的病根：`14%→74%` 那一段配 `cubic-bezier(.22,.61,.36,1)`（缓出）⇒ 位移在
 *   266ms→1406ms 之间几乎停住 ⇒ 视觉上就是「上浮 → 卡一下 → 再消失」。
 *   ⇒ 改成**全程 linear**：transform 只在 0%/100% 给两个端点，中间线性插值 = 严格匀速；
 *     opacity 的两段关键帧只管淡入淡出，**不参与运动**（运动与透明度解耦，改淡入淡出
 *     不会重新引入停顿）。 */
.errtip.go{animation:errtipUp 1.7s linear forwards}
/* 匀减速 = 位移随时间**等差递减**（速度每段少一截）。总行程 64px（+6 → −58），
   四段位移 −28 / −20 / −12 / −4（公差 +8）⇒ 起步最快、逐步慢下来、**没有中段停顿**。
   ★为什么不用一条 `cubic-bezier` 缓动 + 只有首尾两个关键帧：那样中段会被压成近乎静止
     （旧版 14%→74% 只走了 34px/1140ms，视觉上就是「卡一下」）。分段线性可以把
     「每段位移」直接写成等差数列，匀减速是**构造出来的**、不靠缓动函数近似。 */

  0%  {opacity:0;transform:translate(-50%,-50%) translate(-8px,6px)}
  16% {opacity:1}
  25% {transform:translate(-50%,-50%) translate(-4px,-22px)}
  50% {transform:translate(-50%,-50%) translate(0px,-42px)}
  75% {transform:translate(-50%,-50%) translate(4px,-54px)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(8px,-58px)}
}

   序列，随分子字符点完后一起长出；非 boss 路径（公式菜单等）`opacity` 默认 1
   ⇒ 与改造前完全同貌，零回归。
   `align-self:stretch` 让它横向撑满 `.mfrac` 的内容宽（等价于原来的 border 宽度）。 */
.mfrac > .fracbar{display:block;align-self:stretch;width:auto;height:1.5px;
  background:#26221C;margin:0;flex:none}
/* ★★R132-9（用户：「那些数字怎么高低不平的」）：逐字符汇聚 = **纯淡入**。
   旧写法给每个字符设 `transform: translate(±110px,±14px) scale(1.5)` 再过渡回原位，
   但 `.bcharg` 是**行内元素** ⇒ transform 对它无效，唯一生效的是分数线 `.fracbar`
   （`display:block`）⇒ 实测同一条线上分数线 y 的极差高达 24.26px，数字纹丝不动、
   分数线在跳 = 用户看到的"高低不平"。改成 opacity 过渡后所有字符一视同仁、基准线不动。
   ★只加 `opacity`，不加 `display`：加 inline-block 会改变行内基线（底线对齐而非基线对齐），
     反而把整行文字错开（比原缺陷更糟）。 */
/* ★★R132-9d（用户：「出现动画要再精致一些，字符从四周渐显汇聚到相应位置」）：
   每个字符用**相对定位的 left/top**做位移。为什么不用 transform（R132-9 踩过）：
   transform 对**非替换行内元素无效**，而全平台唯一例外是分数线
   `.fracbar`（`display:block`）⇒ 旧版只有分数线在飞、数字纹丝不动
   （实测同一行分数线 y 极差 24.26px = 用户说的「数字高低不平」）。
   **相对定位对行内元素同样有效，且不参与布局** ⇒ 基线、行高、分数线全都不会被打乱。
   起始偏移写在 `--dx/--dy`（build 期一次写好）⇒ 点亮时只加一个 `.on` 类，
   **不需要逐个强制重排**（旧版 500+ 次 `void offsetWidth` 就是这么来的）。 */
.bcharg{position:relative;left:var(--dx,0px);top:var(--dy,0px);opacity:0;
  transition:opacity .40s ease-out,left .62s cubic-bezier(.16,.84,.30,1),top .62s cubic-bezier(.16,.84,.30,1)}
.bcharg.on{left:0;top:0;opacity:1}

.bossmeas{position:fixed;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap}
/* ★★R132-3：离屏量测必须与平台**同字号**（17px 时代两边都是 19 无所谓，48 就不行了）
   —— 量出来偏小 ⇒ 每行塞进过多项 ⇒ 上屏就溢出。 */

/* 闪黑 / 黑屏遮罩 */
#bossfade{position:fixed;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;
  transition:opacity .045s linear}

         ★图标形态（R97c，用户：「这个弹簧的图标怎么像个心电图？」）：
         旧 path 是 `M3 12h2.5l2.1-5.4 3.1 10.8 3.1-10.8 2.1 5.4H21` —— 它的走法是
         **平线 → 尖峰 → 平线 → 尖峰 → 平线**，而这正是**心电图**的定义特征（等电位基线 +
         孤立 QRS 尖峰）。所以不管画得多准，读出来都是 ECG。
         改法：**去掉全部平段**，改成等周期、等幅、贯穿整宽的锯齿
         `M3 12l3-5.6 3 11.2 3-11.2 3 11.2 3-11.2 3 5.6`（3 峰、振幅 ±5.6、段长 3）。
         段长 3 × 16/24 = 2.0px 渲染，线宽 2.2 × 16/24 ≈ 1.5px ⇒ 相邻笔画不并拢；
         再密（4 峰以上，见 `_r97b_icon_candidates.html` 的「弹2」）在 16px 下就开始糊。
         两端的半段（起点/终点落在中线上）是**有意保留**的：它让图形有「起止」，不像被裁断。

         ★R97d（用户：「弹簧图标选择弹2」）：落到 **弹2 = 等周期 4 峰**
         `M3 12l2.25-5 2.25 10 2.25-10 2.25 10 2.25-10 2.25 10 2.25-10 2.25 5`

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#26221C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2.25-5 2.25 10 2.25-10 2.25 10 2.25-10 2.25 10 2.25-10 2.25 5"/></svg>

    <!-- R98-2（用户：「再增加一个器件，叫做轻质杆……悬浮旋转按钮和弹簧一样，两端有长度手柄可以拖动调长短」）：
         轻质杆 chip。★R101⑤（用户：「杆的图标修改一下，两端改成两个圆的端点，而不是现在的横线」）：
         形态从「一条线 + 两端竖帽」`|———|` 改成「一条线 + **两端小圆**」`o———o`，

           · 竖帽在 16px 下与一条竖着的「弹簧全反射」/「I 形」同形，读者要停顿一下才认；

    <button class="tbtn" data-device="rope" title="轻绳 —— 拖到画布上放下（也可以先点它，再点画布）">

// 做法：挂 `Matter.Collision.collides`（Detector 的窄相入口，每对部件调一次）。当一方是标注了
//   `_circleR` 的圆体、另一方是多边形时，**不调 SAT**，改用解析几何：
//     · 逐边求「圆心到线段」的最近点，取最近的那一条
//       —— 线段最近点公式天然包含「最近点是顶点（角接触）」的情形，不需要单独分支；
//     · 穿透深度 depth = R − d（d = 圆心到边界最近距离），**这就是题目要的
//       `penetration = R − distance from circle center to segment`**；
//     · 法线 normal = (圆心 − 最近点)/d，即**径向**；
//     · 接触点 supports = 那个最近点。于是 r = 接触点 − 圆心 恒与 normal 平行
//       ⇒ 力臂 cross(r,n) ≡ 0 ⇒ **零虚假角动量**。
//   支撑点数取 1：真圆与平面/折线面的接触**本来就是单点**，不是多边形那种「一条边两个顶点」。
//
// 结构性好处：这条通道把 O(N·M) 的 SAT 换成了 O(M) 的逐边距离，所以它既更准也**更快**。
//   CIRCLE_SIDES 故意留 48 不动 —— 多边形现在还决定质量（面积×密度，24→48 边 +0.9%）与
//   惯量（+1.7%），改它会平移一批已标定的断言，而精度收益已经由本通道拿走，不留缝也无收益。
//
// 守卫（都不许省）：
//   ① 圆心落在多边形**内部**（= 已经很深的互穿）**也走解析**，用凸多边形的标准 MTV：
//      出去的方向 = 最近那条面的外法线（圆心→最近点），推出量 = d + R（先走满 d 到面、再走 R）。
//      本项目的 Matter 体全是凸的（弧/槽/开链笔画是逐段定向矩形拼的复合体，每块凸；闭链形走
//      fromVertices(inflateHull)，也是凸包），所以这一步有精确解，不需要别的机器。
//      ⚠ 初版这里是「退回 SAT」，被 B4b 当场抓住：凹槽夹具 92 条接触里有 2 条落在这一支，
//      力臂 3.47px —— **比正常上限 1.46 还大**。那恰恰是最需要正确法线的时刻，退回 SAT 等于
//      在最坏情形把 48 边形请回来。改法见 `var inside=...` 那三行。
//   ② **圆-圆也走解析**（R80，用户「可以」）。Matter 0.20 的 SAT 连圆-圆特例都没有 ——
//      整个 Collision.collides 一次都不读 circleRadius。实测两个球相撞 = 两个 48 边形相撞：
//      法线偏连心线 max 3.690°、力臂 max 3.1654px、depth 偏 0.1310px、supportCount 恒 2。
//      公式 depth = R_A+R_B−d、normal = (c_A−c_B)/d、接触点在连心线上，对「内含」也成立（见下）。
//   ③ 退化（d≈0 / 圆心重合 / 顶点数<3 / 拿不到 Matter.Pair/Collision.create）一律退回 SAT。
//   ④ **复用 pairs.table 里的 collision 对象**（与 Matter 自己的缓存口径一致）。自己 new 一个
//      会让 `collision.pair` 一直为空 ⇒ `Pairs.update` 每帧都新建一个 Pair ⇒ `pairs.list` 抖动、
//      `collisionStart` 每帧误报一次。这是本通道最容易踩的坑。
//   ⑤ CIRCLE_ANALYTIC 开关只为诊断/负对照 —— A/B 能在**同一次会话同一个夹具**里切，避开了
//      跨轮次运行之间的漂移（R78 已经证明这个项目里跨运行比对有多不可靠）。
var CIRCLE_ANALYTIC=true;
// R82：空心圆（环）的解析分支开关。作用与 CIRCLE_ANALYTIC 完全一样 —— 只为诊断/负对照，
// 让 A/B 能在**同一次会话同一个夹具**里切换（跨运行比对在本项目里已被 R78 证明不可靠）。
// 关掉它环仍然是环（走「圆 vs 48 根矩形」的多边形路径），只是法线退回面法线。
var RING_ANALYTIC=true;
// R82-去重（_ringHit / _ringTok）-------------------------------------------------------------------
// 解析环分支对**同一对（环, 圆）**在每个物理子步里只允许产出一条接触。
// 为什么非要有它（`_diag_r82c_dup.py` 实测，先量后改）：Detector 对复合体是**逐 part** 调
//   `Collision.collides`（见 buildMatterBody 里那条注），环有 48 个 part，球贴壁时同时压住 6~8 个
//   ⇒ 同一子步产出 6~8 条**几何完全相同**的接触（本支的几何只由**环心**决定，与是哪个 part 无关）
//   ⇒ Matter 按 part 两两建 Pair，**同一个物理约束被结算 6~8 遍**。
// ⚠ 这里保留一条**被证伪的假设**，免得后人再走一遍弯路：
//   最初以为「6~8 倍法向冲量 ⇒ 薄壁（2·BND_INK=4.65px）必被穿」，还拿 C1/C2 的 FAIL 当证据。
//   `_diag_r82f_ab.py` 的同夹具 A/B 把它否掉了：3000px/s 下把 RING_DBG.off=true 关掉去重，
//   每子步接触条数 467 → 2761（5.9 倍），而**最大穿透 3.353 逐位不变**、球照样关在空腔里
//   （dmax 55.592 = 55.592，末球心距都是 55.36）。根因：Matter 的 Resolver 是**顺序
//   （Gauss-Seidel）速度求解器**，重复约束从第二条起看到的已经是分离速度 ⇒ 解出的冲量被夹到 0，
//   不会叠加。当初 C1/C2 的「末态球心距 506px / 外球穿到 d=4.35」是**夹具单位错**
//   （setVelocity 传了 px/s，实际 36000px/s）—— 同一组数字在**开着去重**时也照样复现，
//   与重复接触无关。
// ⇒ 去重的真实收益只有下面两条，**不含「防穿墙」**：
//     ① 约束卫生：一个物理面只该贡献一条约束。重复条数会改变摩擦/切向求解的迭代次序 ——
//        A/B 里 dmin 42.970(ON) vs 47.874(OFF) 正是它带来的轨迹差；
//     ② 开销：每子步求解量 467 → 2761（5.9 倍）。环有 48 个 part，球贴壁时同时压住 6~8 个，
//        去重后顺带压掉 pairs.list 每子步的建/销抖动。
// 探针侧对应的是 F 组 A/B（同会话同夹具，只切 RING_DBG.off），把上面两个数字钉住。
// token 由包装 `Matter.Engine.update` 推进：产品只在 stepMatter 一处调它，
//   所以「一个 token」严格等于「一个物理子步」，与 Engine.update 的边界对齐，不用猜帧边界。
// 包装失败 ⇒ _ringDedupOK=false ⇒ 去重整体停用（宁可不判重，也不能让球因为 token 不走而永远穿透）。
// RING_DBG 只给探针/负对照读数，三个整数自增，不参与物理。
var _ringTok=0, _ringHit={}, _ringSig={}, _ringDedupOK=false;
var RING_DBG={tok:0,dedup:0,emit:0,wrap:false,tokWrapPass:0,off:false};
(function(){
  if(typeof Matter==='undefined'||!Matter.Collision||!Matter.Collision.collides)return;
  var _collides=Matter.Collision.collides;
  // —— 先安装 token 推进器（放在 collides 之前，装不上就去重自动停用）——
  if(Matter.Engine&&typeof Matter.Engine.update==='function'&&!Matter.Engine._ringTokWrap){
    var _engUpd=Matter.Engine.update;
    Matter.Engine.update=function(eng,delta){
      if(++_ringTok>1e9){_ringTok=1;_ringHit={};}   // 溢出保护（240 子步/s 下 ≈48 天）
      RING_DBG.tok=_ringTok; RING_DBG.tokWrapPass++;
      return _engUpd.apply(this,arguments);
    };
    Matter.Engine._ringTokWrap=true;
    _ringDedupOK=true; RING_DBG.wrap=true;
  }

  // 圆心到多边形边界最近点（含顶点接触：线段 t 被夹到 [0,1] 时最近点即端点）
  function closestOnPoly(vs,cx,cy){
    var n=vs.length,bd=Infinity,px=0,py=0;
    for(var i=0;i<n;i++){
      var a=vs[i],b=vs[(i+1)%n];
      var ex=b.x-a.x,ey=b.y-a.y,L2=ex*ex+ey*ey;
      var t=L2>0?((cx-a.x)*ex+(cy-a.y)*ey)/L2:0;
      t=t<0?0:(t>1?1:t);
      var qx=a.x+ex*t,qy=a.y+ey*t;
      var dx=cx-qx,dy=cy-qy,d2=dx*dx+dy*dy;
      if(d2<bd){bd=d2;px=qx;py=qy;}
    }
    return isFinite(bd)?{d:Math.sqrt(bd),px:px,py:py}:null;
  }
  // 圆心是否落在多边形内（射线法，自备实现 —— 不依赖 Matter 的 Vertices.contains 是否导出）
  function inPoly(vs,x,y){
    var n=vs.length,inside=false;
    for(var i=0,j=n-1;i<n;j=i++){
      var a=vs[i],b=vs[j];
      if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))inside=!inside;
    }
    return inside;
  }
  function cachedCollision(pairs,A,B){
    if(!pairs||!pairs.table||!Matter.Pair||!Matter.Pair.id)return null;
    var pr=pairs.table[Matter.Pair.id(A,B)];
    return pr?pr.collision:null;
  }
  function blankCollision(A,B){
    if(Matter.Collision.create)return Matter.Collision.create(A,B);
    return {pair:null,collided:false,bodyA:A,bodyB:B,parentA:A.parent,parentB:B.parent,depth:0,
            normal:{x:0,y:0},tangent:{x:0,y:0},penetration:{x:0,y:0},
            supports:[null,null],supportCount:0};
  }

  Matter.Collision.collides=function(bodyA,bodyB,pairs){
    if(!CIRCLE_ANALYTIC)return _collides(bodyA,bodyB,pairs);
    var rA=(bodyA&&bodyA._circleR>0)?bodyA._circleR:0;
    var rB=(bodyB&&bodyB._circleR>0)?bodyB._circleR:0;
    if(!rA&&!rB)return _collides(bodyA,bodyB,pairs);      // 守卫②/普通路径
    // ---- 环 vs 圆：解析环（annulus，R82）-----------------------------------------------
    // 为什么需要这一支（对照用户给的参考引擎 —— 那里面圆弧面是**解析几何**：ui() 用 atan2 判
    // 扫过角、tube 模式直接取径向法线；它「无能量损失」的另一半是每步把位置投影到面上、
    // 法向自由度由约束吃掉、不经过冲量求解器，且全场默认 friction:0/restitution:1）：
    //   48 根定向矩形的复合体「能关住球」（_diag_r82_ring.py 实测：球心距恒 47.4、力臂恒 0、
    //   空腔不穿），但每根矩形只有 9.2px 长、球半径 20.3px ⇒ 球同时压两三根，接触法线是
    //   **该矩形面的面法线**，实测偏离真径向最多 8.086°。球沿环内壁滑行时径向才是唯一正确
    //   的约束方向。本分支把法线变成真径向，并删掉弦高欠覆盖。
    //   同夹具同会话 A/B 实测：法线偏径向 8.086° -> 0.000°；默认物性（μ=0.08,e=0.52）下
    //   14s 末残余速度 0 -> 45 px/s。**但主因仍是物性**：显式 μ=0 + e=1 时两条路径都能连响
    //   14s（峰值 478~790 px/s 不衰）。所以这一支是「几何正确性」的修法，不是「无能量损失」
    //   的灵丹 —— 后者的开关在本项目里是 μ=0（R70⑥）+ e=1，与 R81 的结论一致。
    var rp=(bodyA&&bodyA._ringOut>0)?bodyA:((bodyB&&bodyB._ringOut>0)?bodyB:null);
    if(rp&&RING_ANALYTIC){
      var cbo=rA?bodyA:(rB?bodyB:null);
      if(!cbo)return _collides(bodyA,bodyB,pairs);       // 环 vs 非圆（方块/杆/地面）：交回多边形路径
      var rrr=cbo._circleR, ringIn=rp._ringIn, ringOut=rp._ringOut;
      // ⚠ 环心必须取 **root**：Detector 传进来的是 part，而 part.position 在**中线**上
      //   （距环心 Rmid），不是环心。探针初版就栽在这：首批接触 depth 算出 67.9px，
      //   一记 45px 的 MTV 把球打到 6380 px/s、直接飞出环外。
      var rctr=(!rp.parent||rp.parent===rp)?rp:rp.parent;
      var pdx=cbo.position.x-rctr.position.x, pdy=cbo.position.y-rctr.position.y;
      var pd=Math.sqrt(pdx*pdx+pdy*pdy);
      if(pd<1e-9)return _collides(bodyA,bodyB,pairs);    // 守卫③：圆心与环心重合
      // 判别式按「球心落在哪一区」分，**绝不能**按「哪个推出量为正」分：
      //   球心在空腔内时 ringOut+rrr−pd 照样是个正的大数，按它判会把球朝外打穿整圈壁
      //   （探针实测：峰值 6380 px/s、球心跑到 d=92）。
      var pdep=0,psep=0;
      if(pd>=ringOut){pdep=ringOut+rrr-pd;psep=1;}            // 球在外侧 ⇒ 沿径向朝外分离
      else if(pd<=ringIn){pdep=pd+rrr-ringIn;psep=-1;}        // 球在空腔 ⇒ 朝环心分离
      else{                                                   // 球心埋在壁厚里 ⇒ 推到更近的一侧
        var pEo=ringOut-pd,pEi=pd-ringIn;
        if(pEo<=pEi){pdep=pEo+rrr;psep=1;}else{pdep=pEi+rrr;psep=-1;}
      }
      if(!(pdep>0))return null;                               // 真环不接触
      // —— 去重（见 _ringHit 注释）：本子步里这对（环, 圆）已经出过一条解析接触就直接让位 ——
      //   位置放在「确认真有接触」之后：若放在判别式之前，一个「不接触的 part」会白吃掉 token，
      //   把同一子步里**真正接触**的那个 part 也一起挡掉 ⇒ 球穿壁。
      //   几何与是哪个 part 无关 ⇒ 留哪一条都一样；留第一条还顺带让 Pair 身份稳定（热启动不丢）。
      //   判据是**两条合取**，这是刻意的：
      //     ① token 相同 —— 界定「同一个物理子步」（token 由包装 Engine.update 推进）；
      //     ② 球心 x 逐位相同 —— 兜住「token 推进器被人摘掉」的退路。
      //   为什么非要②：若只用①，一旦有谁把 Matter.Engine.update 换成**包装前**的引用，
      //     token 就冻住 ⇒ `_ringHit[rky]===_ringTok` 永远成立 ⇒ 环从此再也吐不出接触
      //     ⇒ 球直接穿环。加上②之后退化成**优雅降级**：运动中的球每子步球心都在变，
      //     ②不成立 ⇒ 照常出接触，环照常关得住；只有「token 冻住 **且** 球恰好一动不动」
      //     才会漏一拍 —— 而漏一拍只会让球被重力拽一下、下一子步立刻补回来，不会穿壁。
      //   （RING_DBG.off 是 A/B 负对照开关，作用与 RING_ANALYTIC/CIRCLE_ANALYTIC 同类。）
      var rky=rctr.id+':'+cbo.id, rsig=cbo.position.x;
      if(_ringDedupOK&&!RING_DBG.off){
        if(_ringHit[rky]===_ringTok&&_ringSig[rky]===rsig){RING_DBG.dedup++;return null;}
      }
      _ringHit[rky]=_ringTok; _ringSig[rky]=rsig;
      RING_DBG.emit++;
      var pux=pdx/pd,puy=pdy/pd;
      var Aa=(bodyA.id<bodyB.id)?bodyA:bodyB, Bb2=(bodyA.id<bodyB.id)?bodyB:bodyA;
      var rcol=cachedCollision(pairs,Aa,Bb2)||blankCollision(Aa,Bb2);      // 守卫④
      // normal 符号：沿用 R79/R80 那条「normal 由 B 指向 A」的反直觉约定 ——
      //   球是 A ⇒ 球沿 +normal 走 ⇒ normal=+sep·u ；球是 B ⇒ 球沿 −normal 走 ⇒ normal=−sep·u
      var nfs=(Aa===cbo)?1:-1;
      var rnx=nfs*psep*pux, rny=nfs*psep*puy;
      rcol.collided=true;
      rcol.bodyA=Aa; rcol.bodyB=Bb2; rcol.parentA=Aa.parent; rcol.parentB=Bb2.parent;
      rcol.depth=pdep;
      rcol.normal.x=rnx; rcol.normal.y=rny;
      rcol.tangent.x=-rny; rcol.tangent.y=rnx;
      rcol.penetration.x=rnx*pdep; rcol.penetration.y=rny*pdep;
      // 支撑点取**环壁上的径向点**：它让球与环两侧的力臂**一起**为 0 ——
      //   球的 r = q−c = u·(壁半径−pd) ∥ u；环这个 part 的 r = q−part.position
      //   = u·(壁半径−Rmid) ∥ u（part 中心就在同一根射线上）。取自边界上任意其它点都会带力臂。
      var pwr=(psep>0)?ringOut:ringIn;
      var pqx=rctr.position.x+pux*pwr, pqy=rctr.position.y+puy*pwr;
      if(!rcol.supports)rcol.supports=[null,null];
      rcol.supports[0]=rcol.supports[0]||{x:0,y:0};
      rcol.supports[1]=rcol.supports[1]||{x:0,y:0};
      if(rcol.supports[1]===rcol.supports[0])rcol.supports[1]={x:0,y:0};
      rcol.supports[0].x=pqx; rcol.supports[0].y=pqy;
      rcol.supports[1].x=pqx; rcol.supports[1].y=pqy;
      rcol.supportCount=1;
      rcol._circleX=1;      // 与 R79 通道同一个诊断标记（探针靠它区分解析/SAT）
      rcol._ringX=1;        // 本支专属标记
      return rcol;
    }
    // ---- 圆-圆：解析两圆 ---------------------------------------------------------------
    // R80（用户「可以」）：Matter 0.20 的 SAT 连圆-圆都没有特例 —— 整个 Collision.collides
    //   一次都不读 circleRadius（源码只有 _overlapAxes + _findSupports 两条多边形路径）。
    //   于是两个球相撞 = 两个 48 边形相撞。实测（_diag_r80_cc.py，30 组随机构型）：
    //     法线偏离连心线 max 3.690°（≈ π/48 = 3.750°）、接触力臂 max 3.1654px（均值 1.7842）、
    //     depth 偏精确值 max 0.1310px、supportCount 恒为 2。
    //   力臂比 R·sin(π/48)=1.4601 还大，是因为多边形的支撑点是**顶点**，|r| 可以超过 R。
    // 公式（与「圆 vs 多边形」共用同一条 B→A 符号约定）：
    //   depth = RA + RB − d（d = 圆心距）        normal = (c_A − c_B)/d      接触点在连心线上
    // ⚠ 这条对「一个圆完全包住另一个」也成立、方向也对，不需要单开分支：
    //   设 c_A = 0、c_B = d·u ⇒ normal = −u；求解器把 A 沿 +normal = −u 推、B 沿 −normal = +u 推，
    //   内含的 B 朝 +u 一路走到 A 的边界 R_A 之外 —— 正是 MTV 要的方向，推出量也正好是 R_A+R_B−d。
    //   唯一无定义的是圆心重合（d≈0，方向本身就是任意的），退回 SAT。
    if(rA&&rB){
      var oA2=(bodyA.id<bodyB.id)?bodyA:bodyB, oB2=(bodyA.id<bodyB.id)?bodyB:bodyA;
      var RA2=(oA2===bodyA)?rA:rB;
      var ddx=oA2.position.x-oB2.position.x, ddy=oA2.position.y-oB2.position.y;
      var dd=Math.sqrt(ddx*ddx+ddy*ddy);
      if(dd<1e-9)return _collides(bodyA,bodyB,pairs);                      // 守卫③：圆心重合
      var depthC=rA+rB-dd;
      if(!(depthC>0))return null;                                          // 真圆不接触
      var ux2=ddx/dd, uy2=ddy/dd;
      var ccol=cachedCollision(pairs,oA2,oB2)||blankCollision(oA2,oB2);    // 守卫④

//
// 现在高中模式把面板值解释成**阻尼比 ζ**（无量纲的能量耗散速率）：
//     ζ = damp / SPR_HIGH_ZETA_DIV      （面板 0..30 的常用段 → ζ 0..3，默认 7.1 → ζ=0.71）
//     D = 2·ζ·√(keff·μ)                 （μ = 两宿主的**折合质量** m0·m1/(m0+m1)）
// 为什么这样写才叫「耗散速率」：Rayleigh 阻尼的力是 F = −D·v_rel，单位时间耗散的能量
// 就是 P = D·v_rel² —— D 本身就是耗散速率系数；而 ζ = D/(2√(kμ)) 是它相对临界值的**比值**，
// 所以「滑块 = 耗散速率（相对临界）」是**字面**成立的，而不是换了个说法。
// 默认 ζ=0.71 的效果恰好是用户要的两条：
//   · 竖直弹簧拉伸后**迅速回到平衡位置**（ζ≈0.7 只有约 4% 过冲，一个来回就停住）；
//   · 水平弹簧被撞后两端**快速达到共速**（同一根 D 作用在 v_rel 上，相对速度指数衰减）。
// ζ→0（滑块拉到 0）= 完全无耗散，理想简谐振荡照旧保留（负对照见探针 A7）。
// μ 取两端**真实可动体**的折合质量；两端都没有质量（铁砧+自由端）时归一到 1kg，
// 保证滑块仍然单调可感（不会因为 μ=0 让整个阻尼消失）。
var SPR_HIGH_ZETA_DIV=10;
function springRedMass(h0,h1){
  var m0=(h0&&h0.mb&&!h0.mb.isStatic)?(h0.mb.mass||0):0;
  var m1=(h1&&h1.mb&&!h1.mb.isStatic)?(h1.mb.mass||0):0;
  if(m0>0&&m1>0)return m0*m1/(m0+m1);
  if(m0>0)return m0;
  if(m1>0)return m1;
  return 1;
}
function springDamp(B,h0,h1){
  var d=(B&&B.damp!=null)?B.damp:SPR_DAMP;
  if(PHYS_MODE!=='high')return d*springDampGain(springKEff(B?B.ks:SPR_KS_DEF));
  var z=d/SPR_HIGH_ZETA_DIV;
  var k=springKEff(B?B.ks:SPR_KS_DEF);
  return 2*z*Math.sqrt(k*springRedMass(h0,h1));
}
function stepSprings(dt){
  springKBook();         // R88⑤：宿主刚度账本（超预算时同比例缩水，见该函数注释）
  springSyncLocks();     // R65：方向锁宿主冻结自转（清角速度 + 打 _lockRot 标志，供 springForceOn 用）
  rodSyncLocks();        // ★R131-21：杆锚定宿主角度锁死（同 _lockRot 通道）
  rodHingeTorque();      // ★R131-32c：复摆重力力矩（锚定物体绕固定点摆动）
  rodSyncNoCollide();    // ★R131-38：铰链两物体互不碰撞（消除边界抖动）
  springSyncGroups();
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(B.kind!=='S'||B.dead)continue;
    springSyncEnds(B);
    var freeEndOnly=false;               // R71③：只有一端拴住 = 自由端无载荷 → 内力恒为 0
    if(B.dirLock)springRailFollow(B);    // R65：垂直方向导轨跟随（整体一起平移）
    // R95：放松态（高中 + 水平导轨 + 非拖拽）里**只能**跳过导向力 —— springGuideForce 的作用
    //   是把「偏离导轨的锚点」用一根横向小弹簧拽回导轨，而水平导轨的法向就是竖直方向：
    //   跑它 = 拿 keff*off 的竖直力继续把物体吊在半空（与放松的语义直接对冲）。
    //   跳过它之后锚点与端点的偏移（|o|）才允许长期存在 —— 那正是「连接点可以变动」。
    if(B.dirLock&&!springRailRelaxed(B))springGuideForce(B,dt); // R64：方向锁的垂直导向力（轴向力在下面统一算）
    var dx=B.e1.x-B.e0.x,dy=B.e1.y-B.e0.y,d=Math.hypot(dx,dy)||1e-6;
    var ux=dx/d,uy=dy/d;
    var h0=B.anc[0]?B.anc[0].B:null,h1=B.anc[1]?B.anc[1].B:null;
    // R71③：两端都拴住时没有「自由端」，跟踪基准立刻作废 —— 否则「两端拴住 -> 放开一端」时
    // 会拿一份隔了很久的过期基准去补位移，自由端会瞬移一大截。
    if(h0&&h1)B._freeTk=null;
    // R71③（用户：「当弹簧连接一端有物体时，为什么另一端会虚空固定？不是说了是轻质弹簧吗，
    // 应该随着固定的物体而动啊」）：只有**一端**拴住时，自由端此前是一个永远不动的世界坐标
    // —— 等于把弹簧的另一头钉在虚空里，宿主走到哪，弹簧就被拉长到哪里，还持续对宿主施加
    // 恒定虚假拉力。轻质（无质量）弹簧的自由端没有质量可被加速，其内力必须为 0，弹簧只能
    // 整体跟着宿主走、并保持在自然长度上。做法见下（按宿主位移跟随，而不是按原长重算位置）。
    // R71③ 修正（回归 r60b 2a / r60c 1d / r62 1h-2 暴露）：第一版把自由端**每帧按方向+原长
    // 重算**，结果是自由端被钉在「沿当前方向、恰好原长」的位置上 —— 它只能转、不能挪。
    // 而「把弹簧另一头拖到别的物体上」正是靠拖这个自由端完成的，于是**第二端再也拴不上任何
    // 东西**（实测 anc 从 ['W','W'] 退化成 [None,'W']，弹簧永远只有一端受载）。这是比原 bug
    // 更严重的功能损失。
    // 正确做法：不改自由端的位置，只让它在**宿主平移时跟着走** —— 用户 ③ 的原话是
    // 「应该随着固定的物体而动」，要的是「不被钉在世界坐标里」，不是「按原长钉在轴上」。
    // 实现：记下上一帧的「宿主位置 + 自由端位置」；只有当自由端**没有被外力移动过**时才把
    // 宿主的位移量补给自由端。用户（或手柄）动了自由端 -> 本帧不补，直接重记基准，
    // 于是拖拽永远赢，而宿主自己走的时候自由端跟着走。方向、长度都不再被改写。
    /* ★R106-8：光滑铰链**不走**这条自由端跟随 —— 它由 springSyncEnds 的「未锚端 = 已锚端」
     *   直接对齐（销是一个点）。若在这里再补一次质心平移，就会与那条对齐互相追打：
     *   本块每帧把未锚端搬走、下一帧 syncEnds 又拉回来 ⇒ 每帧一次的往返抖动。 */
    if(!B.dirLock&&(h0||h1)&&!(h0&&h1)&&!B.hinge){
      var hostF=h0||h1,fEnd=h0?B.e1:B.e0,tk=B._freeTk;
      // 正在被拖的弹簧：几何归指针管，这一块一律不碰位置。否则会撞上「拖弹簧 = 平移整个
      // 装配体」这条规格（springMoveRig 会把宿主也搬走）：宿主被搬到半空后按重力下落，而
      // 自由端在指针停住的那几帧里被判为「用户没动它」-> 跟着宿主一起下坠，于是松手时
      // 刚对准目标的端点已经飘出 SPR_PAD(15px)，**第二端永远锚不上**（r60b 2a 实测偏 27.4px）。
      // 拖动期间只刷新基准，让松手后的第一帧从正确的位置起算。
      var dragging=(grab.kind==='body'&&grab.obj===B);
      if(dragging){
        if(tk){tk.hx=hostF.x;tk.hy=hostF.y;tk.ex=fEnd.x;tk.ey=fEnd.y;}
      }else if(!tk||tk.host!==hostF){
        tk=B._freeTk={host:hostF,hx:hostF.x,hy:hostF.y,ex:fEnd.x,ey:fEnd.y};
      }else{
        var fmoved=(Math.abs(fEnd.x-tk.ex)>1e-3||Math.abs(fEnd.y-tk.ey)>1e-3);
        if(!fmoved){fEnd.x+=hostF.x-tk.hx;fEnd.y+=hostF.y-tk.hy;}
        tk.hx=hostF.x;tk.hy=hostF.y;tk.ex=fEnd.x;tk.ey=fEnd.y;
      }
      refreshSpringGeom(B);
      dx=B.e1.x-B.e0.x;dy=B.e1.y-B.e0.y;d=Math.hypot(dx,dy)||1e-6;
      if(d>1e-6){ux=dx/d;uy=dy/d;}
      freeEndOnly=true;
    }
    // R101⑦：轻绳 / 光滑铰链走**各自的约束求解**（位置 + 冲量投影），与弹簧力律完全分开。
    // continue 同时跳过本函数尾部的 springMirror(B) —— 两者都不该有 Matter 镜像（见上方语义段）。
    if(B.rope){
      if(!B.nodes)initRopeNodes(B);    // ★R131：旧绳/加载恢复自动链化
      /* ★R131-15：绳锚点逐帧刷新已撤销（见 springAnchorOffset 的 R131-15 段）——
       *  锚点钉材料点随宿主转，固定点永不滑动（用户拍板高中绳=大学绳）。 */
      ropeVerletStep(B,dt);
      ropeSolve(B,dt,h0,h1);continue;
    }
    if(B.hinge){hingeSolve(B,dt,h0,h1);continue;}
    // G（用户：「弹簧压缩到一定程度后不能继续压缩，相当于直接碰撞」）：弹簧有最小工作长度
    // （线圈不可重叠 = 物理弹簧压到底）。两道保险防止"反向压缩"：
    // ① 稳定轴 B._ax/_ay：端点近重合时 (dx,dy)≈0，u 漂移；端点一旦交叉，u 反向，斥力变成
    //    把两端往错误方向推。用上一帧稳定方向代替，斥力始终沿正确方向把两端推开。
    // ② 交叉检测（有向投影 proj<0 = 端点已越过对方）：一旦越过，力按 minLen 算（最大斥力），
    //    不让 d 继续涨回去使 ks*(d-len) 翻正成吸引力 —— 否则交叉后两端分开到 d>len 时，
    //    力变拉力把两端往错误方向越拉越远 = 反向压缩的根因。
    // ③ dEff=max(d,minLen)：压到底后力不再随 d→0 发散，固定在"触底"斥力，相当于刚性挡板。
    var minLen=Math.max(8,B.len*0.12);
    if(B._ax==null){B._ax=ux;B._ay=uy;}
    var projG=dx*B._ax+dy*B._ay;          // 有向投影：>0 正常，<0 已交叉
    var crossedG=projG<0;
    if(!crossedG&&d>=minLen){B._ax=ux;B._ay=uy;}  // 正常时更新稳定轴
    if(crossedG||d<minLen){ux=B._ax;uy=B._ay;}    // 触底/交叉时用稳定轴
    var dEff=crossedG?minLen:Math.max(d,minLen);
    // v_rel > 0 表示两端在互相远离：拉长的过程要被阻尼压住，否则永远荡不停。
    // R59（用户「越弹越快，能量不守恒」）：阻尼项符号原来是负的 —— f=ks*(d-len)-DAMP*vrel
    // 意味着「分离越快，回复力越小，甚至反号把两端往外推」，这是**反阻尼**（振幅指数增长）。
    // 之前没炸是因为 Matter 自带 frictionAir≈0.01 在替它泄能，把负阻尼盖住了；一旦场景里
    // 泄能通道弱（球在地上弹、弹簧长、ks 大），振幅就肉眼可见地越弹越大。 Rayleigh 阻尼的
    // 正确写法：F_damp = -D*(dd/dt) 沿 ∂d/∂e —— h1 受 -D*vrel*u，折进 f 就是 +DAMP*vrel。
    var vrel=springHostVel(h1,ux,uy, h1?B.e1.x:null,h1?B.e1.y:null)
            -springHostVel(h0,ux,uy, h0?B.e0.x:null,h0?B.e0.y:null);
    // R88⑤：力上限随 ks 换算（见 SPR_FMAX 注释）。旧代码把 24000 写死 —— 那是「ks = 默认值」
    // 那一档的数字，写死它等于宣告「k ≳ 3600 的弹簧就是一台 24000 的恒力机」。
    // keff 是**被稳定墙截断后**的刚度（见 SPR_K_MAX）：截断后 k 越大越硬这条语义仍然成立，
    // 只是超过上限之后按「本机最硬的可稳定弹簧」执行。share 是宿主预算的分摊比例 ——
    // 同一个宿主上挂 n 根弹簧时，它们分 SPR_K_MAX 这一份，刚度从「叠加到爆」变成「封顶」。
    var keff=springKEff(B.ks)*Math.min(springKShare(h0),springKShare(h1));
    var fmax=springFMax(keff);
    var f=clamp(keff*(dEff-B.len)+springDamp(B,h0,h1)*vrel,-fmax,fmax);
    // R71③：自由端无载荷（见上）→ 内力必须为 0。否则「一端拴住」的弹簧会靠阻尼项
    // D·v_rel 对宿主施加一个沿轴向的恒定虚假阻力（宿主下落时 v_rel≠0，f 就非零），
    // 用户看到的就是「弹簧拖住了物体」。
    if(freeEndOnly)f=0;
    // 力的方向：u 是 e0->e1。拉长（f>0）时 e1 这一端要被拽向 e0，也就是沿 -u；e0 那端沿 +u。
    // 首轮把这两个符号写反了 —— 拉长反而把两端推得更远，形变量指数发散（实测 0.5s 里宿主
    // 从 500 冲到 796）。
    // R78（用户⑤「弹簧压缩到最小后碰撞吸能」）：触底反射必须作用在**本帧弹力施加之前**的
    //   轴向速度上。完整推导见下方触底块的长注释；这里只是把两个宿主的「施力前轴向速度」
    //   存下来（此刻 ux,uy 已经替换成触底/交叉时用的稳定轴 B._ax/_ay，与随后施力的方向一致）。
    B._sv0=(h0&&h0.mb&&!h0.mb.isStatic&&h0.kind!=='S'&&!h0.dead)?(h0.mb.velocity.x*ux+h0.mb.velocity.y*uy):null;
    B._sv1=(h1&&h1.mb&&!h1.mb.isStatic&&h1.kind!=='S'&&!h1.dead)?(h1.mb.velocity.x*ux+h1.mb.velocity.y*uy):null;
    if(f){
      // 力作用在**锚点**上（e0/e1 就是锚的世界坐标），宿主才会绕挂点转 —— R60b
      springForceOn(h0, f*ux, f*uy,dt, h0?B.e0.x:null, h0?B.e0.y:null,keff);
      springForceOn(h1,-f*ux,-f*uy,dt, h1?B.e1.x:null, h1?B.e1.y:null,keff);
    }
    // G-collision（位置+速度约束）：力通道有 ±24000 限幅，重物/高速冲击时一帧刹不住——
    // m=5、v=5000px/s 时一帧位移 83px，远超 minLen(20px)，stepSprings 检测到触底时
    // 端点早已穿透。必须像物理引擎处理穿透一样做**位置修正 + 速度清零**：
    // ① 位置修正：沿稳定轴把两端推回到 d=minLen（穿透量 = minLen - projG，projG<0 交叉时
    //    穿透更大），质量加权分配（重的少动）。
    //    ⚠ R77（用户⑤「弹簧连接两个物体碰撞时，一旦弹簧被压缩到最小后，碰撞就会产生大于之前
    //    的动能，导致一直叠加」）的关键：**第三参必须省略**。本工程内嵌的 Matter 0.20 里
    //    setPosition(e,t,n) 的 n 是「把位移当速度」的传送语义 ——
    //        n 真 : velocity = delta（且 positionPrev = 旧位置）
    //        n 缺省: positionPrev += delta（速度原样保留）
    //    旧代码传 true，于是每次触底都凭空把两端速度**赋值**成 penG，与碰撞前的动能毫无关系；
    //    弹回去再来一次就再加一次 ⇒ 越弹越快。实测（_diag_r77_sprmin.py，GRAV=0/damp=0 的
    //    隔离台，总机械能必须守恒）：注入 50+ 次、单次最大 142.6px/步，触底相对速度
    //    1699→1746→2022→2284→3888→9825 px/s，末窗能量 94 倍。缺省值 = 位置修正而速度不变，
    //    再配合下面的速度清零 = 触底当「完全非弹性挡板」，能量单调不增。
    //    （全工程另外 6 处 setPosition 调用本来就没给第三参，这一处是唯一的例外。）
    // ② 速度清零：清掉接近方向的线速度分量 = 非弹性碰撞响应。角速度分量由力通道后续帧处理。
    // R77（用户⑤ 第二条通道）：触底的**判据与响应必须同源** —— 都用 Matter 本体的速度（px/步）。
    //   `vrel` 是 JS 侧派生量（stepMatter 每帧用「位置差分 × 校正系数」写回），会被**本块自己
    //   上一帧的位置修正**（setPosition 传送）污染。_diag_r77_bot.py 在真实连续触底里实测：
    //     · 深触那次 vAjs=+480px/s 而 vAm*60=+332（幅值差 1.446 倍）⇒ 削掉 8.0px/步而实际只有
    //       5.53 ⇒ 把物体**反向推**出去；
    //     · 后续几次 vAjs=+94.5 而 vAm*60=-52.3（**符号相反**）⇒ 判据说「还在接近」其实已经在分离。
    //   拿这种值当接近速度，等于把「该刹停」算成「该反推」，每弹一次多给一点能量 —— 这正是
    //   用户报的「动能变大、一直叠加」的第二条通道（第一条是 setPosition 第三参，见上面注释）。
    var vrelM=0;
    if(h0&&h0.mb)vrelM-=(h0.mb.velocity.x*ux+h0.mb.velocity.y*uy);
    if(h1&&h1.mb)vrelM+=(h1.mb.velocity.x*ux+h1.mb.velocity.y*uy);
    if(!freeEndOnly&&(crossedG||d<=minLen)&&vrelM<0){
      var h0f=h0&&h0.mb&&!h0.mb.isStatic&&h0.kind!=='S'&&!h0.dead;
      var h1f=h1&&h1.mb&&!h1.mb.isStatic&&h1.kind!=='S'&&!h1.dead;
      var penG=minLen-projG;                  // projG<0(交叉)时 penG>minLen，正确加大修正量
      if(penG>0.01){
        if(h0f&&h1f){
          var m0g=(h0.mass&&h0.mass>0)?h0.mass:1, m1g=(h1.mass&&h1.mass>0)?h1.mass:1;
          var s0g=m1g/(m0g+m1g), s1g=m0g/(m0g+m1g);
          Matter.Body.setPosition(h0.mb,{x:h0.mb.position.x-penG*s0g*ux,y:h0.mb.position.y-penG*s0g*uy});
          Matter.Body.setPosition(h1.mb,{x:h1.mb.position.x+penG*s1g*ux,y:h1.mb.position.y+penG*s1g*uy});
        }else if(h0f){
          Matter.Body.setPosition(h0.mb,{x:h0.mb.position.x-penG*ux,y:h0.mb.position.y-penG*uy});
        }else if(h1f){
          Matter.Body.setPosition(h1.mb,{x:h1.mb.position.x+penG*ux,y:h1.mb.position.y+penG*uy});
        }

      // allowed to FALL by gravity (stepPhysics) and to be pushed back out of whatever it landed
      // on (the block further down); what it never gets is a shove or a bounce. Once a well is
      // split (losing M or a 2nd r) it is no longer isWell and becomes a normal pushable body.
      // R71⑧（用户：「物体质量不影响碰撞效果（999kg 落体撬不动 1kg 杠杆）」）：**杆退出这条免责**。

      // 于是「质量」在杠杆上完全失效。现在杆按自己的质量参与（默认 1kg，见 rodMassOf）。
      // W（画出来的线/图形）与 S（弹簧）保持不可推动：W 是用户画的地形，S 的两端由锚点决定，

        // 否则用户为「圆1 ↔ mg」设了 e 却毫无反应（面板里看得见、物理上不生效 = 假控件）。
        var eov2=pairOvAB(A,B);

        // 弹回去，压在弧/线上的物体就永远停在 0.x 像素的微弹里（用户 #5）。相对法向速度小到
        // 只可能是「重力一帧加出来的」时，按完全非弹性处理；真正撞上来（速度大）照旧反弹。
        // 弹簧同理（它也是无惯性的铁砧，bounc=0），否则东西停在弹簧上会一直微弹。
        if((AW||BW||AS||BS)&&Math.abs(vn)<W_BOUNCE_MIN)e=0;
        // ---- R71⑧：把「角冲量」补上 ----------------------------------------------------
        // 这条手写通道原本**完全没有角冲量** —— 就算把杆从「不可推动」里放出来，它也只会平移，
        // 永远不会被撬起来（用户要的正是「把另一头撬上去」）。这里补标准刚体冲量：
        // 有效质量里加入转动项 (r×n)²/I，冲量再按力矩 τ = r × F 折算成 Δω = τ/I。
        // 杆越轻越长越容易被撬动 —— 这就是用户要的「质量影响碰撞效果」。
        var Kden=1/mA+1/mB;
        if(rotI>0){rr=rAx*ny-rAy*nx;Kden+=(rr*rr)/rotI;}   // (r×n) 的 z 分量
        var jimp=-(1+e)*vn/Kden;

        if(!immB){B.vx-=jimp*nx/mB;B.vy-=jimp*ny/mB;}
        if(rotI>0){
          // 作用在杆上的冲量：杆是 A 时取 +n，是 B 时取 −n（与上面两行同符号）
          var sgnT=(rodT===A)?1:-1;
          rodT.om+=(rAx*(sgnT*jimp*ny)-rAy*(sgnT*jimp*nx))/rotI;
        }
      }
      // ---- a boundary that FELL onto a STATIC body still has to be able to LAND on it ---------
      // Both sides unpushable means the block above produced no response whatsoever, so an
      // outline falling onto a rod / another outline would sink straight through the very plank it
      // landed on. Give the boundary the single move it needs: back out along the normal, and kill
      // its landing speed. It is still never shoved sideways and never bounces (bounc=0), so
      // nothing can knock it about - weight, not inertia.
      if((AW||BW)&&immA&&immB){
        var half=(AW&&BW)?0.5:1;                       // two boundaries share the separation
        if(AW){
          A.x-=nx*ov*half;A.y-=ny*ov*half;
          var va=A.vx*nx+A.vy*ny;if(va>0){A.vx-=va*nx;A.vy-=va*ny;}

        if(BW){
          B.x+=nx*ov*half;B.y+=ny*ov*half;
          var vb=-(B.vx*nx+B.vy*ny);if(vb>0){B.vx+=vb*nx;B.vy+=vb*ny;}

      }
    }
  }
}

// which PARAM_DEFS entry a SINGLE letter exposes (right-click m -> mass, g -> grav, ...).
// Returns the spec id, or null when the letter has no adjustable param.
// v is special: on a vt-ROD (kind 'T') it controls the ROD LENGTH (rodlen); on a formula
// body it stays the bounce/elasticity (bounc) — "v 改变的还是 vt 后的线段的长度".
function specIdForLetter(d,B){
  if(!d)return null;
  var t=d.type||d.ch;
  if(t==='m')return 'mass';
  if(t==='M')return 'massM';
  if(t==='g')return 'grav';
  /* ★★R131-45（用户：「a 里面的面板应该要能调节角度、和 v 一样」）：真因=**这里有一条
   *  更早的旧映射 `return 'acc'`**，它先返回 ⇒ 下面新加的 asize/aang 永远到不了（实测
   *  面板里只有一行"加速度 a"、没有方向行/方向盘）。a 现语义 = **赋予持续加速度** ⇒ 删掉旧映射。 */
  /* if(t==='a')return 'acc';  ← R131-45 移除（a 已改为赋予型字符） */
  /* ★★R131-34：v 不再有「弹性」参数（用户：所有字符弹性一致、用默认值）——v 改为
   *  **赋予速度**参数（vsize 大小 + vang 方向）。 */
  if(t==='v')return (B&&B.kind==='T')?'rodlen':'vsize';
  if(t==='a')return 'asize';   // ★R131-42：a = 赋予持续加速度（与 v 同构）
  if(t===MU)return 'frict';
  /* ★R131-34：t = 世界时间倍率（Δt）；q = 电荷量 */
  if(t==='t')return 'tscale';
  if(t==='q')return 'qcharge';
  if(t==='r')return 'scale';
  if(t==='B')return 'bz';
  if(t==='E')return 'eacc';
  if(t==='I')return 'iacc';
  return null;
}

  if(B.kind==='T'){ids.push('rodlen');ids.push('rodmass');return ids;}   // R71⑧ 加质量
  // R57：弹簧暴露 劲度系数 k 与 自然长度 L₀
  // R101⑦：铰链没有可调参数（光滑 = 无摩擦、长度恒 0）；轻绳只有绳长。
  // ★R105-6：铰链的参数行从「限位角」改成「固定铰链」开关（默认关，开启后角度被定死）。

  if(B.kind==='S'&&B.rope){ids.push('rlen');return ids;}
  if(B.kind==='S'){ids.push('sk');ids.push('slen');ids.push('sdamp');return ids;}   // R71④ 加阻尼
  // R64：W 体暴露 质量（乘数）与 摩擦系数 —— 之前 W 体没有 mem 字母，永远走不到参数分支
  // R65：再加 弹性 bounce（W 体的碰撞恢复系数）
  // R72：再加 空气阻力 air（独立于弹簧阻尼的耗散通道，设 0 = 真·无阻尼）
  // ★R115：R91 加的「滚动摩擦 wroll」行已删（用户要求回退）—— 圆的摩擦调节只剩 μ 一个旋钮。
  /* R108：地面/墙面**只发两行**（长度 / 角度）—— 它的语义就是「一块可以摆角的静态板」，
   *   质量/摩擦/弹性/空气阻力对它没有意义（它是外部支撑源，不是被模拟的物体）。
   *   与传送带「只发带速」同一条纪律：不把永远没用的旋钮摆给用户。 */
  if(B.gnd)return ['gndlen','gndang'];
  if(B.kind==='W'){

function blastAt(cx,cy,R){

    if(O.kind==='W'){

       *   原来下面那句 `if(O.kind)continue;` 把**所有带 kind 的体**（S=弹簧/轻绳、T=杆）
       *   一刀切跳过 ⇒ mc² 冲击波对它们**完全无效**（W 边界在上一支有专门处理，S/T 没有）。
       *   现在：范围内的 S/T 直接**销毁** —— `killBody` 已经负责摘掉引用它的 Matter 约束、
       *   摘铰链 Constraint、唤醒睡眠体 ⇒ 不会留下幽灵约束把宿主隐形钉住。 */

function blastBoundary(O,cx,cy){

    var endP=(c1<nCut)?cuts[c1]:nSeg;
    var seg=wp.slice(prev,endP+1);prev=endP;
    if(seg.length<2)continue;
    var nb=mkBoundary(seg,{shape:'poly',closed:false});

    for(q=0;q<seg.length;q++){scx+=seg[q][0];scy+=seg[q][1];}
    scx/=seg.length;scy/=seg.length;

  }

  bodies.splice(i0,1);

}
function explodeBody(B){
  var cx=B.x,cy=B.y;

  spawnExplosion(cx,cy);

  shake(16,0.55);

function stepExplode(dt){
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];
    if(!B.exploding)continue;
    B.explT+=dt;
    var T=0.9;
    var k=clamp(B.explT/T,0,1);
    B.infl=1+0.7*k;
    B.wob=Math.sin(B.explT*38)*0.05*k;
    // NOTE: velocity is NOT zeroed here — the inflating mc² keeps moving and can be
    // pushed/gravitated like any other body (stepPhysics handles it).
    if(B.explT>=T){explodeBody(B);break;}
  }
}
// ================= BLACK HOLE (2GM/c² -> collapse) =================
var BH_MAXR=105;
// full-screen reach: pull tapers linearly to 0 at the screen's diagonal so the influence
// feels whole-screen but is exactly 0 at the rim and stronger the closer it is to the hole
var BH_REACH=2000;
/* ★R132-9s（用户 2026-10-02 晚）：「如果黑洞召唤 15 秒后场上还有物体或者什么的还有被吸上来，
 *   则直接碎裂为粒子被吸入（这样就解决了很多连接体吸不上来的问题）」。
 *   为什么需要它：stage-1 的吞噬有三重门槛 —— ①`d>BH_REACH` 直接跳过；②吸力按 1/d² 衰减，
 *   远处的体几乎不动；③`fixed` 锚死 + 装配体被杆约束连成整体时等效加速度被稀释
 *   （R131-23b 的补偿上限 8 倍，且"连着固定点拉不动是正确物理"）⇒ **连接体/远处物体

var BH_FORCE_AGE=15;
function stepBlackHole(dt){
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i];

    var bh=B.bh;
    bh.age+=dt;bh.spin+=dt*(0.5+bh.r/60);
    if(bh.stage===0){
      // stage 0 — collapse: horizon grows outward while the formula's letters
      // (2, G, M, c, ²) spiral inward and get sucked through (alpha -> 0).
      bh.t+=dt;
      var k=bh.t/0.8;
      if(k>=1){bh.stage=1;bh.r=BH_MAXR;continue;}
      var ek=1-Math.pow(1-clamp(k,0,1),3);
      bh.r=BH_MAXR*ek*0.5;
      var s=clamp(1-k*1.4,0,1);
      B.infl=s;B.wob=Math.sin(bh.t*30)*0.3*k;
      bh.fade=(k>0.7)?clamp(1-(k-0.7)*4,0,1):1;   // letters sink into the horizon
      if(k>=0.92){
        // the letters are consumed by the horizon
        B.glyphs.slice().forEach(function(g){if(g.body===B){g.body=null;g.inBody=false;killLetter(g);}});
        B.glyphs=[];
      }
      continue;
    }
    // ---- stage 1 — alive: devour EVERYTHING on screen (whole-screen accretion) ----
    if(!(BH_MERGE&&(BH_MERGE.a===B||BH_MERGE.b===B))){if(B.vx||B.vy){B.vx=0;B.vy=0;}}   // the hole itself is immovable（★R131-23 merge 期解除）

    if(grab.kind==='body'&&grab.obj===B)continue;   // paused while the hole is being dragged
    /* ★★R132-9s（用户：「召唤 15 秒后场上还有物体…就直接碎裂为粒子被吸入」）：
     *   15s 到了就**清场** —— 不看距离、不看质量、不看是否 fixed（黑洞面前本来就没有"固定不住"
     *   的说法，见下面 W 体那段注释），逐个「爆粒子 + 走既有的湮灭/清场通道」。
     *   ★只做一次（`bh.forced`）：否则每帧重扫会连着刚生成的粒子一起爆。
     *   ★被抓在指针下的体跳过：那是用户此刻正拿着的东西，不该在手里被吃掉。 */

        try{
          burstParticles(OF.x,OF.y,10,1);

  // stronger than another, and at the very rim the pull is exactly zero.
  var reach=BH_REACH;
    /* ★★R131-23b（用户：「黑洞对连接体的吸力不足，吸不起来」）：吸力加速度与质量

            if(ab2.B===N&&!aa2.B.dead&&!seen[aa2.B.i])other=aa2.B;

      var d=Math.hypot(dx,dy)||1;

      // tangential part (spiral), and ACCRETION DRAG — velocity-proportional damping,
      // a true energy sink that is stronger the closer the body is. No stable orbit
      // can survive the drag: everything spirals in and gets swallowed.
      // Field sources (B/E) and rods ARE devoured too — they are objects on the canvas.
      var fall=(O.kind==='q'||O.kind==='I');
      var src=(O.kind==='B'||O.kind==='E');
      var taper=clamp(1-d/reach,0,1);
      var inv=1/Math.max(d,20);
      var ux2=dx*inv,uy2=dy*inv;       // toward the hole
      var tx2=-uy2,ty2=ux2;            // tangential (spiral)

      var _am=_asmMult[O.i]||1;
      O.vx+=ux2*pull*_am;O.vy+=uy2*pull*_am;
      O.vx+=tx2*pull*0.5*_am;O.vy+=ty2*pull*0.5*_am;
      var drg=Math.pow(0.25,dt*1.6*Math.min(1,bh.r/Math.max(d,30)));

      // R56：W 边界（画出的线/图形）是 Matter 刚体——每帧 stepMatter 用 mb.position 覆写
      // B.x/B.y，直接手推坐标会被吞掉（L011 同类坑）。必须把速度注入 Matter 本体；
      // 固定（static）的边界用 setPosition 硬拽——黑洞面前固定不住。

      }
      else if(src||O.kind==='T'){O.x+=O.vx*dt;O.y+=O.vy*dt;}

      // the more it has eroded away — it visibly comes apart on the way in. The falloff is
      // long enough (~280px) that disintegration starts far from the horizon so the trail
      // is clearly visible.
      var near=clamp(1-(d-bh.r)/280,0,1);

      }

        }else{

        }
      }
    }

      var L2=freeL[fl];

        var fiv=0.06-0.045*fnear;

          L2.bhShed=0;

// the hole slowly pulls docked letters out of the top-right panel, one at a time. Each
// letter that is taken leaves an EMPTY slot in the tray frame — the frame itself never
// shrinks or breaks apart (its 4x4 grid rows are fixed in CSS, and each letter is pinned
// to its own cell by sortPanel/dockSlotEl).
function ensurePanelEat(bh){
  if(bh.panelEat)return;

function stepBlackHolePanel(B,bh,dt){
  ensurePanelEat(bh);

  if(!pe)return;
  pe.t-=dt;
  if(pe.t>0)return;

  var chars=[].slice.call(panel.querySelectorAll('.char'));
  for(var i=0;i<chars.length;i++){
    var r=chars[i].getBoundingClientRect();
    var ref=chars[i]._letterRef;
    if(ref&&ref.state==='dock'&&ref.el===chars[i]){
      pool.push({cx:r.x+r.width/2,cy:r.y+r.height/2,d:ref});
    }
  }
  if(!pool.length)return;   // tray fully emptied — the hole moves on to its finale
  // RANDOM batch: sometimes a single letter slips away, sometimes two or three go at once,
  // always picked at random across the whole tray (no fixed near-to-far order).
  var rr=Math.random();
  var count=rr<0.38?1:rr<0.68?2:rr<0.88?3:4;
  if(count>pool.length)count=pool.length;
  for(var c=0;c<count;c++){
    var idx=Math.floor(Math.random()*pool.length);
    var cell=pool[idx];
    pool.splice(idx,1);
    if(!cell||!cell.d)continue;
    var dx=B.x-cell.cx,dy=B.y-cell.cy,dd=Math.hypot(dx,dy)||1;

    freeLetter(cell.d,cell.cx,cell.cy,(dx/dd)*sp+jx,(dy/dd)*sp+jy,1);
  }
  pe.t=0.5+Math.random()*1.15;   // irregular pause between events
}

function pairOvPairMb(ma,mb2){
  var A=bodyOfMb(ma),B=bodyOfMb(mb2);
  var ka=A?bodyPid(A):((MW&&ma)?peerKeyOf(ma):null);
  var kb=B?bodyPid(B):((MW&&mb2)?peerKeyOf(mb2):null);
  var oa=(A&&A.pOv&&kb)?A.pOv[kb]:null;
  var ob=(B&&B.pOv&&ka)?B.pOv[ka]:null;
  function pick(f){
    if(oa&&ob){
      if(oa[f]!=null&&ob[f]!=null)return (oa[f]+ob[f])/2;
      return (oa[f]!=null)?oa[f]:ob[f];
    }
    var o=oa||ob;
    return o?(o[f]!=null?o[f]:null):null;
  }
  // ★R115：原 `roll:pick('roll')`（滚动摩擦的第三通道）已删。配对覆盖只剩 弹性 e / 摩擦 μ。
  return {e:pick('e'),mu:pick('mu')};

  if(!MW||!B.mb)return;

    if(a!==B.mb&&b!==B.mb)continue;
    pr.friction=Math.min(pr.bodyA.friction,pr.bodyB.friction);

    // pair 仍取到对方的 0.6，低速时照样被按住（用户「μ=0 还会慢慢停下」的帮凶之一）。
    // 取 min = 较光滑的一面主导接触，与动摩擦的 min 规则自洽。

    //     环（wshape==='ring'）是 48 段复合体、物性上更近薄圆环（λ'=1 ⇒ v_f=v₀/2），口径不同，
    //     同样留作未处理项。两项都登记进 INVARIANTS §49 的覆盖账。
    //   ⚠ 会不会被冲掉（三个 setter 都查过）：Matter.setMass/setDensity 保持 `inertia/(mass/6)`
    //     不变比 ⇒ 改质量不丢；setStatic 走 `_original` 存/取、**不**从顶点重算 ⇒ 钉住/放开不丢；
    //     产品从不调 setVertices/Body.scale（全局 grep 只命中库内部与本处注释）。

    // 「只有线是边界」：条带就是墨迹本身，弧面由离散段近似（段间角度小，滚动平滑）。
    // R82（空心圆）：ring 走同一条路，理由完全一致 —— 它的「凹面」是与外壁同心的**空腔**，
    //   凸包会把整个空腔填成一个实心圆盘。B.pts 是中线圆（shapeOutline 给的），
    //   bndSegs 切出的每段厚 2·BND_INK ⇒ 复合体 = 一整圈「墨线」，空腔天然敞着。
    //   走这条路的另一个好处：rodResolve / 摩擦配对 / 睡眠等既有机器全部照旧生效。
    var sg5=bndSegs(B),parts5=[];

      parts5.push(Matter.Bodies.rectangle(s5.x,s5.y,s5.hw*2+PEN_HW*2,s5.hh*2,
                                         {angle:s5.th,friction:0.08,frictionStatic:0.6,restitution:0,slop:0.02}));
    }

    // R82：给环的**每个 part** 打上「内外壁半径」标记，供 R79 解析通道里的「环 vs 圆」分支使用。
    // 为什么打在 part 上而不是根：Matter 的 Detector.collisions 在「任一方是复合体」时传的是
    //   **part**（源码 `c(P,_,i)`，且 P 从 parts[1] 起 —— parts[0] 是根自己，被跳过），
    //   根永远收不到这通调用。环心则要由 part.parent 取回（part.position 在中线上！）。
    if(B.wshape==='ring'&&mb&&mb.parts&&mb.parts.length>1){
      var _ro=(B.rad||0)+BND_INK,_ri=(B.rad||0)-BND_INK;
      for(var ki5=1;ki5<mb.parts.length;ki5++){
        mb.parts[ki5]._ringOut=_ro;
        mb.parts[ki5]._ringIn=_ri;
      }
      mb._ringSegs=mb.parts.length-1;
    }
  }else if(B.closed){
    var hull=inflateHull(bndHullLocal(B),BND_INK),wp=[],i;
    for(i=0;i<hull.length;i++)wp.push({x:B.x+hull[i][0],y:B.y+hull[i][1]});
    mb=Matter.Bodies.fromVertices(B.x,B.y,[wp],opts,true);

      // 搬到 (B.x,B.y)，并不是「顶点留在传入的世界位置」。中心对称形（矩形）的质心恰好与
      // 原点重合，从来暴露不出；偏心形（直角三角形）的碰撞体就整体漂移 —— 实测漂
      // (+4.31,-1.33)px：碰撞底边比墨迹下缘高 1.33px，落地时墨迹扎进地面线一截。
      // 把这次平移用与下方原点重定位**完全相同**的动作补偿回来（pts/hull/ell/arcs 一起搬）。
      var ctrF=Matter.Vertices.centre(wp),fxw=B.x-ctrF.x,fyw=B.y-ctrF.y;
      // R75：世界位移 -> 本地位移（R(−prevTh)），见 buildMatterBody 顶部说明。
      var fx=fxw*cT+fyw*sT,fy=-fxw*sT+fyw*cT;

      // （实测矩形质心 499.9999999999974）。不加阈值就把这 1.3e-12 反向加进 B.pts，
      // 于是 inkPointDist 从精确的 15 变成 14.999999999999998 —— distToHost 与 SPR_PAD(15)
      // 的严格小于判定被这 1e-12 翻面（r57 57-3：e1 隔空 15px 被吸到方块上）。
      if(Math.abs(fx)>1e-6||Math.abs(fy)>1e-6){
        // hull2D 返回的数组里装的是 **B.pts 里那几个同一个点对象**（不是拷贝）。pts 与 hull
        // 各平移一次 = 同一个点被搬两遍 —— 实测直角三角形补偿量翻倍（2×2.92=5.83px），
        // 碰撞底边反而跑到墨迹下缘下面 2.9px（图形悬空）。按**引用**去重后再搬。
        var moved9=[];
        function shiftPt9(p){if(moved9.indexOf(p)>=0)return;moved9.push(p);p[0]+=fx;p[1]+=fy;}
        for(i=0;i<B.pts.length;i++)shiftPt9(B.pts[i]);
        if(B.hull)for(i=0;i<B.hull.length;i++)shiftPt9(B.hull[i]);
        if(B.ell){B.ell.lcx+=fx;B.ell.lcy+=fy;}
        if(B.arcs)for(var k9=0;k9<B.arcs.length;k9++){
          B.arcs[k9].lcx+=fx;B.arcs[k9].lcy+=fy;B.arcs[k9].lmx+=fx;B.arcs[k9].lmy+=fy;}
      }
    }
    if(!mb){ // degenerate hull (collinear stroke closed by accident): fall back to a thin box
      var sg=bndSegs(B),tot=0,cx=0,cy=0;
      for(i=0;i<sg.length;i++){tot+=sg[i].hw*2;cx+=sg[i].x*sg[i].hw*2;cy+=sg[i].y*sg[i].hw*2;}
      cx/=Math.max(1e-6,tot);cy/=Math.max(1e-6,tot);
      mb=Matter.Bodies.rectangle(cx,cy,Math.max(14,tot),PEN_HW*2,opts);   // PEN_HW==BND_HH: same 6px ink

    //   把**闭合笔画**（方块/三角/任意闭合多边形的碰撞体）的转动惯量写回**物理值**。
    //   依据（`_diag_r122a.py` 实测，同一把尺子、同一页面）：
    //     Matter 的 `Body._inertiaScale = 4` 让**每个**体的惯量都是「纯几何惯量 × 4」；
    //     圆的 lam 在 R121 之后是 **1.0029**（已改），而方块/三角实测 **4.0000 / 4.0000**。
    //   后果（`_diag_r122b.py` 量到的下游症状）：方块斜着落地的翻滚角速度 `ω = J·r_perp/I`
    //     ⇒ **ω ∝ 1/I** ⇒ 惯量大 4 倍 ⇒ 同一个手势下转速只有物理值的 **1/4**、方块「翻不动」。
    //   写法为什么是 `/4` 而不是显式 `Vertices.inertia(...)`：
    //     · `/4` **精确等价于把库的 `_inertiaScale` 从 4 改成 1**，不假设形状；
    //     · 显式公式对 `fromVertices` 的结果可能是**多 part** 的复合体，`mb.vertices` 那时是
    //       **凸包**（非凸形会丢信息）⇒ 显式公式反而会算错；`/4` 对单/多 part 都只是「撤掉 scale」。
    //   ⚠ 本行**只覆盖 `closed` 这一支**（方块/三角/手绘闭环）。另外两支**不动**，理由不同：
    //     · `trough/tub/ring/arc` 走 `segCompound`：实测它们的**根** `inertia` 还**额外漏掉
    //       平行轴项 m·d²**（环的平行轴占完整物理惯量的 **99.7%**）。那里若跟着 `/4`，会让
    //       「偏小」更偏小（环会从偏小 77 倍变成偏小 307 倍）⇒ **比物理更远**，必须**先补齐
    //       平行轴合成**才谈得上除 4，留作单独课题（见 INVARIANTS §50 覆盖账）。
    //     · 圆已在 R121 显式写成 `½mR²`，不走这里。
    //   ⚠ 会不会被后续 setter 冲掉：`setMass/setDensity` 保持 `inertia/(mass/6)` 不变比；
    //     `setStatic` 走 `_original` 存/取、不从顶点重算 —— 与本行正交（同 R121 的查证）。

    // R71⑦（用户：「圆弧碰撞箱和笔画不一样，一端对准地面时小球经过会弹一下」）：
    // 每段盒子原来是 `hw*2 + PEN_HW*2` —— 两端各向外多伸 3px，用意是**相邻段互搭、消除接缝**
    // （内部段必须保留，否则盒与盒之间会有 V 形缝，球滚过去就是咯噔一下）。
    // 但首段/末段的外侧那 3px 没有任何东西要对搭，它只是让碰撞**越出笔画端点 3px**：
    // 屏幕上笔端是 round cap（半径 2.325px 的半圆），碰撞却是一块 6px 宽、往外突 3px 的方头。
    // 后果正是用户描述的那一幕——把弧的一端「对准」地面时，肉眼看到端点刚碰到地面，碰撞体
    // 其实已经扎进地面 3px，Matter 把它顶起来，视觉端点与地面之间就裂开一条 ~3px 的缝；
    // 小球沿地面滚过来正好钻进缝里被楔起，看起来就是「经过端点被弹一下」。
    // 修法：只有**开链**的首末段取消外侧外延（端点停在笔画端点，方头与 round cap 的圆心齐平），
    // 内侧照旧外延以维持与邻段的搭接。闭链（矩形/三角/凹槽等）首末段本就相邻，一律不动。
    var sg2=bndSegs(B),parts=[],open2=!B.closed,nS2=sg2.length;
    for(i=0;i<nS2;i++){
      var s=sg2[i];
      var ex0=PEN_HW,ex1=PEN_HW;                    // 沿切线向外（起点侧 / 终点侧）的外延量
      if(open2){
        if(i===0)ex0=0;                             // 起点：不外延
        if(i===nS2-1)ex1=0;                          // 终点：不外延
      }
      var boxLen=s.hw*2+ex0+ex1;

      var bxc=s.x+Math.cos(s.th)*sh,byc=s.y+Math.sin(s.th)*sh;
      parts.push(Matter.Bodies.rectangle(bxc,byc,boxLen,s.hh*2,
                                         {angle:s.th,friction:0.08,frictionStatic:0.6,restitution:0,slop:0.02}));
    }
    mb=segCompound(parts,B);
  }

  // plain copy (B.x=mb.position.x, B.th=mb.angle). Created at angle 0, so the shift is pure
  // translation: the drawn picture does not move by a single pixel.
  var dxw=B.x-mb.position.x,dyw=B.y-mb.position.y;

   *   最后直接飞出整个屏幕」）—— 补偿量必须取**世界位移本身**。
   *
   *  推导（由 `_diag_r339` 产品内部真值 + 解析对账互证）：
   *   · 本函数在 `B.th = 0` 下建体（`bndPts` 此时输出 `B.x + pts`）⇒ 建体帧里
   *     **本地系与世界系重合**，所以「世界位移」直接就是「本地位移」。
   *   · 建完 `setAngle(prevTh)` 是 Matter 语义的**绕质心**旋转（`Body._rotate` 以
   *     `body.position` 为中心），而渲染 `drawBoundaries` 是绕**原点 `(B.x,B.y)`** 旋转
   *     ⇒ 两者恒差 `(I − R(θ))·ρ̄`（ρ̄ = 本地几何的质量加权质心偏移）。
   *   · 旧版补偿量取 `R(−prevTh)·δw`（R75 引入），与「下一轮 arcResample 用 `lc` 重算
   *     `pts`、却**不动 `lc`**」耦合成乘性递推：
   *         ρ̄_{n+1} = (I − R(−θ))·ρ̄_n ,   谱半径 = 2|sin(θ/2)|
   *     θ=0 → 0（一轮归零）、θ=60° → 1、θ=141.73° → **1.8895 > 1**（发散）。
   *     ★实测对账（`_diag_r336`，ΔB.x 逐轮）：
   *         43.470 106.984 226.756 427.610 717.088 1033.498 1129.644
   *       解析预测：43.470 106.983 226.754 427.607 717.086 1033.498 1129.654  ——逐位吻合。
   *     这才解释了「只有把弧转过大角度、再拖端点才会飞出屏幕」。
   *   · 退回世界位移后下一轮 `ρ̄ = 0` ⇒ **一步进入不动点**（`fixA` 实测 wc 漂移 0.0000px、
   *     物理≡渲染间隙 0.762px，与「从未转过角」的对照臂逐位相同）。
   *
   *  ★口径：本函数**必须**在 `B.th=0` 下被调用（`arcResample` 已保证）。若将来有调用方
   *    带着非零 `B.th` 进来，`bndPts` 会输出「已旋转的世界点」，本行的「世界位移直加」
   *    就不再是本地位移 —— 那时必须把这一行改回按 `prevTh` 换算。
   *  ★th=0 时 `R(0) = I` ⇒ 本行与原式 `dxw*cT+dyw*sT` 逐字节等价，历史行为不变。 */
  var dx=dxw,dy=dyw;
  if(dx||dy){
    for(var k=0;k<B.pts.length;k++){B.pts[k][0]+=dx;B.pts[k][1]+=dy;}
    // R72-F：本地 hull 缓存也跟着搬 —— solidSAT（公式体↔实体的手写碰撞）读的是它，
    // 只搬 pts 不搬 hull 的话，渲染与 Matter 对齐了、手写通道却错开同样的量。
    if(B.hull)for(var kh=0;kh<B.hull.length;kh++){B.hull[kh][0]+=dx;B.hull[kh][1]+=dy;}
    // R56：圆弧的椭圆锚点必须跟着本地原点的平移一起补偿，否则重建后 ell 与 pts 脱节，
    // 端点手柄拖一次就把角度算飞（实测 a1 直接掉到最小扫过角）。
    if(B.ell){B.ell.lcx+=dx;B.ell.lcy+=dy;}
    // R68：凹槽真弧元数据同样要跟着平移（圆心 + 弧中点都是本地坐标）。
    if(B.arcs)for(var k8=0;k8<B.arcs.length;k8++){
      B.arcs[k8].lcx+=dx;B.arcs[k8].lcy+=dy;B.arcs[k8].lmx+=dx;B.arcs[k8].lmy+=dy;
    }
  }
  B.x=mb.position.x;B.y=mb.position.y;
  // R75：把姿态恢复成重建前的值，并同步到 Matter —— 旧版这一步在 arcResample 里做，
  // 现在收进 buildMatterBody，好让上面的本地位移换算拿得到真实姿态。
  B.th=prevTh;
  /* ★★R132-9l（同上一处）：`setAngle` 是 Matter 语义的**绕质心**旋转，而渲染
   *   `drawBoundaries` 是绕**原点 `(B.x,B.y)`** 旋转 —— 两者只差一个把原点搬回原位的平移
   *     T = (I − R(prevTh))·δw
   *   （δw = 重建前原点与本体质心的世界位移，即上面那两个 `dxw/dyw`）。
   *   补上 T 之后，Matter 顶点与 `traceWPath` 画出的世界几何**逐点重合** ⇒
   *   ①「肉眼看到的弧」与「碰撞/旋转体」不再错位（用户说的「抽搐」）；
   *   ② 下一轮重建时 ρ̄ 归零，乘性递推熄火（这是止住爆炸的另一半，缺一不可 ——
   *      只补 T 而不退世界位移的对照臂 `armZ` 实测仍然发散至 2.8e4）。
   *   prevTh=0 时 cT=1、sT=0 ⇒ T=0，整段退化为原行为（逐字节等价）。 */
  if(prevTh){
    Matter.Body.setAngle(mb,prevTh);
    var _tqx=(1-cT)*dxw+sT*dyw,_tqy=-sT*dxw+(1-cT)*dyw;
    if(_tqx||_tqy){
      Matter.Body.setPosition(mb,{x:mb.position.x+_tqx,y:mb.position.y+_tqy});
      B.x=mb.position.x;B.y=mb.position.y;
    }
  }
  B.vx=0;B.vy=0;B.om=0;
  B.fixed=false;                  // 右键"固定"：停在原地，鼠标仍可拖动，再点取消
  mb.sleepThreshold=240;           // compound bodies do NOT inherit part options — set it here
  Matter.Composite.add(MW.wLayer,mb);
  B.mb=mb;
  B._natMass=mb.mass;              // R64：自然质量（按几何算），wmass 乘数以它为基准
  applyWMul(B);                    // R64：重建/复制后恢复用户调过的质量乘数与摩擦
}
/* ================= R71-B：完全弹性接触的能量守恒守卫 ========================
   用户②「弹性调到 1，弹跳高度还是缓慢衰减」＋用户⑥「手绘开链 e=1 从空中释放会在地上
   翻滚越来越快」。两者是同一个 bug 的两面：Matter 的迭代求解器**无法精确复现 e=1**。
   诊断实测（_diag_r71_energy.py，纯垂直弹跳、air=0、rest=1，逐次触底的出/入射速度比）：
       0.9715  0.9443  0.9603  1.0014  0.9474  0.9701
   平均 0.966 —— 每次弹跳丢 ~3.4% 速度（≈6.7% 高度），偶尔还**倒赚** 0.14%（正是 ⑥ 的

     在数学上就无法精确达成。

   注意 Matter 的 solveVelocity 全程只读写 positionPrev/anglePrev，不读 velocity 字段），
   子步后对「声明弹性 ≥1」的活动接触，把**接触点法向相对速度**精确恢复成入射值的镜像
   （完美反射）；切向照旧交给 Matter 的摩擦。恢复值恒等于入射值 ⇒ 既不丢能也不注能，

    impAt(A, n.x*J*ima, n.y*J*ima, iia*J*X);

   om 恒为 0**。同场景把「杠杆」换成 W 画出来的细长矩形（MODE=W），轻块直接被抛出屏幕

var WROD_VN_MIN=25;      // px/s：接触点法向入射速度低于此 = 静置压力，不反馈
var WROD_TIP_K=2.0;      // 接触点速度增量上限 = K × 入射速度（弹性对撞的极限）
var WROD_VMAX=4000;      // px/s：杆的线速度硬上限（数值安全网）

function snapRodWPrev(pre){

    var b=B.mb,e=pre[b.id];
    if(!e)e=pre[b.id]=[0,0,0];

    e[1]=b.position.y-b.positionPrev.y;

    // 铰接（支点托在杆中段，见 ROD_PIVOT_BAND）才是「杠杆」的成立条件，所以门就设在这里。
    // 注意：这条必须与上面「支撑循环只认静态对方」一起存在 —— 少了那一条，压上来的笔画
    // 自己就会被当成中段支点（它正好落在杆中央），于是「悬空」被判成「铰接」，门形同虚设。
    if(!rod._hinge)continue;

    var p=pre[D.id];

    // 支撑约束 —— 反馈了它就每子步被压一次、永远往下沉。判据用**接触点入射速度**：静置接触
    // 的接触点法向速度恒为 0（重力那一份已被求解器抵平），真砸下来的才有量级。
    var rDx=v.x-D.position.x,rDy=v.y-D.position.y;

    // 封顶取「弹性对撞的极限」2v：物理上是「极重撞击方 + 无约束轻杆」的接触点速度上限，
    // 而且**自标定** —— 轻轻碰（vn 小）就只给一点点，砸得越狠给得越多，不会变成开关。
    var tipx=dvRx-dwR*rRy,tipy=dvRy+dwR*rRx;

    if(rod.vx>WROD_VMAX)rod.vx=WROD_VMAX;else if(rod.vx<-WROD_VMAX)rod.vx=-WROD_VMAX;
    if(rod.vy>WROD_VMAX)rod.vy=WROD_VMAX;else if(rod.vy<-WROD_VMAX)rod.vy=-WROD_VMAX;
    if(rod.om>WROD_WMAX)rod.om=WROD_WMAX;else if(rod.om<-WROD_WMAX)rod.om=-WROD_WMAX;

}

// **镜像板写入 Matter 时分两种口径**：
//   · 意图运动 → setPosition(...,true)：求解器看到的板速度 = 杆的真实运动（碰撞靠它把物块推起来）
//   · 穿透修正 → setPosition(...,false)：只挪位置、positionPrev 不动（速度读数不变）

// 第一次实现）1kg 与 2000kg 两个方块都被抛出屏幕（y 冲到 −3e4），整根杆的能量无限注入。
/* ★R131-30（用户：「端点处于吸附状态则抑制该端的拖端点拉伸长度功能，不然会干扰

function rodEndLenDragAllowed(B,i){
  if(!B||B.kind!=='T'||!B.anc)return true;
  return !B.anc[i];           // 该端已锚定 ⇒ 不允许拖端点改长度
}
function rodIntegrate(B,dt){

   *  约束链（rodSyncAnchors 的 PBD/回位/重建）一起带死（_diag_r105b B5 实测
   *  resid=237px：松手后杆端永远回不到锚点）。杆位姿积分走产品字段（x/y/th），
   *  与 mb 无关；睡眠问题随板删除自动消失（无 mb ⇒ 无 Matter 睡眠）。 */
  if(B.dead)return false;
  if(grab&&grab.kind==='body'&&grab.obj===B)return false;   // 被抓住时姿态归指针，别抢

  //   · 放之前：本子步末尾若轮到「只积分不投影」的那一步，锚定端就被带走 v·dt（实测 1.7px
  //     抖动），而帧边界正好可能落在这一步上 ⇒ 画面上是锚点轻微跳动；
  //   · 放之后：**每个子步结束时锚定端都精确落在锚点上**，误差不再被采样时序放大。
  //   代价：无锚定的杆每子步多一次函数调用（首行即早退，逐字节零成本）。
  // 另外这里**不再**用「sync 成功就 return false」跳过积分 —— 先积分再投影（PBD 的标准顺序）
  // 才能让「宿主在动、杆速度为 0」的帧照样被投影搬走（原来的需求由「投影总会被调用」满足）。
  if(B._lockRot)B.om=0;                              // 方向锁宿主：角速度保持 0（与 springSyncLocks 一致）

  //   stepPhysics 那条重力语句是 `if(B.hasG&&!isGravityLetterOnly(B))B.vy+=((B.grav!=null)?B.grav:GRAV)*dt`，
  //   它上面的筛子只跳过 kind 'B'/'E' 与 'W' —— 杆（'T'）不在排除之列，且 makeRod 置了 `hasG=true`。
  //   R80 的实测证据：一条 24px 笔画被 mkBoundary 拒成 null 之后，杆一路自由落体 430 → 716（Δy=286）。

  //   那条语句已加 `B.kind!=='T'` 把杆排除（见 stepPhysics 注释）；本函数也就不再有重力来源。
  //   ⇒ 「杆掉不下来」现在是正确的、不是 bug；谁要是看见杆悬在空中别再当成重力失效去修。
  //   杆与 W 体的真正区别仍然只在**谁积分**：W 的位姿归 Matter（stepMatter 回写），
  //   杆的位姿归下面的 rodIntegrate。
  // 除了杆端锚点（rodSyncAnchors 的铰链投影）之外杆没有持续的支撑约束，
  // 冲量一旦进来就只能靠这里耗散。
  // 指数衰减（与 dt 无关）而不是逐帧乘常数 —— 子步是 240Hz，逐帧乘会把「1 秒」写成 1/240 秒。

// 这里是整条链路上最容易写错的一环，两种朴素写法都试过、都被实测否掉：

var ROD_PUSH_MAX=1.5;      // px/子步：单次位置推出的硬上限

function mthHTML(tex){

    if(s.charAt(i)!=='{')return {body:s.charAt(i),next:i+1};

    }
    return {body:s.slice(i+1),next:s.length};

  function run(s){
    var out='',i=0;

        if(cmd==='cdot'){out+='<span class="mcoef">·</span>';i+=5;continue;}

      out+=((c>='0'&&c<='9')?('<span class="mcoef">'+esc(c)+'</span>'):esc(c));

/* ================= ★R131 柔性绳（verlet 链）：阻断 + 耷拉 ==============================
 * 用户：「轻绳有一个bug，它应该是不能穿过其他物体的，也就是如果空中有一个固定的物体，
 *   它运动到这里，应该是会被阻断且耷拉在这里」。
 * 旧实现 = 两个端点 + 一条松弛抛物线（纯视觉垂度），绳与一切物体互不碰撞（11340 行
 * 「诚实记录的边界」）。现在把这条边界推翻：绳 = **离散质点链**（verlet）——
 *   · 中间节点：B.nodes（不含两端；两端 = e0/e1，由宿主锚定/ropeSolve 收口管辖，链不篡改）；
 *   · 每帧 ropeVerletStep：节点重力 verlet 积分 → 段长约束迭代（两端钉死，来回各一遍）→
 *     节点-物体碰撞（Matter.Query.point 内部判定 + hostClosestPoint 推到最近表面点外 1px）；
 *   · 绷直拉拽语义**原封不动**留给 ropeSolve（e0/e1 距离 > len 时的 conPull/conProj）——
 *     链几何保证「端距 ≤ 链总长」，链被拉直时自然绷成直线，两套机制不打架；
 *   · 绳长改变（springSetLen）→ initRopeNodes 沿新 e0/e1 重铺；加载/旧数据 → 调用点兜底链化；
 *   · 渲染：有 nodes 走折线（真实的阻断/耷拉形状），无 nodes（ghost/兼容）走旧抛物线。
 * 已知边界（诚实记录）：节点无质量分配回宿主（链对宿主只有 e0/e1 两点的既有约束），
 *   绳自身重量不压弯宿主；节点碰撞是「推出」不是「冲量」（不把物体撞动）——轻绳无质量，
 *   这正是理想轻绳的语义。 */
var ROPE_NODE_GAP=26;        // 节点平均间距（px）：链的空间分辨率（3~36 段自动适配绳长）
var ROPE_VERLET_DAMP=0.95;   // 节点速度保留率：★R131-8c 0.995→0.95（用户：「绳子还在自己运动」
                             // ——实测松弛链晃动要 2.5s 才安定；轻绳无质量、准静态语义，
                             //  快安定更真实。0.95 ⇒ 晃动 ~1s 内进冻结门）
var ROPE_COLLIDE_ITER=3;     // 段长约束+碰撞的迭代轮数
/* ★R131-8（用户：「绳子好像比他的约束还长，明明物体已经不动了绳子还在自己运动，
 *   且从刚召唤出来就没有被拉直过，一直松松垮垮」）：
 *   · ROPE_TAUT_EPS 绷直判据：端距 de ≥ len−0.5 时，满足「链总长=len、两端钉死」的构型
 *     **只有直线一条** ⇒ 直接等分铺点 + 清 verlet 速度（px=x/py=y），本帧跳过整条
 *     积分/约束/碰撞链。没有这条，verlet 重力每帧把节点往下坠、只拉不推的段约束再把
 *     它拉回来，中途的位移全部变成节点速度 ⇒ 放下即弯、还要晃好几秒（实测
 *     _diag_r131d A 案：放下 0.25s 内 sag 0→7.95px、晃动 8.08px）。
 *   · ROPE_SETTLE 静止冻结门：松弛链收敛后（本帧最大节点位移 < 0.03px）把 px/py 对齐
 *     x/y ⇒ verlet 速度清零，链彻底停住。 verlet 的 0.995 阻尼要几十帧才耗得完，
 *     冻结门让它一到静区就停（真实绳子松手后 1s 内静止）。 */
var ROPE_TAUT_EPS=0.5;       // 绷直判据（px）：端距距 len 不足此值视为绷直
var ROPE_SETTLE=0.03;        // 静止冻结门（px/帧）：最大节点位移低于此值即冻结
function ropeSegCount(len){return clamp(Math.round((len||100)/ROPE_NODE_GAP),3,36);}
function initRopeNodes(B){
  if(!B||!B.rope)return;
  var n=ropeSegCount(B.len);
  B._segLen=(B.len||100)/n;
  var ns=[];
  for(var i=1;i<n;i++){
    var t=i/n;
    var x=B.e0.x+(B.e1.x-B.e0.x)*t, y=B.e0.y+(B.e1.y-B.e0.y)*t;
    ns.push({x:x,y:y,px:x,py:y});
  }
  B.nodes=ns;
}
var _ropeHitBuf=[];
function ropeCollidables(B){           // 可碰撞实体：一切有 Matter 体的非 S 族（W/杆镜像/带子/字母刚体）
  /* ★R131-6：排除绳**自己的锚宿主** —— 绳端钉在宿主表面（hostClosestPoint），端旁节点
   * 落进宿主内部属正常几何；推出与段约束（钉死端）打架 = 端部锯齿跳动。 */
  _ropeHitBuf.length=0;
  var ex0=(B&&B.anc[0]&&B.anc[0].B&&!B.anc[0].B.dead)?B.anc[0].B:null,
      ex1=(B&&B.anc[1]&&B.anc[1].B&&!B.anc[1].B.dead)?B.anc[1].B:null;
  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];
    if(b.dead||!b.mb||b.kind==='S')continue;
    if(b===ex0||b===ex1)continue;
    _ropeHitBuf.push(b.mb);
  }
  return _ropeHitBuf;
}
function ropeVerletStep(B,dt){
  var ns=B.nodes;
  if(!ns||!ns.length)return;
  /* ★R131-8 绷直态直线精确解：端距 ≥ len−eps 时唯一满足约束的构型就是直线，
   *  直接铺点并清速度、整帧跳过积分/碰撞 —— 出生即直、绷直期间零晃动。 */
  var dxe=B.e1.x-B.e0.x,dye=B.e1.y-B.e0.y,de=Math.hypot(dxe,dye)||1e-6;
  if(de>=(B.len||0)-ROPE_TAUT_EPS){
    var uxe=dxe/de,uye=dye/de,nn=ns.length+1;
    for(var i0=0;i0<ns.length;i0++){var tt=(i0+1)/nn,nd0=ns[i0];
      nd0.x=B.e0.x+dxe*tt;nd0.y=B.e0.y+dye*tt;nd0.px=nd0.x;nd0.py=nd0.y;}
    /* ★★R131-11（用户：「绳子还是会穿透空中的物体」）：绷直 ≠ 免碰撞 —— 绷直分支原来
     *  铺完直线就 return，障碍压在绳线上时节点全部在物体内、**永远**不推出（实测
     *  _diag_r131f C 案：绷直绳+方块压线 nodeIn=4 恒 3s 不收敛，绳从方块正中切过）。
     *  修法：铺点后做一次推出——障碍上的节点贴到最近表面外 1px，绳沿障碍表面凸出。
     *  物理上「无余量还硬弯」对无质量绳没有严格解（轻绳不推物体），取视觉正确。
     *  无障碍时 AABB 不相交 ⇒ 一趟 bounds 粗筛后零成本，绷直快路径不受影响。 */
    if(Matter.Query&&Matter.Query.point){
      var mbs0=ropeCollidables(B);
      if(mbs0.length){
        var bx0=Math.min(B.e0.x,B.e1.x),by0=Math.min(B.e0.y,B.e1.y),
            bx1=Math.max(B.e0.x,B.e1.x),by1=Math.max(B.e0.y,B.e1.y);
        for(var q3=0;q3<mbs0.length;q3++){
          var b3=mbs0[q3],bd3=b3.bounds;
          if(bd3.max.x<bx0||bd3.min.x>bx1||bd3.max.y<by0||bd3.min.y>by1)continue;
          for(var j3=0;j3<ns.length;j3++){
            var nd3=ns[j3];
            if(nd3.x<bx0||nd3.x>bx1||nd3.y<by0||nd3.y>by1)continue;
            var h3=Matter.Query.point([b3],nd3);
            if(h3&&h3.length){
              var hB3=null;
              for(var k3=0;k3<bodies.length;k3++)if(bodies[k3].mb===b3){hB3=bodies[k3];break;}
              if(!hB3)continue;
              var qq=(typeof hostClosestPoint==='function')?hostClosestPoint(hB3,nd3.x,nd3.y):null;
              if(qq){
                var ox3=qq.x-b3.position.x,oy3=qq.y-b3.position.y,ol3=Math.hypot(ox3,oy3)||1;
                nd3.x=qq.x+ox3/ol3;nd3.y=qq.y+oy3/ol3;nd3.px=nd3.x;nd3.py=nd3.y;
              }
            }
          }
        }
      }
    }
    return;
  }
  var g=GRAV*dt*dt;
  var mbs=ropeCollidables(B);
  var i,k,nd;
  // ① verlet 积分
  for(i=0;i<ns.length;i++){
    nd=ns[i];
    var vx=(nd.x-nd.px)*ROPE_VERLET_DAMP, vy=(nd.y-nd.py)*ROPE_VERLET_DAMP;
    nd.px=nd.x;nd.py=nd.y;
    nd.x+=vx;nd.y+=vy+g;
  }
  // ②③ 段长约束（e0/e1 两端钉死、来回各一遍）+ 碰撞阻断（每轮末以碰撞为准）
  // ★R131-6（用户截图：绷直绳画成一段一段锯齿且持续跳动）：段约束原版**双向**（受压也
  //   硬推开）——绳是柔索**只抗拉不抗压**；两钉死端之间受压的链像细杆柱一样屈曲成锯齿，
  //   加上每帧重力注入与碰撞推出的打架 = 锯齿形态 + 永不收敛的跳动（实测 _diag_r131b P 案：
  //   垂距偏差 0.58→3.66px 持续增长、逐帧跳动 0.16→0.78px 不收敛）。改成**只拉不推**
  //   （d>segLen 才收）：松弛段自由下垂，绷直段拉成直线，锯齿与跳动同源消失。
  for(var it=0;it<ROPE_COLLIDE_ITER;it++){
    var px_=B.e0.x,py_=B.e0.y;
    for(i=0;i<ns.length;i++){          // 正向：e0 端钉死
      nd=ns[i];
      var dx1=nd.x-px_,dy1=nd.y-py_,d1=Math.hypot(dx1,dy1)||1e-6;
      if(d1>B._segLen){
        var f1=(d1-B._segLen)/d1;
        nd.x-=dx1*f1;nd.y-=dy1*f1;
      }
      px_=nd.x;py_=nd.y;
    }
    px_=B.e1.x;py_=B.e1.y;
    for(i=ns.length-1;i>=0;i--){       // 反向：e1 端钉死
      nd=ns[i];
      var dx2=nd.x-px_,dy2=nd.y-py_,d2=Math.hypot(dx2,dy2)||1e-6;
      if(d2>B._segLen){
        var f2=(d2-B._segLen)/d2;
        nd.x-=dx2*f2;nd.y-=dy2*f2;
      }
      px_=nd.x;py_=nd.y;
    }
    if(Matter.Query&&Matter.Query.point&&mbs.length){
      for(i=0;i<ns.length;i++){
        nd=ns[i];
        var hits=Matter.Query.point(mbs,{x:nd.x,y:nd.y});
        if(hits&&hits.length){
          var hitMb=hits[0],hB=null;
          for(k=0;k<bodies.length;k++)if(bodies[k].mb===hitMb){hB=bodies[k];break;}
          if(!hB)continue;
          /* ★R131-11（用户：「绳子还是会穿透空中的物体」）：最近表面点取**本帧起始位置**
           *  （px/py=积分前位置，verlet 语义天然保留）而不是切进体内后的当前位置——
           *  后者会让相邻节点被推到障碍的**不同侧面**（上面的贴顶、下面的贴底），
           *  段直接横穿物体=视觉穿透（_diag_r131f A 案：nodeIn=7 恒定、绳从板中间过）。
           *  用起始位置选面 ⇒ 绳从哪侧来就贴哪侧表面，实现真正的「绕行」。 */
          var q=(typeof hostClosestPoint==='function')?hostClosestPoint(hB,nd.px,nd.py):null;
          if(!q)q=(typeof hostClosestPoint==='function')?hostClosestPoint(hB,nd.x,nd.y):null;
          if(q){
            var oxq=q.x-hitMb.position.x,oyq=q.y-hitMb.position.y,ol=Math.hypot(oxq,oyq)||1;
            nd.x=q.x+oxq/ol;nd.y=q.y+oyq/ol;    // 推出表面 1px（防 Query 边界抖动）
            nd.px=nd.x;nd.py=nd.y;              // 推出不攒速度（轻绳无质量，位置修正不注能）
          }
        }
      }
    }
  }
  /* ★R131-8 静止冻结：本帧最大节点位移低于 ROPE_SETTLE ⇒ px/py 对齐 x/y（verlet 速度
   *  清零），链彻底停住 —— 否则 0.995 的阻尼要几十帧才耗干净，肉眼就是「绳子还在自己动」。 */
  var _mv=0;
  for(var i2=0;i2<ns.length;i2++){var nd2=ns[i2];
    var mvi=Math.abs(nd2.x-nd2.px)+Math.abs(nd2.y-nd2.py);if(mvi>_mv)_mv=mvi;}
  if(_mv<ROPE_SETTLE){
    for(i2=0;i2<ns.length;i2++){ns[i2].px=ns[i2].x;ns[i2].py=ns[i2].y;}
  }
}
// 光滑铰链：长度恒 0（两锚点重合）。不设 ks/damp —— 它是**约束**不是弹簧。
function makeHinge(cx,cy){
  var B=BODY(cx,cy);
  B.kind='S';
  B.hinge=true;
  B.e0={x:cx,y:cy};B.e1={x:cx,y:cy};
  B.anc=[null,null];
  B.len=0;
  B.bounc=0;
  refreshSpringGeom(B);
  return B;
}
// ---- 统一的两点约束求解器（轻绳 / 铰链共用）--------------------------------------------
// 单位冲量在某点沿 n 产生的法向速度：k = 1/m + (r×n)²/I。
// 这一项就是「冲量作用在偏心点上会顺带把物体转起来」的那部分 —— 少了它，绳/铰链挂在球的
// 边缘上时球不会像真实刚体那样被拽正（R60b 在弹簧上踩过同一个坑：力只作用在质心，
// 球就以「左耳挂着」的姿态僵在半空）。
function conVel(h,px,py,nx,ny){
  if(!h||!h.mb)return 0;
  var v=h.mb.velocity||{x:0,y:0};
  var s=v.x*nx+v.y*ny;
  if(h.mb.angularVelocity){
    var rx=px-h.mb.position.x,ry=py-h.mb.position.y;
    s+=h.mb.angularVelocity*(rx*ny-ry*nx);
  }
  return s;
}
// 「这一侧吃不吃冲量、吃多少」。null = 完全动不了：static / fixed / 正被鼠标拖的 /
// 正被长度手柄按住的杆 / 弹簧这种无质量幽灵 —— 与 R93①③「指针与外部位移源不能被约束改写」
// 是同一条纪律（拖拽端在约束里等于**无穷大质量**，于是约束只会搬另一端）。
function conSide(h,nx,ny,px,py){
  if(!h||!h.mb||h.dead)return null;
  if(h.kind==='S')return null;
  if(typeof grab!=='undefined'&&grab&&grab.kind==='body'&&grab.obj===h)return null;
  if(typeof rodLenFrozen==='function'&&rodLenFrozen(h))return null;
  var mb=h.mb,im=(mb.inverseMass!=null)?mb.inverseMass:0;
  if(!(im>0))return null;                        // isStatic / 被 setStatic 过：inverseMass = 0
  var ii=(mb.inverseInertia!=null)?mb.inverseInertia:0;
  var rx=px-mb.position.x,ry=py-mb.position.y,cr=rx*ny-ry*nx;
  return {k:im+cr*cr*ii,im:im,ii:ii,cr:cr};
}
function conPush(h,s,nx,ny,J){
  if(!s||!h||!h.mb)return;
  var mb=h.mb,v=mb.velocity||{x:0,y:0};
  Matter.Body.setVelocity(mb,{x:v.x+nx*J*s.im,y:v.y+ny*J*s.im});
  if(s.ii&&s.cr)Matter.Body.setAngularVelocity(mb,(mb.angularVelocity||0)+s.cr*J*s.ii);
  if(Matter.Sleeping)Matter.Sleeping.set(mb,false);
}
// 沿 n 把两个物质点的**相对速度**投影成 0。onlySep=true 时只在「正在分离」时才动手
// —— 这就是轻绳的单边语义：会拉，绝不推。
function conProj(h0,px0,py0,h1,px1,py1,nx,ny,onlySep){
  var s0=conSide(h0,nx,ny,px0,py0),s1=conSide(h1,nx,ny,px1,py1);
  var kk=(s0?s0.k:0)+(s1?s1.k:0);
  if(!(kk>1e-12))return 0;
  var vr=conVel(h1,px1,py1,nx,ny)-conVel(h0,px0,py0,nx,ny);
  if(onlySep&&!(vr>0))return 0;
  // ★符号（R101⑦ 落地后第一遍尺子抓到的错，别改回去）：投影的目标是把 vr **消成 0**。
  //   约定：n 由 e0 指向 e1，vr = (v1−v0)·n（>0 = 两端在互相远离）；J = 施加在 h0 上、
  //   沿 **+n** 的冲量大小 ⇒ Δv0·n = +J/m0、Δv1·n = −J/m1
  //   ⇒ vr' = vr − J·(1/m0+1/m1) = vr − J·kk，令 vr'=0 得 **J = +vr/kk**。
  //   第一版写成 J = −vr/kk，效果是 vr' = 2·vr —— **每帧把分离速度翻倍**：绳/铰链不但不
  //   约束，还主动把两端越推越远。实测（_diag_r101h_devices.py 第一遍）：竖直悬挂的载荷
  //   1.5s 掉 287px、d 从 80 冲到 367.5（同夹具的弹簧只下垂 52px）；两端自由时 max d 冲到
  //   1323px（len=140）；偏心销钉 max d=339.7px。改成 +vr/kk 后四组全部转绿。
  //   这正是「先量后改 + 负对照」要抓的那类东西：符号错了代码照样跑、语法全绿。
  var J=vr/kk;
  conPush(h0,s0,nx,ny,J);
  conPush(h1,s1,nx,ny,-J);
  return J;
}
// 位置修正用的「动得了的程度」（只要 1/m，与转动无关）。
// ★R104-5/9 收尾（_diag_r104o 实测后定案）：`allowGrab` 只给**轻绳/铰链的位置修正**开口。
//   理由：拖拽端在约束里当无穷大质量（conSide/conMov 归零）本意是「不跟指针抢」，对**冲量**
//   通道（conSide）完全正确、保持不动；但对**位置**通道，它意味着「没有任何一条通道能把它
//   拉回来」——指针每帧把锚点往外搬一点，d 就一路长到 368px（用户⑤ 的「脱离物体还拖一根线」）。
//   实测过两条补救路线，都不如让拖动端**按 1/m 参与 conPull 的位移分配**：
//     · 在求解器末端另加一个「否决越界位移」的夹子（第一版做法）：它绕过了 conPull 的
//       CON_MAXSTEP 平滑收敛，与 Matter 的位置/速度自走形成正反馈 —— _diag_r104o 实测帧内
//       修正量 20.8→45.7→…→219.7px **单调增长**，且会把被拖物体顶进铁砧里。
//   参与分配之后，越界量每帧被**同一套已验证的机制**按质量比分掉：两端都可动 ⇒ 一起走
//   （拖一个另一个同步跟走），另一端是铁砧 ⇒ 全由拖拽端吸收（拖不动就是拖不动）。
function conMov(h,allowGrab){
  if(!h||!h.mb||h.dead)return 0;
  if(h.kind==='S')return 0;
  if(!allowGrab&&typeof grab!=='undefined'&&grab&&grab.kind==='body'&&grab.obj===h)return 0;
  if(typeof rodLenFrozen==='function'&&rodLenFrozen(h))return 0;
  var im=(h.mb.inverseMass!=null)?h.mb.inverseMass:0;
  return im>0?im:0;
}

   *   挂不了 Constraint（只锚一端 / 两端都是铁砧）时保留原行为。 */

// ★R103-8 复盘：曾经加过「卡死门」（两宿主几何互埋 >1.5px 时铰链让位给 Matter 接触），

//   springSyncGroups 把铰链两宿主塞进了同一个 −2 组（互不碰撞），根修之后接触解算
//   自己就能顶住折叠穿透。按「抓不住的判据 = 噪声」纪律整段删除（INVARIANTS §30.2）。
// ---- R103-8 折角限位 --------------------------------------------------------------------
// 折角 fold = atan2(销→宿主1中心) − atan2(销→宿主0中心)。捕获时机 = 两端都锚上那一刻
// （springTryAnchor / springTryAnchorByHost），限位判「相对连接那一刻的偏差 |Δfold|」。
// 越限时把两个宿主**绕销**转回去（绕销旋转不动销本身 ⇒ 位置约束不被破坏）：
//   a0 = −exc·i0/W、a1 = +exc·i1/W（i = 可动体的反质量，static 反质量 0）
//   ⇒ Δfold = a1 − a0 = exc·(i0+i1)/W = exc 精确归位，且重的一侧转得少、铁砧不转。
function hingeCaptureFold(B){
  if(!B.anc[0]||!B.anc[1]||!B.anc[0].B||!B.anc[1].B){B._hFold0=null;return;}
  var h0=B.anc[0].B,h1=B.anc[1].B;

  B._hFold0=Math.atan2(h1.y-py,h1.x-px)-Math.atan2(h0.y-py,h0.x-px);

function hingeRotateAboutPin(h,ang,px,py){
  if(!ang||!h.mb||h.mb.isStatic)return;
  Matter.Body.rotate(h.mb,ang,{x:px,y:py});
  h.x=h.mb.position.x;h.y=h.mb.position.y;      // 同帧后续求解/渲染读的是字段
  h.th=(h.th||0)+ang;
}
// ★非弹性挡块（_probe_r103 G6 边界实测）：限位只回转位置、不处理速度的话，宿主带着
//   残余切向速度（实测 ~110px/s）下一帧又冲出限位 —— 位置修正与速度互斗，把锚点
//   拽滑（销→心距 26→10.1）。把「继续往超限方向转」的切向分量消掉 = 挡块语义
//   （像碰到止动销：法向速度清零、切向保留）。sign=+1 管 fold 增方向（h1 侧），
//   −1 管 fold 减方向（h0 侧，fold=ang1−ang0）。
function hingeKillOutwardTangential(h,px,py,sign){
  if(!h||!h.mb||h.mb.isStatic)return;
  var rx=h.x-px,ry=h.y-py,r=Math.hypot(rx,ry);
  if(!(r>1e-3))return;

function hingeFoldLimit(B,h0,h1){

  //   开启 = 刚接：lim 取 0 ⇒ 折角被冻结在基准构型上，两侧绕销转回来 + 掐掉继续超限的切向速度。
  var fixed=!!(B.param&&B.param.hfix);
  if(!fixed)return;

  var lim=hl*Math.PI/180;
  if(lim>=Math.PI*0.999)return;                 // 180° = 不限位（旧「完全光滑」语义）

  //   「销→两宿主中心的折角」没有物理意义 —— 基准折角是按「拉伸构型」捕的，conPull 一边
  //   往回收、限位一边按拉伸期的基准转回去，两边打架的稳态就是**不收敛**
  //   （实测 I1：初态 40px 的两端卡在 d=28.6 不再靠近）。所以：d>HINGE_FOLD_DMAX 时
  //   限位整体跳过，并作废基准 —— 等第一帧真正闭合时按**闭合构型**重新捕获。
  var d0=Math.hypot(B.e1.x-B.e0.x,B.e1.y-B.e0.y);
  if(d0>HINGE_FOLD_DMAX){B._hFold0=null;return;}
  if(B._hFold0==null)hingeCaptureFold(B);
  if(B._hFold0==null)return;                    // 退化解（宿主中心压在销上）⇒ 放弃限位
  var px=(B.e0.x+B.e1.x)/2,py=(B.e0.y+B.e1.y)/2;

  var i1=(h1.mb&&!h1.mb.isStatic)?1/(h1.mass||1):0;

// ---- 渲染（外观没有诚实的机器判据，交给 1× 截图 + 人眼，见 §30.2）----------------------
// 轻绳：一条比杆更细的墨线；**松弛时下垂**（松弛量越大垂得越深）。
// 为什么可以这样画：轻绳无质量 ⇒ 松弛时绳形在静力学上是**不定的**（没有自重就没有悬链线），
// 下垂只是「绳是软的」这一条的惯用画法；绷直（d ≥ len）时画直线。
// ★R104-2：第二个实参 extraSlack 是**纯渲染**的附加垂度（px，默认 0），只给落点虚影用 ——
//   同一份画线代码、同一条下垂弧分支，所以「虚影所见 = 松手所得」仍是结构性成立的

    //   在 110px 绳只有 4 段时，任何垂度都读成「几段折线」。改成**过相邻中点的二次曲线**

// 光滑铰链：一个**销钉**（实心小圆 + 外圈）；两锚点还没重合时（拖拽中/瞬态）用两条细臂

/* ================= R108 新器件「地面 / 墙面」 ===========================================

 *  于是「用户明明把端点拖到下边中点旁 6px」也会被判成角候选（端点到角 24px < 26）：

 *        R131-57_post（改动前）  3/3 **True**  —— 端点吸到 (700,520)、dmin≈0

function snapPickCandidate(ex,ey,skip,B){

   *   它与角/中点在几何上互斥（带内点离角必然 > 0.3×半径，短边宿主也不会重叠），
   *   所以不会重现下面那个「角抢中点」的问题。 */

   *  在短边宿主上会把「拖到中点旁」也判成角）。独立铰链仍不参与边中点。 */

 * S 族：交给 springMoveRig（搬两端 + 所有非铁砧宿主，并清速度 ⇒ 不攒松手弹飞的动能）。

function drawDeviceSnapHints(){

 *  物理：有静止质量的物体不可能被加速到光速（相对论）—— 所以这次「赋予」被当成一次
 *  **运行时异常**抛出来：v 不并入、被弹开（走 bossRepel 同款手感），落点冒一行 error。

function vLightReject(B,d){

  var y=(d&&d.wy!=null)?d.wy:((pointer&&pointer.y!=null)?pointer.y:(B?B.y:0));

  d.state='free';d.cat=1;d.pop=1;d.massless=false;

  errTip(x,y,'Error');

 *  用 Fullscreen API（`requestFullscreen` / `exitFullscreen`）。

 *   ① 前缀：Safari 老版本只有 `webkitRequestFullscreen`；用 `el.requestFullscreen||el.webkitRequestFullscreen`
 *      取**实际存在**的那个再调（直接调不存在的属性会抛 TypeError）。
 *   ② 返回值是 Promise：某些浏览器（新版 Chromium）**拒绝**时会抛未捕获异常（典型场景：不是
 *      用户手势、或 iframe 里没给 `allow="fullscreen"`）⇒ 必须 `.catch()` 吞掉，否则控制台报错。
 *   ③ 状态同步：全屏可以由 **Esc / F11 / 浏览器 UI** 退出，那不是我们点的 ⇒ 监听

function fsElement(){

function fsSupported(){
  var el=DD.documentElement||DD.body;
  return !!(el&&(el.requestFullscreen||el.webkitRequestFullscreen));

function toggleFullscreen(){

      var ex=DD.exitFullscreen||DD.webkitExitFullscreen;
      if(ex){var r1=ex.call(DD);if(r1&&r1.catch)r1.catch(function(){});}
    }else{
      var rq=el.requestFullscreen||el.webkitRequestFullscreen;
      if(rq){var r2=rq.call(el);if(r2&&r2.catch)r2.catch(function(){});}
    }

function startStroke(e){

function penKeep(pts){
  // Thin the raw pointer stream (a sample every >=9px keeps the plank chain cheap and every plank
  // long enough to be a real wall), then cap the chain so one long scribble cannot cost the
  // collision pass hundreds of SAT tests on every single frame.
  var keep=[pts[0]],last=pts[0],i;
  for(i=1;i<pts.length;i++){
    if(Math.hypot(pts[i][0]-last[0],pts[i][1]-last[1])>=9){keep.push(pts[i]);last=pts[i];}
  }
  var end=pts[pts.length-1];
  if(keep.length<2||keep[keep.length-1]!==end)keep.push(end);
  while(keep.length>PEN_MAX){
    var thinned=[];
    for(i=0;i<keep.length;i+=2)thinned.push(keep[i]);
    if(thinned[thinned.length-1]!==keep[keep.length-1])thinned.push(keep[keep.length-1]);
    keep=thinned;
  }
  return keep;
}
function finishStroke(){
  var pts=TOOL.stroke?TOOL.stroke.pts:null;

  var keep=penKeep(pts);
  // the stroke itself is the body — an OPEN line, so its physics planks run along the stroke and
  // its weight is the stroke's own length (never the area the scribble happens to enclose)
  var B=mkBoundary(keep,{shape:'poly',closed:false});
  if(B)ringGo(B.x,B.y);

  // 真画出东西了才解除 —— 空点一下（没成体）不该把工具收掉，那只会让人莫名其妙。
  if(B&&!TOOL.cont)setToolMode(null);

/* 把 e 底下的**文本节点**逐个换成 <span class="bcharg">（保留已有元素结构与原顺序） */
function wrapTextNodes(e,out){
  if(!e)return;
  if(e.nodeType===3){
    var s=String(e.nodeValue||'');
    if(!s.replace(/\s/g,''))return;               // 纯空白（如 ` + ` 的两侧空格）不包
    var frag=DD.createDocumentFragment();
    for(var i=0;i<s.length;i++){
      var sp=DD.createElement('span');
      sp.className='bcharg';
      sp.textContent=s.charAt(i);
      frag.appendChild(sp);
      out.push(sp);
    }
    e.parentNode.replaceChild(frag,e);
    return;
  }
  if(e.nodeType!==1)return;
  if(e.classList&&e.classList.contains('bcharg')){out.push(e);return;}
  fracInsertBars(e);
  var kids=[];
  for(var k=0;k<e.childNodes.length;k++)kids.push(e.childNodes[k]);
  for(var j=0;j<kids.length;j++)wrapTextNodes(kids[j],out);
}
/* ★★R132-4：`bossBuildPlat` 用。`mthHTML` 现在**自带** `.fracbar`，

 *  并把 `.fracbar` 转成 `.bcharg.fracbar` 纳入逐字符序列。
 *  ★必须加 `bcharg` 类：`bossBuildPlat` 的 `.bcharg` 出生即 opacity=0、
 *    由 `BOSS.reveal` 逐个点亮；不加的话横线会**一开场就全亮**。
 *  ★非 boss 路径（公式菜单 / 面板）不加 `bcharg` ⇒ `opacity` 默认 1、照常显线。 */
function fracInsertBars(root){
  if(!root||!root.querySelectorAll)return;
  var fs=root.querySelectorAll('.mfrac');
  for(var i=0;i<fs.length;i++){
    var fr=fs[i];
    var bar=null,has=false;
    for(var c=0;c<fr.childNodes.length;c++){
      var nd=fr.childNodes[c];
      if(nd.nodeType!==1)continue;
      if(nd.classList&&nd.classList.contains('fracbar')){bar=nd;has=true;}
    }
    if(!has){                              // 老结构兜底：分子之后补一根
      var num=null;
      for(var c2=0;c2<fr.childNodes.length;c2++){
        var n2=fr.childNodes[c2];
        if(n2.nodeType===1&&n2.classList&&n2.classList.contains('mnum'))num=n2;
      }
      if(!num)continue;
      bar=DD.createElement('span');
      bar.className='fracbar';
      if(num.nextSibling)fr.insertBefore(bar,num.nextSibling);
      else fr.appendChild(bar);
    }
    if(bar&&bar.classList&&!bar.classList.contains('bcharg'))
      bar.classList.add('bcharg');
  }
}

   *  相邻行）落进 [0,W) ⇒ 别处被 `overflow:hidden` 裁掉。

   *  再上面一行**」—— 只要还在滚动，项就会跨行搬家，"按顺序"就无从谈起。

   *  的两半**落在同一水平位置；如果每行再叠各自的 dx，两半就会错开（实测 11.89px ⇒
   *  A30 的 |Δx|−W 爆掉），行界上会出现可见接缝。整块一起摆则既满足「左右随机晃动」
   *  又不破坏接续。竖向晃动仍逐行独立（那是另一条要求，且不跨行）。 */

      for(var j=0;j<FRAGS.length;j++)if(FRAGS[j].ce===ce&&FRAGS[j].hasFrag){frag=FRAGS[j];break;}
      if(frag){var _fx=frag.x,_fy=frag.y;
        if(!isFinite(_fx))_fx=W/2; if(_fx<-400)_fx=-400; if(_fx>W+400)_fx=W+400;
        if(!isFinite(_fy))_fy=gy; if(_fy<0)_fy=0; if(_fy>H)_fy=H;
        asmQ.push({ce:ce,fromX:_fx,fromY:_fy,fromRot:frag.rot,fs:frag.el.style.fontSize,el:frag.el});}
      else{var fromLeft=Math.random()<0.5;
        asmQ.push({ce:ce,fromX:fromLeft?-(200+Math.random()*180):(W+200+Math.random()*180),
          fromY:gy-20-Math.random()*40,fromRot:0,fs:getComputedStyle(ce).fontSize,el:null});}
    }
    asmT=0;
  }
  function stepAssemble(dt){
    asmT+=dt;
    while(asmQ.length>0&&asmT>=INTV){
      asmT-=INTV;var item=asmQ.shift();
      var r=item.ce.getBoundingClientRect();var tx=r.left+r.width/2,ty=r.top+r.height/2;
      if(!isFinite(tx))tx=W/2; if(!isFinite(ty))ty=gy;
      var el=item.el;
      if(!el){el=document.createElement("div");el.className="bossfrag";
        el.textContent=(item.ce.textContent||"");el.style.fontSize=item.fs;
        el.style.setProperty("--r","0deg");document.body.appendChild(el);}
      el.style.left=item.fromX.toFixed(1)+"px";el.style.top=item.fromY.toFixed(1)+"px";
      el.style.setProperty("--r",item.fromRot.toFixed(1)+"deg");
      asmActive.push({el:el,ce:item.ce,fromX:item.fromX,fromY:item.fromY,
        fromRot:item.fromRot,tx:tx,ty:ty,t:0,dur:DUR});
    }
    for(var i=asmActive.length-1;i>=0;i--){
      var f=asmActive[i];f.t+=dt;
      var p=Math.min(1,f.t/f.dur);
      var e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      var _nx=f.fromX+(f.tx-f.fromX)*e,_ny=f.fromY+(f.ty-f.fromY)*e;
      if(!isFinite(_nx))_nx=f.fromX; if(!isFinite(_ny))_ny=f.fromY;
      f.el.style.left=_nx.toFixed(1)+"px";f.el.style.top=_ny.toFixed(1)+"px";
      f.el.style.setProperty("--r",(f.fromRot*(1-e)).toFixed(1)+"deg");
      if(p>=1){f.ce.classList.add("on");
        if(f.el.parentNode)f.el.parentNode.removeChild(f.el);
        asmActive.splice(i,1);BOSS.reveal=(BOSS.reveal||0)+1;}
    }
    if(asmQ.length===0&&asmActive.length===0){
      BOSS.reveal=BOSS.chars.length;ph2="done";BOSS.ph="platform";BOSS.t=0;
      for(var k=0;k<FRAGS.length;k++)if(FRAGS[k].el&&FRAGS[k].el.parentNode)FRAGS[k].el.parentNode.removeChild(FRAGS[k].el);
      for(var m=0;m<SHOCKS.length;m++)if(SHOCKS[m].el&&SHOCKS[m].el.parentNode)SHOCKS[m].el.parentNode.removeChild(SHOCKS[m].el);
      FRAGS=[];asmActive=[];asmQ=[];SHOCKS=[];started=false;document.body.classList.remove("boss-notrans");}
    BOSS.platT+=dt;
    if(typeof bossPlatLayout==="function")bossPlatLayout();
  }
  function myStep(){
    if(typeof BOSS==="undefined"||!BOSS){
      for(var i=0;i<FRAGS.length;i++)if(FRAGS[i].el&&FRAGS[i].el.parentNode)FRAGS[i].el.parentNode.removeChild(FRAGS[i].el);
      for(var j=asmActive.length-1;j>=0;j--)if(asmActive[j].el.parentNode)asmActive[j].el.parentNode.removeChild(asmActive[j].el);
      for(var m=0;m<SHOCKS.length;m++)if(SHOCKS[m].el&&SHOCKS[m].el.parentNode)SHOCKS[m].el.parentNode.removeChild(SHOCKS[m].el);
      FRAGS=[];asmActive=[];asmQ=[];SHOCKS=[];started=false;ph2="idle";document.body.classList.remove("boss-notrans");return;}
    if(!started&&BOSS.ph==="shake"&&BOSS.chars&&BOSS.chars.length){
      started=true;startShrapnel();ph2="shrapnel";}
    if(ph2==="shrapnel"){BOSS.ph="shrapnel";stepShrapnel(1/60);}
    else if(ph2==="assemble"){BOSS.ph="assemble";stepAssemble(1/60);}
  }
  function loop(){requestAnimationFrame(loop);myStep();}
  loop();
  if(typeof window.__tick==="function"){
    var _tk=window.__tick;
    window.__tick=function(n,d){var r=_tk.apply(this,arguments);myStep();return r;};
  }
})();
</script>
