<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>echo 液态玻璃 · SVG feDisplacementMap + Snell 折射</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff; /* 纯白背景 */
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 跟随鼠标的三维黄色球体（位于玻璃之后，z: 白底(0) < 球体(1) < 玻璃(2)） */
  #orb {
    position: fixed;
    left: 0;
    top: 0;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    /* 多层渐变 + 内阴影模拟受光球体：高光点 + 亮部 → 暗部 + 终止阴影 */
    background:
      radial-gradient(circle at 33% 27%,
        rgba(255, 255, 255, 0.98) 0%,
        rgba(255, 255, 255, 0) 9%),
      radial-gradient(circle at 36% 32%,
        #fff3b0 0%,
        #ffd633 26%,
        #ffb300 58%,
        #d98a00 84%,
        #9c5e00 100%);
    box-shadow:
      inset -18px -22px 46px rgba(120, 70, 0, 0.5),
      inset 10px 12px 26px rgba(255, 255, 255, 0.4),
      0 26px 50px rgba(170, 110, 0, 0.22);
    filter: blur(1.5px);   /* 仅轻微抗锯齿，保留球体实体感 */
    z-index: 0;
    pointer-events: none;
    will-change: transform;
  }

  /* 玻璃网格容器：不创建会切断 backdrop 的后代分组属性（无 filter/transform/opacity） */
  #stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  #grid {
    display: grid;
    gap: 0;              /* 紧挨在一起，无间距 */
    width: 100vw;        /* 占满全屏 */
    height: 100vh;
    overflow: hidden;    /* 铺满所需的末行超出底部则裁掉 */
    /* 列数由 JS 按屏幕宽度动态设置，瓦片保持正方形 */
  }

  /* 圆形/方形液滴玻璃块铺满网格：半透明表面 + 共享 SVG 折射滤镜 */
  .tile {
    aspect-ratio: 1 / 1;   /* 保持正方形，铺满靠增加数量而非拉伸 */
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.05); /* 更低白雾，更通透 */
  }

  /* iOS 风格细内描边，提升玻璃边缘清晰度 */
  .tile.liquid-glass-border {
    box-shadow:
      inset 0.5px 0 0 0 rgba(0, 0, 0, 0.2),
      inset -0.5px 0 0 0 rgba(0, 0, 0, 0.2),
      inset 0 0.5px 0 0 rgba(255, 255, 255, 0.2),
      inset 0 -0.5px 0 0 rgba(255, 255, 255, 0.2);
  }

  #fallback {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #4a4a4a;
    padding: 24px;
    box-sizing: border-box;
    z-index: 5;
  }
  #fallback.show { display: flex; }
  #fallback .box { max-width: 420px; line-height: 1.6; font-size: 15px; }
  #fallback h1 { font-size: 18px; margin: 0 0 12px; color: #222; }
</style>
</head>
<body>
  <div id="orb"></div>
  <div id="stage">
    <div id="grid"></div>
  </div>
  <div id="fallback">
    <div class="box">
      <h1>当前浏览器不支持 backdrop-filter</h1>
      <p>本方案依赖 <code>backdrop-filter: url(#filter)</code>（Chrome / Edge 支持最佳）。折射效果无法呈现，但黄色球体仍会在半透明玻璃后可见。建议使用最新版 Chrome / Edge 打开以获得液态玻璃折射。</p>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     以下算法逐字移植自 echo-liquid-glass（index.js），
     未做任何数学改写：Snell 折射剖面 + 位移/高光贴图 + SVG 滤镜。
     ============================================================ */

  /**
   * 计算折射剖面（Snell 定律物理模型）
   */
  function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
    samples = samples || 128;
    var eta = 1 / ior;
    function refract(nx, ny) {
      var dot = ny;
      var k = 1 - eta * eta * (1 - dot * dot);
      if (k < 0) return null;
      var sq = Math.sqrt(k);
      return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
    }
    var profile = new Float64Array(samples);
    for (var i = 0; i < samples; i++) {
      var x = i / samples;
      var y = heightFn(x);
      var dx = x < 1 ? 0.0001 : -0.0001;
      var y2 = heightFn(x + dx);
      var deriv = (y2 - y) / dx;
      var mag = Math.sqrt(deriv * deriv + 1);
      var ref = refract(-deriv / mag, -1 / mag);
      if (!ref) { profile[i] = 0; continue; }
      profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
    }
    return profile;
  }

  /**
   * 生成位移贴图（Canvas → DataURL）
   * 针对圆角矩形优化
   */
  function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255;
    }
    var r = Math.min(radius, Math.min(w, h) / 2 - 1);
    if (r <= 0) return c.toDataURL();
    var clampedBezel = Math.min(bezelWidth, r - 1);
    if (clampedBezel <= 1) return c.toDataURL();
    var rSq = r * r;
    var r1Sq = (r + 1) * (r + 1);
    var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
    var wB = w - r * 2;
    var hB = h - r * 2;
    var S = profile.length;
    if (wB < 0 || hB < 0) return c.toDataURL();

    for (var y1 = 0; y1 < h; y1++) {
      for (var x1 = 0; x1 < w; x1++) {
        var dx, dy;
        if (x1 < r) { dx = x1 - r; }
        else if (x1 >= w - r) { dx = x1 - r - wB; }
        else { dx = 0; }
        if (y1 < r) { dy = y1 - r; }
        else if (y1 >= h - r) { dy = y1 - r - hB; }
        else { dy = 0; }
        var dSq = dx * dx + dy * dy;
        if (dSq > r1Sq || dSq < rBSq) continue;
        var dist = Math.sqrt(dSq);
        var fromSide = r - dist;
        var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
        if (op <= 0 || dist === 0) continue;
        var cos = dx / dist;
        var sin = dy / dist;
        var bi = Math.min(Math.floor((fromSide / clampedBezel) * S), S - 1);
        var disp = profile[bi] || 0;
        var dX = (-cos * disp) / maxDisp;
        var dY = (-sin * disp) / maxDisp;
        var idx = (y1 * w + x1) * 4;
        d[idx] = Math.min(255, Math.max(0, (128 + dX * 127 * op + 0.5) | 0));
        d[idx + 1] = Math.min(255, Math.max(0, (128 + dY * 127 * op + 0.5) | 0));
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }

  /**
   * 生成高光贴图
   */
  function generateSpecularMap(w, h, radius, bezelWidth, angle) {
    angle = angle != null ? angle : Math.PI / 3;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0;
    }
    var r = Math.min(radius, Math.min(w, h) / 2 - 1);
    if (r <= 0) return c.toDataURL();
    var clampedBezel = Math.min(bezelWidth, r - 1);
    if (clampedBezel <= 1) return c.toDataURL();
    var rSq = r * r;
    var r1Sq = (r + 1) * (r + 1);
    var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
    var wB = w - r * 2;
    var hB = h - r * 2;
    var lightVec = [Math.cos(angle), Math.sin(angle)];

    for (var y1 = 0; y1 < h; y1++) {
      for (var x1 = 0; x1 < w; x1++) {
        var dx, dy;
        if (x1 < r) { dx = x1 - r; }
        else if (x1 >= w - r) { dx = x1 - r - wB; }
        else { dx = 0; }
        if (y1 < r) { dy = y1 - r; }
        else if (y1 >= h - r) { dy = y1 - r - hB; }
        else { dy = 0; }
        var dSq = dx * dx + dy * dy;
        if (dSq > r1Sq || dSq < rBSq) continue;
        var dist = Math.sqrt(dSq);
        var fromSide = r - dist;
        var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
        if (op <= 0 || dist === 0) continue;
        var cos = dx / dist;
        var sin = -dy / dist;
        var dot = Math.abs(cos * lightVec[0] + sin * lightVec[1]);
        var edge = Math.sqrt(Math.max(0, 1 - Math.pow(1 - fromSide, 2)));
        var coeff = dot * edge;
        var col = (255 * coeff) | 0;
        var alpha = Math.min(255, Math.max(0, (col * coeff * op * 0.85) | 0));
        var idx = (y1 * w + x1) * 4;
        d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }

  function squircleSurface(t) {
    return Math.pow(1 - Math.pow(1 - t, 4), 0.25);
  }

  function buildSVGFilter(filterId, dispUrl, specUrl, scale, w, h, specOpacity) {
    specOpacity = specOpacity != null ? specOpacity : 0.3;
    var fc = '';
    fc += '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />';
    fc += '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale + '" xChannelSelector="R" yChannelSelector="G" result="displaced" />';
    if (specUrl) {
      fc += '<feImage href="' + specUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="spec_layer" />';
      fc += '<feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />';
      fc += '<feComponentTransfer in="spec_layer" result="spec_faded"><feFuncA type="linear" slope="' + specOpacity + '" /></feComponentTransfer>';
      fc += '<feBlend in="spec_masked" in2="displaced" mode="screen" result="with_spec" />';
      fc += '<feBlend in="spec_faded" in2="with_spec" mode="screen" />';
    }
    return fc;
  }

  /* ============================================================
     场景搭建：5×5 静止圆角玻璃网格 + 黄色球体（鼠标 lerp 跟随）
     ============================================================ */

  // 调参（起点，见报告）
  var THICKNESS = 200;            // 增加玻璃厚度 → 折射更强、透镜感更明显
  var BEZEL_WIDTH = 40;            // safeBezel 运行时再 clamp 到 radius-1
  var IOR = 2.5;
  var SPECULAR_OPACITY = 0.25;    // 高光进一步减淡，更通透
  var BLUR_AMOUNT = 1;            // 更通透：磨砂几乎去掉，保留折射为主
  var FILTER_ID = 'liquid-glass-filter';
  var SVG_ID = 'liquid-glass-svg';
  var TILE_SIDE = 160;           // 目标瓦片边长(px)，保持正方形；铺满靠增加数量而非拉伸

  var grid = document.getElementById('grid');
  var orb = document.getElementById('orb');
  var svgEl = null;
  var defsEl = null;
  var tiles = [];
  var gridCols = 0, gridRows = 0;   // 当前网格列/行数（layoutTiles 维护）
  var tileS = 0;                    // 瓦片边长（正方形），像素
  var winFilters = '';              // 生效的液态滤镜串
  var activeMap = {};               // 当前启用 backdrop-filter 的瓦片索引集合

  // 按屏幕动态铺满：列数 = 宽度÷边长向上取整；行数 = 覆盖屏幕高度所需（多 1 行兜底裁切）
  function layoutTiles() {
    gridCols = Math.max(5, Math.ceil(window.innerWidth / TILE_SIDE));
    gridRows = Math.max(5, Math.ceil(window.innerHeight * gridCols / window.innerWidth)) + 1;
    var need = gridCols * gridRows;
    while (tiles.length < need) {
      var tile = document.createElement('div');
      tile.className = 'tile liquid-glass-border';
      grid.appendChild(tile);
      tiles.push(tile);
    }
    // 行高不设：由瓦片 aspect-ratio 决定(正方形)；列宽 1fr 均分
    grid.style.gridTemplateColumns = 'repeat(' + gridCols + ', 1fr)';
    tileS = grid.offsetWidth / gridCols;   // 正方形瓦片边长
  }

  function ensureSVG() {
    var old = document.getElementById(SVG_ID);
    if (old) old.parentNode.removeChild(old);
    svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgEl.setAttribute('id', SVG_ID);
    svgEl.setAttribute('width', '0');
    svgEl.setAttribute('height', '0');
    svgEl.setAttribute('style', 'position:absolute;overflow:hidden;pointer-events:none;');
    svgEl.setAttribute('color-interpolation-filters', 'sRGB');
    defsEl = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    svgEl.appendChild(defsEl);
    document.body.appendChild(svgEl);
  }

  function writeFilter(filterHTML) {
    if (!defsEl) return;
    var old = defsEl.querySelector('#' + FILTER_ID);
    if (old) old.remove();
    if (!filterHTML) return;
    var filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    filter.setAttribute('id', FILTER_ID);
    filter.setAttribute('x', '0%');
    filter.setAttribute('y', '0%');
    filter.setAttribute('width', '100%');
    filter.setAttribute('height', '100%');
    filter.innerHTML = filterHTML;
    defsEl.appendChild(filter);
  }

  // 所有 tile 尺寸相同：测量其中一块，生成一次位移/高光贴图，构建单一滤镜并应用到全部 tile
  function rebuildFilter() {
    if (!tiles.length || !defsEl) return;
    var el = tiles[0];
    var w = Math.round(el.offsetWidth);
    var h = Math.round(el.offsetHeight);
    if (w < 4 || h < 4) return;

    var style = getComputedStyle(el);
    var cssRadius = parseFloat(style.borderRadius) || 9999;
    var radius = Math.min(cssRadius, w / 2, h / 2);
    var safeBezel = Math.min(BEZEL_WIDTH, radius - 1, Math.min(w, h) / 2 - 1);
    if (safeBezel <= 1) { writeFilter(''); return; }

    var profile = calculateRefractionProfile(THICKNESS, safeBezel, squircleSurface, IOR, 128);
    var maxDisp = Math.max.apply(Math, Array.from(profile).map(Math.abs)) || 1;
    var scale = maxDisp * 0.8;

    var dispUrl = generateDisplacementMap(w, h, radius, safeBezel, profile, maxDisp);
    var specUrl = '';
    if (SPECULAR_OPACITY > 0.001) {
      specUrl = generateSpecularMap(w, h, radius, safeBezel * 2.5); // 角度默认 PI/3
    }
    var filterHTML = buildSVGFilter(FILTER_ID, dispUrl, specUrl, scale, w, h, SPECULAR_OPACITY);
    writeFilter(filterHTML);

    // 只构建滤镜串；不直接应用到全部瓦片——由 updateGlassWindow 仅对光球附近启用
    winFilters = 'url(#' + FILTER_ID + ')';
    if (BLUR_AMOUNT > 0.5) winFilters += ' blur(' + BLUR_AMOUNT.toFixed(1) + 'px)';
    clearActiveWindow();   // 瓦片尺寸可能变化，重置窗口
  }

  // ---- 液态滤镜窗口：仅光球所在瓦片及其邻接瓦片启用 backdrop-filter（其余静态零成本）----
  var WIN_R = 1;   // 窗口半径（格数）：1 => 3×3

  function applyBF(t) {
    t.style.setProperty('backdrop-filter', winFilters, 'important');
    t.style.setProperty('-webkit-backdrop-filter', winFilters, 'important');
  }
  function removeBF(t) {
    t.style.removeProperty('backdrop-filter');
    t.style.removeProperty('-webkit-backdrop-filter');
  }
  function clearActiveWindow() {
    for (var k in activeMap) removeBF(tiles[+k]);
    activeMap = {};
  }
  function tileIndexAt(cx, cy) {
    if (!gridCols || tileS < 2) return -1;
    var gr = grid.getBoundingClientRect();
    var c = Math.floor((cx - gr.left) / tileS);
    var r = Math.floor((cy - gr.top) / tileS);
    if (c < 0 || r < 0 || c >= gridCols || r >= gridRows) return -1;
    return r * gridCols + c;
  }
  function updateGlassWindow() {
    if (!winFilters) return;
    var idx = tileIndexAt(mx, my);
    var want = {};
    if (idx >= 0) {
      var r0 = Math.floor(idx / gridCols), c0 = idx % gridCols;
      for (var dr = -WIN_R; dr <= WIN_R; dr++) {
        for (var dc = -WIN_R; dc <= WIN_R; dc++) {
          var r = r0 + dr, c = c0 + dc;
          if (r >= 0 && r < gridRows && c >= 0 && c < gridCols) want[r * gridCols + c] = 1;
        }
      }
    }
    // 增量更新：只改有变化的瓦片，避免每帧写样式
    for (var k in activeMap) if (!want[k]) removeBF(tiles[+k]);
    for (var k2 in want) if (!activeMap[k2]) applyBF(tiles[+k2]);
    activeMap = want;
  }

  // ---- 黄色球体：鼠标 lerp 平滑跟随（停稳即停止动画，避免无谓重绘）----
  var mx = window.innerWidth / 2;
  var my = window.innerHeight / 2;
  var tx = mx, ty = my;
  var settled = false;
  function setTarget(cx, cy) { tx = cx; ty = cy; }
  function wake() { if (settled) { settled = false; requestAnimationFrame(animateOrb); } }
  window.addEventListener('mousemove', function (e) { setTarget(e.clientX, e.clientY); wake(); });
  window.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 0) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    wake();
  }, { passive: true });

  function animateOrb() {
    mx += (tx - mx) * 0.12;
    my += (ty - my) * 0.12;
    orb.style.transform = 'translate(' + mx + 'px,' + my + 'px) translate(-50%,-50%)';
    updateGlassWindow();   // 液态滤镜只跟随光球附近
    if (Math.abs(tx - mx) < 0.5 && Math.abs(ty - my) < 0.5) { settled = true; return; }  // 停稳即停
    requestAnimationFrame(animateOrb);
  }

  // ---- 尺寸变化：debounce ~50ms 重建（位移贴图随 tile 实际尺寸）----
  var rebuildTimer = null;
  function scheduleRebuild() {
    layoutTiles();   // 窗口尺寸变化时重算列数/数量，保持正方形铺满
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(function () {
      rebuildFilter();      // 重建滤镜
      updateGlassWindow();  // 重建后窗口跟随当前光球位置
    }, 50);
  }
  window.addEventListener('resize', scheduleRebuild);
  if (typeof ResizeObserver !== 'undefined') {
    var ro = new ResizeObserver(scheduleRebuild);
    ro.observe(grid);
  }

  // ---- 启动 ----
  function init() {
    ensureSVG();
    layoutTiles();
    rebuildFilter();
    animateOrb();   // 直接首帧（内部自调度；停稳后自动停止）

    // 不支持 backdrop-filter 时给出降级提示（仍保留半透明玻璃 + 光团）
    var supportsBD = !!(window.CSS && window.CSS.supports) &&
      (window.CSS.supports('backdrop-filter', 'blur(2px)') ||
       window.CSS.supports('-webkit-backdrop-filter', 'blur(2px)'));
    if (!supportsBD) {
      document.getElementById('fallback').classList.add('show');
    }
  }

  // 等一帧确保布局完成后再测量 tile 尺寸
  requestAnimationFrame(init);
})();
</script>
</body>
</html>
